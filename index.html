<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neuly">
  <meta name="format-detection" content="telephone=no">
  <title>Neuly - Natural Medicine Research Platform</title>
  <!-- If the frontend is hosted separately from the API (e.g. static hosting),
       set content to the API server's origin. Empty = same-origin /api. -->
  <meta name="neuly-api-base" content="https://neuly-web.onrender.com">
  <!-- Vendored locally (see /vendor) so the app has no third-party CDN dependency -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0a0f0d; font-family: 'DM Sans', sans-serif; }
    html { scroll-behavior: smooth; }
    ::selection { background: rgba(125, 211, 192, 0.3); }
    input::placeholder, textarea::placeholder { color: #6b7370; }
    @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes floatScreen { 0%, 100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
    @keyframes progressPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0f0d; }
    ::-webkit-scrollbar-thumb { background: rgba(125, 211, 192, 0.3); border-radius: 4px; }

    /* ============ Mobile app chrome (bottom tab bar) ============ */
    .neuly-tabbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-around; align-items: stretch;
      gap: 4px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(12, 17, 15, 0.92);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .neuly-tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 8px 4px; border: none; border-radius: 14px;
      background: transparent; color: #6b7370; font-family: 'DM Sans', sans-serif;
      font-size: 10.5px; font-weight: 600; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background 0.15s, color 0.15s;
    }
    .neuly-tab .icon { font-size: 22px; line-height: 1; }
    .neuly-tab.active { color: #7dd3c0; background: rgba(125, 211, 192, 0.12); }
    .neuly-tab:active { background: rgba(255,255,255,0.08); }

    .neuly-sheet-backdrop {
      position: fixed; inset: 0; z-index: 210;
      background: rgba(0,0,0,0.55);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      animation: fadeIn 0.15s;
    }
    .neuly-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 220;
      background: #141918; border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
      animation: slideUp 0.22s;
    }
    .neuly-sheet .grabber { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 4px auto 14px; }
    .neuly-sheet-item {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 14px 12px; border: none; border-radius: 12px; background: transparent;
      color: #e8ebe9; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 500;
      cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent;
    }
    .neuly-sheet-item:active { background: rgba(255,255,255,0.06); }
    .neuly-sheet-item .icon { font-size: 20px; width: 28px; text-align: center; }
    .neuly-sheet-item.danger { color: #e57373; }

    /* ============ Responsive overrides for inline-styled layout ============ */
    @media (max-width: 1024px) {
      /* Stat rows and card grids: 4-5 across -> 2 across */
      [style*="grid-template-columns: repeat(4, 1fr)"],
      [style*="grid-template-columns: repeat(5, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
      /* Two-pane layouts stack */
      [style*="grid-template-columns: 2fr 1fr"],
      [style*="grid-template-columns: 1.2fr 0.8fr"] { grid-template-columns: 1fr !important; }
      /* Wide card minimums shrink to fit */
      [style*="minmax(380px"] { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important; }
      /* Fixed-width decorative blocks scale down */
      [style*="width: 500px"], [style*="width: 600px"],
      [style*="width: 700px"], [style*="width: 800px"] { width: 100% !important; max-width: 100% !important; }
      /* Hero: text + floating screenshot stack vertically */
      [style*="gap: 80px"][style*="display: flex"] { flex-direction: column !important; gap: 48px !important; }
      [style*="padding: 120px 40px 80px"] { padding: 110px 20px 60px !important; }
      /* Sidebar + content layouts stack (research agent, dashboard) */
      [style*="padding-top: 100px"][style*="display: flex"] { flex-direction: column !important; }
      [style*="width: 280px"][style*="border-right"] {
        width: 100% !important; height: auto !important; position: static !important;
        border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      /* Table-style rows scroll horizontally instead of crushing */
      [style*="grid-template-columns: 1fr 1fr 120px 120px 100px"] { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 640px) {
      [style*="grid-template-columns: repeat(3, 1fr)"],
      [style*="grid-template-columns: 1fr 1fr 1fr"],
      [style*="grid-template-columns: repeat(2, 1fr)"],
      [style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
      [style*="grid-template-columns: repeat(4, 1fr)"],
      [style*="grid-template-columns: repeat(5, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
      [style*="minmax(380px"], [style*="minmax(320px"], [style*="minmax(280px"] { grid-template-columns: 1fr !important; }
      /* Page gutters */
      [style*="padding: 0 40px"] { padding: 0 20px !important; }
      /* Display headings scale down */
      [style*="font-size: 52px"] { font-size: 34px !important; }
      [style*="font-size: 48px"] { font-size: 32px !important; }
      [style*="font-size: 42px"] { font-size: 28px !important; }
      [style*="font-size: 36px"] { font-size: 26px !important; }
      /* Filter rows wrap cleanly */
      [style*="min-width: 250px"] { min-width: 100% !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // Mobile/tablet detection — drives the iOS-style app chrome
    const useIsMobile = () => {
      const [isMobile, setIsMobile] = useState(() => window.matchMedia('(max-width: 1024px)').matches);
      useEffect(() => {
        const mq = window.matchMedia('(max-width: 1024px)');
        const onChange = (e) => setIsMobile(e.matches);
        mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
        return () => mq.removeEventListener ? mq.removeEventListener('change', onChange) : mq.removeListener(onChange);
      }, []);
      return isMobile;
    };

    // API Configuration. Resolution order:
    //   1. <meta name="neuly-api-base"> — for a static-hosted frontend (e.g.
    //      Netlify) pointing at a separately deployed API server. Ignored on
    //      localhost so local development always talks to its own server.
    //   2. same-origin /api — production default; the Express server serves
    //      this file and the API together
    //   3. localhost:3001 — when opened directly as a local file
    const apiBaseMeta = document.querySelector('meta[name="neuly-api-base"]');
    const isLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const API_BASE_URL = (apiBaseMeta && apiBaseMeta.content && !isLocalhost)
      ? apiBaseMeta.content.replace(/\/+$/, '') + '/api'
      : window.location.protocol === 'file:' ? 'http://localhost:3001/api' : '/api';
    console.log('Neuly API base:', API_BASE_URL);

    // API Helper Functions. credentials: 'include' carries the session
    // cookie so accounts work even when the frontend is hosted on a
    // different origin than the API.
    const api = {
      async get(endpoint) {
        try {
          const response = await fetch(`${API_BASE_URL}${endpoint}`, { credentials: 'include' });
          if (!response.ok) throw new Error('API request failed');
          return await response.json();
        } catch (error) {
          console.error(`API Error: ${endpoint}`, error);
          return null;
        }
      },

      // Mutating requests throw with the server's error message so forms
      // (signup/login, save buttons) can surface it to the user.
      async send(method, endpoint, body) {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, {
          method,
          credentials: 'include',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined
        });
        const data = await response.json().catch(() => null);
        if (!response.ok) throw new Error((data && data.error) || `Request failed (${response.status})`);
        return data;
      },
      post(endpoint, body) { return this.send('POST', endpoint, body); },
      del(endpoint) { return this.send('DELETE', endpoint); },

      async getDashboard() {
        return this.get('/dashboard');
      },

      async getClinicalTrials(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/clinical-trials${query ? '?' + query : ''}`);
      },

      async getResearchPapers(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/research${query ? '?' + query : ''}`);
      },

      async getCompanies(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/companies${query ? '?' + query : ''}`);
      },

      async getPeople(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/people${query ? '?' + query : ''}`);
      },

      async getJobs(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/jobs${query ? '?' + query : ''}`);
      },

      async getEvents(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/events${query ? '?' + query : ''}`);
      },

      async getEducation(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/education${query ? '?' + query : ''}`);
      },

      async search(query) {
        return this.get(`/search?q=${encodeURIComponent(query)}`);
      }
    };

    // Data Context for sharing API data across components
    const DataContext = createContext(null);

    // Datasets held in context, the API call that loads each, and the
    // change-log entity types that should trigger a refetch of it.
    const DATASET_LOADERS = {
      companies: () => api.getCompanies({ limit: 1000 }),
      people: () => api.getPeople({ limit: 2000 }),
      clinicalTrials: () => api.getClinicalTrials({ limit: 3000 }),
      researchPapers: () => api.getResearchPapers({ limit: 2000 }),
      jobs: () => api.getJobs({ limit: 1000 }),
      events: () => api.getEvents({ limit: 500 }),
      education: () => api.getEducation({ limit: 500 })
    };
    const ENTITY_TO_DATASET = {
      companies: 'companies', people: 'people', clinical_trials: 'clinicalTrials', research_papers: 'researchPapers',
      jobs: 'jobs', events: 'events', educational_resources: 'education'
    };
    // A cold-start crawl lands thousands of changes in bursts; refetch a
    // dataset at most this often so the browser isn't hammered.
    const MIN_REFETCH_MS = 30000;

    const DataProvider = ({ children }) => {
      const [apiData, setApiData] = useState({
        companies: [],
        people: [],
        clinicalTrials: [],
        researchPapers: [],
        jobs: [],
        events: [],
        education: [],
        stats: null,
        loading: true,
        error: null,
        usingApi: false,
        attempts: 0,
        // Live layer: streamed change events, per-dataset freshness, and a
        // version counter pages watch to refetch their own endpoints.
        liveEvents: [],
        liveTypes: [],
        freshness: [],
        liveVersion: 0,
        lastSync: null,
        liveStatus: 'connecting'
      });

      useEffect(() => {
        let cancelled = false;
        let attempt = 0;
        let source = null;
        let pollTimer = null;
        let refetchTimer = null;
        const pendingKeys = new Set();
        const lastFetchedAt = {};
        let pollCursor = new Date().toISOString();

        const fetchData = async () => {
          try {
            const dashboard = await api.getDashboard();
            if (!dashboard || !dashboard.counts) throw new Error('API unreachable');

            const keys = Object.keys(DATASET_LOADERS);
            const results = await Promise.all(keys.map(k => DATASET_LOADERS[k]()));
            if (cancelled) return true;
            const loaded = {};
            keys.forEach((k, i) => { loaded[k] = results[i]?.data || []; lastFetchedAt[k] = Date.now(); });
            lastFetchedAt.__stats = Date.now();

            setApiData(prev => ({
              ...prev,
              ...loaded,
              stats: dashboard,
              loading: false,
              error: null,
              usingApi: true,
              attempts: 0,
              lastSync: new Date().toISOString()
            }));
            console.log('✅ Connected to Neuly API - using live data');
            return true;
          } catch (error) {
            if (!cancelled) {
              setApiData(prev => ({ ...prev, loading: false, error: error.message, usingApi: false, attempts: prev.attempts + 1 }));
            }
            return false;
          }
        };

        // Refetch only the datasets the new changes touched, plus the
        // dashboard counts ('__stats'), each throttled to MIN_REFETCH_MS.
        const loaderFor = (k) => (k === '__stats' ? api.getDashboard() : DATASET_LOADERS[k]());
        const flushRefetch = async () => {
          refetchTimer = null;
          const now = Date.now();
          const waiting = [...pendingKeys];
          const due = waiting.filter(k => !lastFetchedAt[k] || now - lastFetchedAt[k] >= MIN_REFETCH_MS);
          const deferred = waiting.filter(k => !due.includes(k));
          due.forEach(k => { pendingKeys.delete(k); lastFetchedAt[k] = now; });
          if (deferred.length > 0) {
            const wait = Math.max(1000, ...deferred.map(k => MIN_REFETCH_MS - (now - lastFetchedAt[k])));
            refetchTimer = setTimeout(flushRefetch, wait);
          }
          if (due.length === 0) return;
          const results = await Promise.all(due.map(loaderFor));
          if (cancelled) return;
          setApiData(prev => {
            const next = { ...prev, lastSync: new Date().toISOString() };
            due.forEach((k, i) => {
              const res = results[i];
              if (k === '__stats') { if (res && res.counts) next.stats = res; }
              else if (res && res.data) next[k] = res.data;
            });
            return next;
          });
        };

        const scheduleRefetch = (types) => {
          pendingKeys.add('__stats');
          (types || []).forEach(t => { if (ENTITY_TO_DATASET[t]) pendingKeys.add(ENTITY_TO_DATASET[t]); });
          if (!refetchTimer) refetchTimer = setTimeout(flushRefetch, 2000);
        };

        const applyChanges = (payload) => {
          if (!payload) return;
          const events = payload.events || [];
          if (events.length === 0 && !payload.freshness) return;
          setApiData(prev => {
            const known = new Set(prev.liveEvents.map(e => e.id));
            const fresh = events.filter(e => !known.has(e.id));
            return {
              ...prev,
              liveEvents: [...fresh, ...prev.liveEvents].slice(0, 300),
              liveTypes: payload.types || prev.liveTypes,
              freshness: payload.freshness || prev.freshness,
              liveVersion: events.length > 0 ? prev.liveVersion + 1 : prev.liveVersion,
              lastSync: new Date().toISOString()
            };
          });
          if (events.length > 0) scheduleRefetch(payload.types || events.map(e => e.entityType));
        };

        // Fallback when streaming isn't available (old browsers, proxies
        // that buffer SSE): poll the change log once a minute.
        const startPolling = () => {
          if (pollTimer || cancelled) return;
          setApiData(prev => ({ ...prev, liveStatus: 'polling' }));
          const tick = async () => {
            const res = await api.get(`/changes?since=${encodeURIComponent(pollCursor)}&limit=200`);
            const events = (res && res.data) || [];
            if (events.length > 0) {
              pollCursor = events.reduce((max, e) => (e.detectedAt > max ? e.detectedAt : max), pollCursor);
              const fresh = await api.get('/freshness');
              applyChanges({ events, types: [...new Set(events.map(e => e.entityType))], freshness: fresh && fresh.data });
            }
          };
          pollTimer = setInterval(tick, 60000);
        };

        const startStream = () => {
          if (typeof EventSource === 'undefined') { startPolling(); return; }
          let failures = 0;
          source = new EventSource(`${API_BASE_URL}/live`, { withCredentials: true });
          source.addEventListener('hello', (e) => {
            failures = 0;
            let data = null;
            try { data = JSON.parse(e.data); } catch (err) { /* ignore malformed frame */ }
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            setApiData(prev => ({ ...prev, liveStatus: 'streaming', freshness: (data && data.freshness) || prev.freshness }));
          });
          source.addEventListener('changes', (e) => {
            try { applyChanges(JSON.parse(e.data)); } catch (err) { /* ignore malformed frame */ }
          });
          source.onerror = () => {
            failures += 1;
            // EventSource reconnects on its own; after repeated failures
            // keep data flowing through polling in the meantime.
            if (failures >= 3) startPolling();
          };
        };

        // Keep retrying with backoff until the API answers — the data layer
        // is the product, so there is no static fallback.
        const run = async () => {
          const ok = await fetchData();
          if (!ok && !cancelled) {
            attempt += 1;
            const delay = Math.min(15000, 2000 * attempt);
            console.log(`⏳ API not reachable, retrying in ${delay / 1000}s`);
            setTimeout(run, delay);
          } else if (ok && !cancelled) {
            startStream();
          }
        };
        run();
        return () => {
          cancelled = true;
          if (source) source.close();
          if (pollTimer) clearInterval(pollTimer);
          if (refetchTimer) clearTimeout(refetchTimer);
        };
      }, []);

      return React.createElement(DataContext.Provider, { value: apiData }, children);
    };

    const useApiData = () => useContext(DataContext);

    // ============================================================
    // Accounts — real signup/login against /api/auth/* with session cookies
    // ============================================================
    const displayName = (user) => (user && (user.name || (user.email || '').split('@')[0])) || 'there';
    const initialOf = (user) => (displayName(user)[0] || 'N').toUpperCase();

    const authInputStyle = { width: '100%', padding: '14px 18px', fontSize: '15px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#fff', outline: 'none', fontFamily: '"DM Sans", sans-serif' };

    const AuthModal = ({ mode, setMode, onClose, onAuthed }) => {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState(null);
      const [sent, setSent] = useState(false);
      const [busy, setBusy] = useState(false);
      const isSignup = mode === 'signup';
      const isForgot = mode === 'forgot';

      const submit = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true);
        setError(null);
        try {
          if (isForgot) {
            await api.post('/auth/forgot', { email });
            setSent(true);
            setBusy(false);
            return;
          }
          const res = isSignup
            ? await api.post('/auth/signup', { name, email, password })
            : await api.post('/auth/login', { email, password });
          onAuthed(res.user);
        } catch (err) {
          setError(err.message === 'Failed to fetch' ? 'Could not reach the Neuly API — try again in a moment.' : err.message);
          setBusy(false);
        }
      };

      if (isForgot) {
        return (
          <div onClick={onClose} style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 300, padding: '24px' }}>
            <div onClick={(e) => e.stopPropagation()} style={{ background: 'linear-gradient(180deg, #1a1f1d 0%, #141918 100%)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '24px', padding: '32px', width: '420px', maxWidth: '100%', animation: 'slideUp 0.25s' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                <NeulyLogo height={20} />
                <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: '#6b7370', fontSize: '24px', cursor: 'pointer', lineHeight: 1 }}>×</button>
              </div>
              <h2 style={{ fontFamily: '"Fraunces", serif', fontSize: '26px', fontWeight: 600, color: '#fff', margin: '16px 0 6px' }}>Reset your password</h2>
              {sent ? (
                <p style={{ fontSize: '14px', color: '#a0a8a4', lineHeight: 1.6 }}>If <strong style={{ color: '#fff' }}>{email}</strong> has a Neuly account, a reset link is on its way. It works once and expires in an hour.</p>
              ) : (
                <form onSubmit={submit}>
                  <p style={{ fontSize: '14px', color: '#6b7370', marginBottom: '20px' }}>Enter your email and we'll send a one-time reset link.</p>
                  <div style={{ marginBottom: '18px' }}>
                    <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email" autoComplete="email" style={authInputStyle} />
                  </div>
                  {error && <div style={{ marginBottom: '18px', padding: '12px 16px', fontSize: '13px', color: '#e57373', background: 'rgba(229,115,115,0.1)', border: '1px solid rgba(229,115,115,0.3)', borderRadius: '10px' }}>{error}</div>}
                  <button type="submit" disabled={busy} style={{ ...sharedStyles.button, width: '100%', padding: '15px', opacity: busy ? 0.6 : 1 }}>{busy ? 'Sending…' : 'Send reset link'}</button>
                </form>
              )}
              <p style={{ fontSize: '13px', color: '#6b7370', textAlign: 'center', marginTop: '20px' }}>
                <span onClick={() => { setError(null); setMode('login'); }} style={{ color: '#7dd3c0', cursor: 'pointer', fontWeight: 500 }}>Back to log in</span>
              </p>
            </div>
          </div>
        );
      }

      return (
        <div onClick={onClose} style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 300, padding: '24px' }}>

              {isSignup && (
                <div style={{ marginBottom: '14px' }}>
                  <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Name" autoComplete="name" style={authInputStyle} />

                <input type="password" required minLength={8} value={password} onChange={(e) => setPassword(e.target.value)} placeholder={isSignup ? 'Password (8+ characters)' : 'Password'} autoComplete={isSignup ? 'new-password' : 'current-password'} style={authInputStyle} />
              </div>
              {!isSignup && (
                <div style={{ textAlign: 'right', marginBottom: '18px' }}>
                  <span onClick={() => { setError(null); setMode('forgot'); }} style={{ fontSize: '13px', color: '#6b7370', cursor: 'pointer' }}>Forgot password?</span>

        </div>

    };

    // ============================================================
    // Saved / followed items — persisted per-user via /api/saves
    // ============================================================
    const SavesContext = createContext({ items: [], toggle: () => {}, find: () => null, remove: () => {} });
    const useSaves = () => useContext(SavesContext);

    const SavesProvider = ({ user, requireAuth, children }) => {
      const [items, setItems] = useState([]);

      useEffect(() => {
        let cancelled = false;
        if (!user) { setItems([]); return; }
        api.get('/saves').then(res => { if (!cancelled && res && res.data) setItems(res.data); });
        return () => { cancelled = true; };
      }, [user && user.id]);

      const find = (entityType, entityId, kind = 'save') =>
        items.find(s => s.entityType === entityType && s.entityId === String(entityId) && s.kind === kind) || null;

      const toggle = async (entity, kind = 'save') => {
        if (!user) { requireAuth('signup'); return; }
        const existing = find(entity.entityType, entity.entityId, kind);
        try {
          if (existing) {
            setItems(prev => prev.filter(s => s.id !== existing.id));
            await api.del(`/saves/${existing.id}`);
          } else {
            const res = await api.post('/saves', { ...entity, entityId: String(entity.entityId), kind });
            setItems(prev => [res.data, ...prev.filter(s => s.id !== res.data.id)]);
          }
        } catch (err) {
          console.error('Save failed', err);
          const fresh = await api.get('/saves');
          if (fresh && fresh.data) setItems(fresh.data);
        }
      };

      const remove = async (id) => {
        setItems(prev => prev.filter(s => s.id !== id));
        try { await api.del(`/saves/${id}`); } catch (err) { console.error('Remove failed', err); }
      };

      return React.createElement(SavesContext.Provider, { value: { items, toggle, find, remove } }, children);
    };

    // One button for every Save/Follow surface: outline when inactive,
    // filled when active. Signed-out clicks open the signup modal.
    const SaveButton = ({ entityType, entityId, entityTitle, kind = 'save', style }) => {
      const { toggle, find } = useSaves();
      const active = Boolean(find(entityType, entityId, kind));
      const label = kind === 'follow' ? (active ? 'Following' : 'Follow') : (active ? 'Saved ✓' : 'Save');
      return (
        <button onClick={() => toggle({ entityType, entityId, entityTitle }, kind)} style={{ ...(active ? sharedStyles.button : sharedStyles.buttonOutline), ...style }}>
          {label}
        </button>
      );

    const sharedStyles = {

    const substanceColors = { 'Psilocybin': '#7dd3c0', 'MDMA': '#f0b775', 'Ketamine': '#a8c5e2', 'LSD': '#d4a5c9', 'Ayahuasca': '#98d4a0', 'Ibogaine': '#98d4a0', 'DMT': '#e8c898', '5-MeO-DMT': '#e8c898', 'Mescaline': '#d4a5c9', 'Cannabis': '#e8c898', 'All': '#7dd3c0', 'All Research': '#7dd3c0', 'Multiple': '#a8c5e2' };

    // ============================================================
    // Live-data normalizers — map API records (see crawlers/src/models/types.ts)
    // onto the display shapes the page components render.
    // ============================================================
    const fmtLocation = (loc) => {
      if (!loc) return '—';
      if (typeof loc === 'string') return loc;
      const parts = [loc.facility || loc.venue, loc.city, loc.state, loc.country].filter(Boolean);
      if (loc.remote) parts.push('Remote');
      return parts.length ? parts.join(', ') : '—';
    };

    const pickEmoji = (seed, set) => {
      let h = 7;
      for (const ch of String(seed || '')) h = (h * 31 + ch.charCodeAt(0)) | 0;
      return set[Math.abs(h) % set.length];
    };
    const COMPANY_EMOJIS = ['🧬', '🔬', '💊', '🌿', '🧠', '⚗️', '🌱', '✨', '🍄', '🔭'];
    const ROLE_EMOJIS = { 'Researcher': '🧑‍🔬', 'Executive': '💼', 'Clinician': '🩺', 'Advocate': '📣', 'Investor': '📈', 'Founder': '🚀' };
    const EVENT_EMOJIS = { 'Conference': '🌐', 'Webinar': '🎙️', 'Workshop': '🛠️', 'Summit': '📈', 'Meetup': '🔄' };
    const CURRENCY_SYMBOLS = { USD: '$', GBP: '£', EUR: '€', CAD: 'CA$', AUD: 'AU$' };

    const fmtSalary = (r) => {
      if (!r || (r.min == null && r.max == null)) return 'Competitive';
      const sym = CURRENCY_SYMBOLS[r.currency] || '$';
      const k = (n) => `${sym}${Math.round(n / 1000)}K`;
      if (r.min != null && r.max != null) return `${k(r.min)} - ${k(r.max)}`;
      return k(r.min != null ? r.min : r.max);
    };

    const timeAgo = (dateStr) => {
      if (!dateStr) return 'Recently';
      const days = Math.max(0, Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000));
      if (days === 0) return 'Today';
      if (days === 1) return '1 day ago';
      if (days < 7) return `${days} days ago`;
      if (days < 30) { const w = Math.floor(days / 7); return `${w} week${w > 1 ? 's' : ''} ago`; }
      const m = Math.floor(days / 30);
      return `${m} month${m > 1 ? 's' : ''} ago`;
    };

      id: c.id || c.name,
      name: c.name,
      type: c.type || 'Biotech',

      website: (c.website || '').replace(/^https?:\/\//, '') || '—',
      logo: pickEmoji(c.name, COMPANY_EMOJIS),

        status: p.status || 'Active',
        expectedCompletion: p.expectedCompletion || ''

      news: c.news || [],

      role: p.role || 'Researcher',

      image: ROLE_EMOJIS[p.role] || '👤'

    const normalizeStudy = (t) => {
      const substance = (t.substances && t.substances[0]) || 'Multiple';
      const rawStatus = t.status || '';
      const status = /recruit/i.test(rawStatus) ? 'Recruiting' : /complet/i.test(rawStatus) ? 'Completed' : 'Active';
      const locs = t.locations || [];
      const location = locs.length > 1 ? `${locs.length} sites` : locs.length === 1 ? fmtLocation(locs[0]) : '—';
      return {
        id: t.id || t.nctId,
        substance,
        color: subColor(substance),
        title: t.title,
        sponsor: t.sponsor || '—',
        phase: t.phase || 'N/A',
        status,
        location,
        enrollment: typeof t.enrollment === 'number' ? t.enrollment : null,
        nctId: t.nctId,
        url: t.url,
        studyType: t.studyType === 'OBSERVATIONAL' ? 'Observational' : t.studyType === 'EXPANDED_ACCESS' ? 'Expanded Access' : 'Interventional',
        hasResults: Boolean(t.hasResults),
        whyStopped: t.whyStopped
      };
    };

    const normalizeJob = (j) => ({
      id: j.id,
      title: j.title,
      company: j.company,
      companyLogo: pickEmoji(j.company, COMPANY_EMOJIS),
      type: j.type || 'Research',
      // ATS data often omits the country for US postings; a two-letter state
      // code implies United States so the location filter can match it.
      location: fmtLocation(j.location) + (j.location && j.location.state && !j.location.country ? ', United States' : ''),
      salary: fmtSalary(j.salaryRange),
      posted: timeAgo(j.postedDate),
      description: j.description || '',
      url: j.sourceUrl

    const fmtEventDate = (e) => {
      if (!e.startDate) return 'TBA';
      const opts = { month: 'short', day: 'numeric' };
      const start = new Date(e.startDate + 'T12:00:00');
      const year = start.getFullYear();
      if (e.endDate && e.endDate !== e.startDate) {
        const end = new Date(e.endDate + 'T12:00:00');
        return `${start.toLocaleDateString('en-US', opts)} - ${end.toLocaleDateString('en-US', opts)}, ${year}`;
      }
      return `${start.toLocaleDateString('en-US', opts)}, ${year}`;
    };

    const normalizeEvent = (e) => ({
      id: e.id,
      title: e.title,
      type: e.type || 'Conference',
      format: e.format || 'In-Person',
      date: fmtEventDate(e),
      location: e.format === 'Virtual' ? 'Online' : fmtLocation(e.location),
      host: e.organizer || '—',
      description: e.description || '',
      price: e.price ? (e.price.isFree ? 'Free' : e.price.amount != null ? `${CURRENCY_SYMBOLS[e.price.currency] || '$'}${e.price.amount}+` : 'TBA') : 'TBA',
      image: EVENT_EMOJIS[e.type] || '📅',

      attendees: e.expectedAttendees ? e.expectedAttendees.toLocaleString() + '+' : '—',

    const AmbientBackground = () => (
      <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, pointerEvents: 'none', zIndex: 0, overflow: 'hidden' }}>
        <div style={{ position: 'absolute', borderRadius: '50%', filter: 'blur(120px)', animation: 'float 25s ease-in-out infinite', width: '800px', height: '800px', background: 'radial-gradient(circle, rgba(125, 211, 192, 0.12) 0%, transparent 70%)', top: '-300px', right: '-200px' }} />
        <div style={{ position: 'absolute', borderRadius: '50%', filter: 'blur(120px)', animation: 'float 20s ease-in-out infinite', width: '600px', height: '600px', background: 'radial-gradient(circle, rgba(168, 197, 226, 0.08) 0%, transparent 70%)', top: '40%', left: '-200px', animationDelay: '-7s' }} />

      </div>
    );

    // Primary tabs shown as buttons across the bottom on mobile/tablet;
    // everything else lives in the "More" sheet.
    const MOBILE_TABS = [
      ['dashboard', 'Home', '📊'],
      ['live', 'Live', '⚡'],
      ['research', 'Research', '🔬'],
      ['studies', 'Studies', '🧪']
    ];
    const MOBILE_MORE_ITEMS = [
      ['datasets', 'My Datasets', '🗂️'],
      ['account', 'Account & API', '⚙️'],

                      <div style={{ width: '48px', height: '48px', borderRadius: '12px', background: 'rgba(125,211,192,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px', flexShrink: 0 }}>📄</div>
                      <div style={{ flex: 1 }}>
                        <h4 style={{ fontSize: '16px', fontWeight: 600, color: '#fff', marginBottom: '8px', lineHeight: 1.4 }}>{pub.title}</h4>
                        <div style={{ display: 'flex', gap: '16px', alignItems: 'center' }}>
                          <span style={{ fontSize: '14px', color: '#7dd3c0' }}>{pub.journal}</span>
                          <span style={{ fontSize: '13px', color: '#6b7370' }}>{pub.year}</span>
                          {pub.citations > 0 && <span style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: 'rgba(240,183,117,0.1)', color: '#f0b775', borderRadius: '4px' }}>{pub.citations} citations</span>}
                        </div>
                      </div>
                      {pub.url && <button onClick={() => window.open(pub.url, '_blank')} style={{ background: 'transparent', border: 'none', color: '#7dd3c0', fontSize: '14px', cursor: 'pointer' }}>View →</button>}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'affiliations' && (
              <div style={{ ...sharedStyles.card }}>
                <h3 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '24px' }}>Affiliations & Experience</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div style={{ display: 'flex', gap: '20px', padding: '20px', background: 'rgba(125,211,192,0.05)', borderRadius: '14px', alignItems: 'flex-start', borderLeft: '3px solid #7dd3c0' }}>
                    <div style={{ width: '56px', height: '56px', borderRadius: '14px', background: 'linear-gradient(135deg, rgba(125,211,192,0.2), rgba(168,197,226,0.2))', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '24px', flexShrink: 0 }}>🏛️</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
                        <span style={{ fontSize: '16px', fontWeight: 600, color: '#fff' }}>{person.org}</span>
                        <span style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: 'rgba(125,211,192,0.15)', color: '#7dd3c0', borderRadius: '4px' }}>Current</span>
                      </div>
                      <div style={{ fontSize: '14px', color: '#7dd3c0', marginBottom: '4px' }}>{person.title}</div>
                      <div style={{ fontSize: '13px', color: '#6b7370' }}>{person.location}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // RESEARCH AGENT PAGE — keyword search over the live papers and
    // clinical trials already loaded from the API. Every answer is built
    // from real records; agents and query history persist in localStorage.
    const AGENTS_STORAGE_KEY = 'neuly_research_agents';
    const HISTORY_STORAGE_KEY = 'neuly_research_history';
    const loadLocal = (key) => { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } };
    const saveLocal = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode */ } };

    const SEARCH_STOPWORDS = new Set(['the', 'a', 'an', 'of', 'for', 'on', 'in', 'and', 'or', 'to', 'with', 'what', 'are', 'is', 'was', 'were', 'about', 'latest', 'findings', 'finding', 'does', 'say', 'says', 'how', 'can', 'you', 'tell', 'show', 'compare', 'between', 'effect', 'effects', 'research', 'study', 'studies', 'paper', 'papers']);
    const searchTokens = (text) => (text || '').toLowerCase().split(/[^a-z0-9-]+/).filter(w => w.length > 2 && !SEARCH_STOPWORDS.has(w));

    const rankRecords = (query, records, fields) => {
      const terms = searchTokens(query);
      if (terms.length === 0) return [];
      return records
        .map(record => {
          const haystack = fields
            .map(f => { const v = record[f]; return Array.isArray(v) ? v.join(' ') : (v || ''); })
            .join(' ').toLowerCase();
          const score = terms.reduce((s, t) => s + (haystack.includes(t) ? 1 : 0), 0);
          return { record, score };
        })
        .filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score || (b.record.citationCount || 0) - (a.record.citationCount || 0))
        .map(x => x.record);
    };

    const ResearchAgentPage = ({ user }) => {
      const apiData = useApiData();
      const papers = apiData?.researchPapers || [];
      const trials = apiData?.clinicalTrials || [];
      const paperCount = apiData?.stats?.counts?.researchPapers ?? papers.length;
      const studyCount = apiData?.stats?.counts?.clinicalTrials ?? trials.length;
      const journalCount = new Set(papers.map(p => p.journal).filter(Boolean)).size;
      const citationTotal = papers.reduce((sum, p) => sum + (p.citationCount || 0), 0);
      const fmtK = (n) => n >= 1000 ? `${Math.round(n / 1000)}K` : String(n);
      const [activeTab, setActiveTab] = useState('chat');
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [showCreateAgent, setShowCreateAgent] = useState(false);
      const [agentConfig, setAgentConfig] = useState({ name: 'Research Agent', focus: 'All Research', style: 'detailed', includeCitations: true, includeAbstracts: true });
      const [myAgents, setMyAgents] = useState(() => loadLocal(AGENTS_STORAGE_KEY));
      const [queryHistory, setQueryHistory] = useState(() => loadLocal(HISTORY_STORAGE_KEY));
      const messagesEndRef = useRef(null);

      const suggestedQuestions = [
        'Psilocybin for treatment-resistant depression',
        'MDMA-assisted therapy for PTSD',
        'Ketamine and rapid-acting antidepressants',
        'Psychedelics and neuroplasticity',
        'Microdosing outcomes',
        'Ayahuasca clinical research'
      ];

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const generateResponse = (query) => {
        const focus = agentConfig.focus;
        const scopedPapers = focus === 'All Research' ? papers : papers.filter(p => (p.substances || []).includes(focus));
        const scopedTrials = focus === 'All Research' ? trials : trials.filter(t => (t.substances || []).includes(focus));

        const paperHits = rankRecords(query, scopedPapers, ['title', 'abstract', 'journal', 'substances']);
        const trialHits = rankRecords(query, scopedTrials, ['title', 'briefSummary', 'substances']);

        const topN = agentConfig.style === 'concise' ? 3 : 5;
        const sources = paperHits.slice(0, topN).map(p => ({
          title: p.title,
          authors: (p.authors || []).slice(0, 3).map(a => a.name).join(', ') + ((p.authors || []).length > 3 ? ' et al.' : ''),
          journal: p.journal || (p.isPreprint ? 'Preprint' : 'Journal not listed'),
          year: p.year || '—',
          citations: p.citationCount || 0,
          substance: (p.substances || [])[0] || 'Multiple',
          abstract: p.abstract,
          url: p.url
        }));

        const scopeNote = focus === 'All Research' ? '' : ` (focus: ${focus})`;
        const lines = [];
        if (paperHits.length === 0 && trialHits.length === 0) {
          lines.push(`I searched the live Neuly database${scopeNote} — ${scopedPapers.length.toLocaleString()} papers and ${scopedTrials.length.toLocaleString()} clinical studies — and didn't find records matching “${query}”.`);
          lines.push('');
          lines.push('Try different keywords (substance names, conditions, or authors), or broaden the agent focus in the sidebar.');
        } else {
          lines.push(`I searched the live Neuly database${scopeNote} for “${query}” and found ${paperHits.length.toLocaleString()} matching paper${paperHits.length === 1 ? '' : 's'} and ${trialHits.length.toLocaleString()} matching clinical stud${trialHits.length === 1 ? 'y' : 'ies'}.`);
          if (sources.length > 0) {
            lines.push('');
            lines.push(`**Top papers:**`);
            sources.forEach(s => {
              lines.push(`• ${s.title} — ${s.journal}, ${s.year}${agentConfig.includeCitations && s.citations ? ` (${s.citations} citations)` : ''}`);
              if (agentConfig.includeAbstracts && agentConfig.style !== 'concise' && s.abstract) {
                lines.push(`  ${s.abstract.slice(0, 220)}${s.abstract.length > 220 ? '…' : ''}`);
              }
            });
          }
          if (trialHits.length > 0) {
            lines.push('');
            lines.push('**Related clinical studies:**');
            trialHits.slice(0, 3).forEach(t => {
              lines.push(`• ${t.title}${t.phase ? ` — ${t.phase}` : ''}${t.status ? `, ${t.status}` : ''}`);
            });
          }
          lines.push('');
          lines.push('Full source details below — open any paper to read the original.');
        }

        return { text: lines.join('\n'), sources: agentConfig.includeCitations ? sources : [], results: paperHits.length + trialHits.length };
      };

      const handleSend = () => {
        if (!input.trim() || isTyping) return;

        const query = input.trim();
        setMessages(prev => [...prev, { role: 'user', content: query }]);
        setInput('');
        setIsTyping(true);

        setTimeout(() => {
          const response = generateResponse(query);
          setMessages(prev => [...prev, { role: 'agent', content: response.text, sources: response.sources }]);
          setIsTyping(false);
          setQueryHistory(prev => {
            const next = [{ query, time: new Date().toISOString(), results: response.results }, ...prev].slice(0, 25);
            saveLocal(HISTORY_STORAGE_KEY, next);
            return next;
          });
        }, 600);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      // Create Agent Modal
      const CreateAgentModal = () => (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200, padding: '40px' }}>
          <div style={{ background: 'linear-gradient(180deg, #1a1f1d 0%, #141918 100%)', borderRadius: '24px', padding: '32px', width: '500px', maxWidth: '100%', animation: 'slideUp 0.3s' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '32px' }}>
              <h2 style={{ fontFamily: '"Fraunces", serif', fontSize: '24px', fontWeight: 600, color: '#fff' }}>Create Research Agent</h2>
              <button onClick={() => setShowCreateAgent(false)} style={{ background: 'transparent', border: 'none', color: '#6b7370', fontSize: '24px', cursor: 'pointer' }}>×</button>
            </div>
            
            <div style={{ marginBottom: '24px' }}>
              <label style={{ display: 'block', fontSize: '14px', color: '#a0a8a4', marginBottom: '8px' }}>Agent Name</label>
              <input 
                type="text" 
                value={agentConfig.name} 
                onChange={(e) => setAgentConfig(prev => ({ ...prev, name: e.target.value }))}
                placeholder="e.g., Depression Research"
                style={{ width: '100%', padding: '14px 18px', fontSize: '15px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#fff', outline: 'none' }}
              />
            </div>

            <div style={{ marginBottom: '24px' }}>
              <label style={{ display: 'block', fontSize: '14px', color: '#a0a8a4', marginBottom: '8px' }}>Research Focus</label>
              <select 
                value={agentConfig.focus} 
                onChange={(e) => setAgentConfig(prev => ({ ...prev, focus: e.target.value }))}
                style={{ width: '100%', padding: '14px 18px', fontSize: '15px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#fff', outline: 'none', cursor: 'pointer' }}
              >
                {['All Research', 'Psilocybin', 'MDMA', 'Ketamine', 'LSD', 'Ayahuasca', 'Cannabis'].map(opt => (
                  <option key={opt} value={opt} style={{ background: '#1a1f1d' }}>{opt}</option>
                ))}
              </select>
            </div>

            <div style={{ marginBottom: '24px' }}>
              <label style={{ display: 'block', fontSize: '14px', color: '#a0a8a4', marginBottom: '8px' }}>Response Style</label>
              <div style={{ display: 'flex', gap: '12px' }}>
                {['concise', 'detailed', 'academic'].map(style => (
                  <button 
                    key={style}
                    onClick={() => setAgentConfig(prev => ({ ...prev, style }))}
                    style={{ 
                      flex: 1, padding: '12px', fontSize: '14px', fontWeight: 500, textTransform: 'capitalize',
                      background: agentConfig.style === style ? 'rgba(125,211,192,0.15)' : 'rgba(255,255,255,0.05)',
                      border: `1px solid ${agentConfig.style === style ? 'rgba(125,211,192,0.4)' : 'rgba(255,255,255,0.1)'}`,
                      borderRadius: '10px', color: agentConfig.style === style ? '#7dd3c0' : '#a0a8a4', cursor: 'pointer'
                    }}
                  >{style}</button>
                ))}
              </div>
            </div>

            <div style={{ marginBottom: '32px' }}>
              <label style={{ display: 'block', fontSize: '14px', color: '#a0a8a4', marginBottom: '12px' }}>Options</label>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                {[
                  { key: 'includeCitations', label: 'Include source citations' },
                  { key: 'includeAbstracts', label: 'Show paper abstracts' }
                ].map(opt => (
                  <label key={opt.key} style={{ display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer' }}>
                    <div 
                      onClick={() => setAgentConfig(prev => ({ ...prev, [opt.key]: !prev[opt.key] }))}
                      style={{ 
                        width: '22px', height: '22px', borderRadius: '6px', 
                        background: agentConfig[opt.key] ? '#7dd3c0' : 'rgba(255,255,255,0.1)',
                        border: `1px solid ${agentConfig[opt.key] ? '#7dd3c0' : 'rgba(255,255,255,0.2)'}`,
                        display: 'flex', alignItems: 'center', justifyContent: 'center'
                      }}
                    >
                      {agentConfig[opt.key] && <span style={{ color: '#0a0f0d', fontSize: '14px', fontWeight: 600 }}>✓</span>}
                    </div>
                    <span style={{ fontSize: '14px', color: '#e8ebe9' }}>{opt.label}</span>
                  </label>
                ))}
              </div>
            </div>

            <div style={{ display: 'flex', gap: '12px' }}>
              <button onClick={() => setShowCreateAgent(false)} style={{ ...sharedStyles.buttonOutline, flex: 1 }}>Cancel</button>
              <button onClick={() => {
                const agent = { id: String(Date.now()), name: agentConfig.name || 'Research Agent', focus: agentConfig.focus, style: agentConfig.style, includeCitations: agentConfig.includeCitations, includeAbstracts: agentConfig.includeAbstracts, createdAt: new Date().toISOString() };
                setMyAgents(prev => { const next = [agent, ...prev].slice(0, 20); saveLocal(AGENTS_STORAGE_KEY, next); return next; });
                setShowCreateAgent(false);
              }} style={{ ...sharedStyles.button, flex: 1 }}>Create Agent</button>
            </div>
          </div>
        </div>
      );

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh', display: 'flex' }}>
          {/* Sidebar */}
          <div style={{ width: '280px', borderRight: '1px solid rgba(255,255,255,0.06)', padding: '32px 24px', flexShrink: 0, height: 'calc(100vh - 100px)', overflowY: 'auto', position: 'sticky', top: '100px' }}>
            {/* Agent Info */}
            <div style={{ marginBottom: '32px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '16px' }}>
                <div style={{ width: '48px', height: '48px', borderRadius: '14px', background: 'rgba(125,211,192,0.15)', border: '1px solid rgba(125,211,192,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '24px' }}>🧠</div>
                <div>
                  <div style={{ fontSize: '16px', fontWeight: 600, color: '#fff' }}>{agentConfig.name}</div>
                  <div style={{ fontSize: '12px', color: '#7dd3c0', display: 'flex', alignItems: 'center', gap: '6px' }}>
                    <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#7dd3c0' }} />
                    Online
                  </div>
                </div>
              </div>
              <div style={{ fontSize: '13px', color: '#6b7370', marginBottom: '8px' }}>
                Focus: <span style={{ color: '#a0a8a4' }}>{agentConfig.focus}</span>
              </div>
              <div style={{ fontSize: '13px', color: '#6b7370' }}>
                Style: <span style={{ color: '#a0a8a4', textTransform: 'capitalize' }}>{agentConfig.style}</span>
              </div>
              <button onClick={() => setShowCreateAgent(true)} style={{ width: '100%', marginTop: '16px', padding: '10px', fontSize: '13px', fontWeight: 500, background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '10px', color: '#7dd3c0', cursor: 'pointer' }}>
                ⚙️ Configure Agent
              </button>
            </div>

            {/* Database Stats */}
            <div style={{ marginBottom: '32px' }}>
              <div style={{ fontSize: '11px', fontWeight: 600, color: '#6b7370', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '16px' }}>Database Stats</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                {[
                  { value: paperCount.toLocaleString(), label: 'Papers' },
                  { value: String(journalCount), label: 'Journals' },
                  { value: studyCount.toLocaleString(), label: 'Studies' },
                  { value: fmtK(citationTotal), label: 'Citations' }
                ].map((stat, i) => (
                  <div key={i} style={{ padding: '14px', background: 'rgba(255,255,255,0.02)', borderRadius: '12px', textAlign: 'center' }}>
                    <div style={{ fontSize: '18px', fontWeight: 600, color: '#7dd3c0' }}>{stat.value}</div>
                    <div style={{ fontSize: '11px', color: '#6b7370' }}>{stat.label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Quick Filters */}
            <div>
              <div style={{ fontSize: '11px', fontWeight: 600, color: '#6b7370', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '16px' }}>Quick Filters</div>
              {['Psilocybin', 'MDMA', 'Ketamine', 'LSD', 'Ayahuasca'].map(substance => (
                <div key={substance} onClick={() => { setActiveTab('chat'); setInput(`${substance} clinical research`); }} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 0', borderBottom: '1px solid rgba(255,255,255,0.04)', cursor: 'pointer' }}>
                  <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: substanceColors[substance] || '#7dd3c0' }} />
                  <span style={{ fontSize: '13px', color: '#a0a8a4' }}>{substance}</span>
                  <span style={{ fontSize: '11px', color: '#6b7370', marginLeft: 'auto' }}>{papers.filter(p => (p.substances || []).includes(substance)).length}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Main Content */}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', height: 'calc(100vh - 100px)' }}>
            {/* Tabs */}
            <div style={{ display: 'flex', gap: '8px', padding: '20px 40px', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
              {['chat', 'my agents', 'history'].map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} style={{ padding: '10px 20px', background: activeTab === tab ? 'rgba(125,211,192,0.15)' : 'transparent', border: activeTab === tab ? '1px solid rgba(125,211,192,0.3)' : '1px solid transparent', borderRadius: '10px', color: activeTab === tab ? '#7dd3c0' : '#6b7370', fontSize: '14px', fontWeight: 500, cursor: 'pointer', textTransform: 'capitalize' }}>{tab}</button>
              ))}
              <button onClick={() => setShowCreateAgent(true)} style={{ marginLeft: 'auto', padding: '10px 20px', background: '#7dd3c0', border: 'none', borderRadius: '10px', color: '#0a0f0d', fontSize: '14px', fontWeight: 600, cursor: 'pointer' }}>+ New Agent</button>
            </div>

            {activeTab === 'chat' && (
              <>
                {/* Chat Area */}
                <div style={{ flex: 1, overflowY: 'auto', padding: '32px 40px' }}>
                  {messages.length === 0 ? (
                    <div style={{ maxWidth: '700px', margin: '0 auto', textAlign: 'center' }}>
                      <div style={{ width: '80px', height: '80px', borderRadius: '24px', background: 'rgba(125,211,192,0.15)', border: '1px solid rgba(125,211,192,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '36px', margin: '0 auto 24px' }}>🧠</div>
                      <h1 style={{ fontFamily: '"Fraunces", serif', fontSize: '32px', fontWeight: 600, color: '#fff', marginBottom: '12px' }}>Research Agent</h1>
                      <p style={{ fontSize: '16px', color: '#6b7370', maxWidth: '500px', margin: '0 auto 40px' }}>
                        Ask me anything about natural medicine research. I have access to {paperCount.toLocaleString()} papers and {studyCount.toLocaleString()} clinical studies.
                      </p>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '12px', justifyContent: 'center' }}>
                        {suggestedQuestions.map((q, i) => (
                          <button key={i} onClick={() => setInput(q)} style={{ padding: '12px 18px', fontSize: '13px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '20px', color: '#a0a8a4', cursor: 'pointer', transition: 'all 0.2s' }}>{q}</button>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                      {messages.map((msg, i) => (
                        <div key={i} style={{ marginBottom: '32px', display: 'flex', gap: '16px', flexDirection: msg.role === 'user' ? 'row-reverse' : 'row' }}>
                          <div style={{ width: '40px', height: '40px', borderRadius: '12px', background: msg.role === 'user' ? 'linear-gradient(135deg, #7dd3c0, #a8c5e2)' : 'rgba(125,211,192,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: msg.role === 'user' ? '16px' : '20px', flexShrink: 0 }}>
                            {msg.role === 'user' ? (user?.name?.charAt(0) || 'U') : '🧠'}
                          </div>
                          <div style={{ flex: 1, maxWidth: msg.role === 'user' ? '70%' : '100%' }}>
                            <div style={{ padding: '16px 20px', background: msg.role === 'user' ? 'rgba(125,211,192,0.15)' : 'rgba(255,255,255,0.03)', borderRadius: msg.role === 'user' ? '20px 20px 4px 20px' : '20px 20px 20px 4px', border: `1px solid ${msg.role === 'user' ? 'rgba(125,211,192,0.3)' : 'rgba(255,255,255,0.06)'}` }}>
                              <div style={{ fontSize: '15px', color: '#e8ebe9', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{msg.content}</div>
                            </div>
                            {msg.sources && msg.sources.length > 0 && (
                              <div style={{ marginTop: '16px' }}>
                                <div style={{ fontSize: '12px', color: '#6b7370', marginBottom: '10px', fontWeight: 500 }}>Sources ({msg.sources.length})</div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                  {msg.sources.map((source, j) => (
                                    <div key={j} style={{ padding: '14px 16px', background: 'rgba(255,255,255,0.02)', borderRadius: '12px', borderLeft: `3px solid ${substanceColors[source.substance] || '#7dd3c0'}` }}>
                                      {source.url

    // LIVE INDUSTRY LAYER — news, filings, markets, policy, capital,

    // ============================================================
    const liveAgo = (iso) => {
      if (!iso) return 'never';
      const secs = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
      if (secs < 45) return 'just now';
      const mins = Math.round(secs / 60);
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.round(mins / 60);
      if (hours < 36) return `${hours}h ago`;
      const days = Math.round(hours / 24);
      return days < 60 ? `${days}d ago` : new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    };
    const fmtDate = (iso) => (iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—');
    const fmtMoney = (n) => {
      if (n == null || isNaN(n)) return '—';
      if (n >= 1e9) return `$${(n / 1e9).toFixed(1)}B`;
      if (n >= 1e6) return `$${(n / 1e6).toFixed(1)}M`;
      if (n >= 1e3) return `$${Math.round(n / 1e3)}K`;
      return `$${Math.round(n)}`;
    };
    const fmtPct = (n) => (n == null ? '—' : `${n > 0 ? '+' : ''}${n.toFixed(2)}%`);

      people: { icon: '👤', label: 'Person', color: '#d4a5c9' },

    /**
     * Fetch an endpoint and refetch it whenever the live stream reports
     * changes to one of `watchTypes` (or any change when omitted).
     */
    const useLiveEndpoint = (endpoint, watchTypes) => {
      const apiData = useApiData();
      const [state, setState] = useState({ data: null, loading: true });
      const liveVersion = apiData ? apiData.liveVersion : 0;
      const liveTypes = (apiData && apiData.liveTypes) || [];
      const relevant = !watchTypes || liveTypes.some(t => watchTypes.includes(t));
      const trigger = relevant ? liveVersion : 0;
      useEffect(() => {
        if (!endpoint) return undefined;
        let cancelled = false;
        api.get(endpoint).then(res => { if (!cancelled) setState({ data: res, loading: false }); });
        return () => { cancelled = true; };
      }, [endpoint, trigger]);
      return state;
    };

    // Re-render once a minute so "5m ago" labels stay honest
    const useMinuteTick = () => {
      const [, setTick] = useState(0);
      useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 30000); return () => clearInterval(t); }, []);
    };

    const Sparkline = ({ points, width = 96, height = 28 }) => {
      const values = (points || []).map(p => p.close).filter(v => typeof v === 'number');
      if (values.length < 2) return <div style={{ width, height }} />;
      const min = Math.min(...values), max = Math.max(...values);
      const span = max - min || 1;
      const d = values.map((v, i) => `${i === 0 ? 'M' : 'L'}${((i / (values.length - 1)) * width).toFixed(1)},${(height - 2 - ((v - min) / span) * (height - 4)).toFixed(1)}`).join(' ');
      const color = values[values.length - 1] >= values[0] ? '#7dd3c0' : '#e57373';
      return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} aria-hidden="true"><path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" /></svg>;
    };

    const MarketsTab = () => {

    const FreshnessTab = () => {
      const apiData = useApiData();
      const { data, loading } = useLiveEndpoint('/freshness');
      useMinuteTick();
      const rows = (apiData && apiData.freshness && apiData.freshness.length ? apiData.freshness : (data && data.data)) || [];

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
          {rows.map(r => {

              <div key={r.type} style={{ ...sharedStyles.card, padding: '16px 20px', display: 'flex', gap: '16px', alignItems: 'center' }}>

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: '15px', fontWeight: 600, color: '#fff' }}>{DATASET_LABELS[r.type] || r.type}</div>
                  <div style={{ fontSize: '12px', color: '#6b7370', marginTop: '2px' }}>{(r.cadence || []).join(' · ') || 'Curated'}</div>
                  {r.lastError && <div style={{ fontSize: '12px', color: '#e57373', marginTop: '4px' }}>Last run failed: {String(r.lastError).slice(0, 140)}</div>}
                </div>
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  <div style={{ fontFamily: '"Fraunces", serif', fontSize: '20px', fontWeight: 600, color: meta.color }}>{(r.count || 0).toLocaleString()}</div>
                  <div style={{ fontSize: '12px', color: healthy ? '#7dd3c0' : r.lastError ? '#e57373' : '#6b7370' }}>{r.lastSuccessAt ? `updated ${liveAgo(r.lastSuccessAt)}` : 'awaiting first crawl'}</div>
                </div>

    const LIVE_TABS = [
      ['feed', '⚡ Live Feed'],
      ['news', '📰 News'],
      ['filings', '📑 SEC Filings'],
      ['markets', '📈 Markets'],
      ['policy', '🏛️ Policy'],
      ['funding', '💰 Funding'],
      ['grants', '🎯 Grants'],
      ['readouts', '🗓️ Readouts'],
      ['status', '🩺 Data Status']
    ];

    const LivePage = () => {
      const apiData = useApiData();
      const isMobile = useIsMobile();
      const [tab, setTab] = useState('feed');
      const { data: marketData } = useLiveEndpoint('/markets', ['market_quotes']);
      useMinuteTick();
      const counts = (apiData && apiData.stats && apiData.stats.counts) || {};
      const status = apiData ? apiData.liveStatus : 'connecting';
      const statusLabel = status === 'streaming' ? 'STREAMING LIVE' : status === 'polling' ? 'LIVE · POLLING' : 'CONNECTING';

      const tiles = [
        { label: 'Trials', value: counts.clinicalTrials, color: '#f0b775' },
        { label: 'Papers', value: counts.researchPapers, color: '#a8c5e2' },
        { label: 'Companies', value: counts.companies, color: '#7dd3c0' },
        { label: 'Headlines & filings', value: counts.news, color: '#a8c5e2' },
        { label: 'Bills & rules', value: counts.legislation, color: '#c084fc' },
        { label: 'Funding rounds', value: counts.fundingEvents, color: '#f0b775' }
      ];

      const body = {
        feed: <LiveFeedTab />,
        news: <NewsTab category="News" />,
        filings: <NewsTab category="SEC Filing" />,
        markets: <MarketsTab />,
        policy: <PolicyTab />,
        funding: <FundingTab />,
        grants: <GrantsTab />,
        readouts: <ReadoutsTab />,
        status: <FreshnessTab />
      }[tab];

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: isMobile ? '20px 16px' : '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <div style={{ textAlign: 'center', marginBottom: '32px' }}>
              <div style={{ marginBottom: '16px' }}><LivePill label={statusLabel} /></div>
              <h1 style={{ fontFamily: '"Fraunces", serif', fontSize: isMobile ? '32px' : '42px', fontWeight: 600, color: '#fff', marginBottom: '12px' }}>Industry Live</h1>
              <p style={{ fontSize: isMobile ? '15px' : '18px', color: '#a0a8a4', maxWidth: '680px', margin: '0 auto' }}>
                Every trial, paper, filing, bill, funding round, headline and stock move in psychedelic medicine — updated the moment our crawlers detect it.
              </p>
              <p style={{ fontSize: '12px', color: '#4a524e', marginTop: '10px' }}>Last sync {liveAgo(apiData && apiData.lastSync)}</p>
            </div>

            <div style={{ marginBottom: '24px' }}><MarketTicker quotes={(marketData && marketData.data) || []} /></div>

            <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, minmax(0, 1fr))' : 'repeat(6, 1fr)', gap: '12px', marginBottom: '28px' }}>
              {tiles.map(t => (
                <div key={t.label} style={{ ...sharedStyles.card, padding: '16px', textAlign: 'center' }}>
                  <div style={{ fontFamily: '"Fraunces", serif', fontSize: '24px', fontWeight: 600, color: t.color }}>{t.value != null ? Number(t.value).toLocaleString() : '—'}</div>
                  <div style={{ fontSize: '12px', color: '#6b7370' }}>{t.label}</div>
                </div>
              ))}
            </div>

            <div style={{ display: 'flex', gap: '8px', overflowX: 'auto', marginBottom: '24px', paddingBottom: '4px', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
              {LIVE_TABS.map(([key, label]) => (
                <button key={key} onClick={() => setTab(key)} style={{ flexShrink: 0, padding: '12px 16px', background: 'transparent', border: 'none', borderBottom: tab === key ? '2px solid #7dd3c0' : '2px solid transparent', color: tab === key ? '#7dd3c0' : '#a0a8a4', fontSize: '14px', fontWeight: 600, cursor: 'pointer' }}>{label}</button>
              ))}
            </div>

            {body}
          </div>
        </div>
      );
    };

    // Homepage band: live headlines + market ticker, linking into the Live page
    const LiveHomeSection = ({ setCurrentPage }) => {
      const { data: newsData } = useLiveEndpoint('/news?limit=6&category=News', ['news']);
      const { data: marketData } = useLiveEndpoint('/markets', ['market_quotes']);
      const isMobile = useIsMobile();
      useMinuteTick();
      const news = (newsData && newsData.data) || [];
      const quotes = (marketData && marketData.data) || [];
      if (news.length === 0 && quotes.length === 0) return null;
      return (
        <section style={{ ...sharedStyles.section, padding: isMobile ? '60px 16px' : '80px 40px', position: 'relative', zIndex: 1 }}>
          <div style={{ textAlign: 'center', marginBottom: '32px' }}>
            <div style={{ marginBottom: '16px' }}><LivePill label="LIVE" /></div>
            <h2 style={{ ...sharedStyles.sectionTitle, fontSize: isMobile ? '30px' : '42px' }}>What's happening right now</h2>
            <p style={sharedStyles.sectionSubtitle}>Headlines, SEC filings and stock moves across the psychedelic medicine industry, refreshed continuously.</p>
          </div>
          <div style={{ marginBottom: '20px' }}><MarketTicker quotes={quotes} /></div>
          <NewsList items={news} compact />
          <div style={{ textAlign: 'center', marginTop: '28px' }}>
            <button onClick={() => { setCurrentPage('live'); window.scrollTo(0, 0); }} style={sharedStyles.buttonOutline}>Open Industry Live →</button>
          </div>
        </section>
      );
    };

    // Company profile band: live quote + the company's latest news & filings
    const CompanyLiveStrip = ({ company }) => {
      const { data: newsData } = useLiveEndpoint(`/news?company=${encodeURIComponent(company.name)}&limit=8`, ['news']);
      const { data: marketData } = useLiveEndpoint(company.ticker || company.stage === 'Public' ? '/markets' : null, ['market_quotes']);
      const news = (newsData && newsData.data) || [];
      const quote = ((marketData && marketData.data) || []).find(q => q.companyId === company.id || (company.ticker && q.ticker === String(company.ticker).toUpperCase()));
      if (news.length === 0 && !quote) return null;
      return (
        <div style={{ ...sharedStyles.card, marginBottom: '40px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px', marginBottom: news.length ? '20px' : 0 }}>
            <LivePill label="LIVE" />
            {quote && (
              <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                <span style={{ fontWeight: 700, color: '#fff' }}>{quote.ticker}</span>
                <span style={{ fontFamily: '"Fraunces", serif', fontSize: '24px', color: '#fff' }}>{quote.price.toFixed(2)} <span style={{ fontSize: '12px', color: '#6b7370' }}>{quote.currency}</span></span>
                <span style={{ color: moveColor(quote.changePercent), fontWeight: 600 }}>{fmtPct(quote.changePercent)}</span>
                <Sparkline points={quote.history} width={120} height={32} />
              </div>
            )}
          </div>
          {news.length > 0 && <NewsList items={news} compact />}
        </div>
      );
    };

    const Footer = ({ setCurrentPage }) => (
      <footer style={{ borderTop: '1px solid rgba(255,255,255,0.06)', padding: '60px 40px 40px', position: 'relative', zIndex: 1 }}>
        <div style={{ maxWidth: '1280px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '24px' }}>
          <NeulyLogo height={18} />
          <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap', fontSize: '13px' }}>
            {[['pricing', 'Pricing'], ['datasets', 'Datasets'], ['live', 'Industry Live'], ['account', 'Account']].map(([page, label]) => (
              <span key={page} onClick={() => { setCurrentPage && setCurrentPage(page); window.scrollTo(0, 0); }} style={{ color: '#a0a8a4', cursor: 'pointer' }}>{label}</span>
            ))}
            <a href="/docs" style={{ color: '#a0a8a4', textDecoration: 'none' }}>API Docs</a>
            <a href="/readouts-calendar" style={{ color: '#a0a8a4', textDecoration: 'none' }}>Readout Calendar</a>
            <a href="/sitemap.xml" style={{ color: '#a0a8a4', textDecoration: 'none' }}>Sitemap</a>
          </div>
          <p style={{ fontSize: '13px', color: '#4a524e' }}>© 2026 Neuly. All rights reserved.</p>
        </div>
      </footer>
    );

    // ============================================================
    // Launch surface: routing, toasts, datasets, pricing, account, admin
    // ============================================================

    // URL <-> page mapping. Server-rendered routes (/substances, /trials,
    // /company-profiles, /policy, /readouts-calendar, /docs) never reach the
    // SPA, so only app pages are listed here.
    const PAGE_PATHS = {
      home: '/', dashboard: '/dashboard', live: '/live', research: '/research', companies: '/companies',
      people: '/people', education: '/education', care: '/care', studies: '/studies', jobs: '/jobs',
      events: '/events', pricing: '/pricing', account: '/account', datasets: '/datasets', admin: '/admin',
      'reset-password': '/reset-password'
    };
    const pageFromLocation = () => {
      const path = window.location.pathname.replace(/\/+$/, '') || '/';
      if (path.startsWith('/datasets/shared/')) return { page: 'shared-dataset', slug: decodeURIComponent(path.split('/')[3] || '') };
      const entry = Object.entries(PAGE_PATHS).find(([, p]) => p === path);
      return { page: entry ? entry[0] : 'home' };
    };

    // Lightweight toasts: notify('Saved') from anywhere
    const notify = (message, tone = 'ok') => window.dispatchEvent(new CustomEvent('neuly:toast', { detail: { message, tone, id: Date.now() + Math.random() } }));
    const ToastHost = () => {
      const [toasts, setToasts] = useState([]);
      useEffect(() => {
        const onToast = (e) => {
          setToasts(prev => [...prev, e.detail]);
          setTimeout(() => setToasts(prev => prev.filter(t => t.id !== e.detail.id)), 4200);
        };
        window.addEventListener('neuly:toast', onToast);
        return () => window.removeEventListener('neuly:toast', onToast);
      }, []);
      if (toasts.length === 0) return null;
      return (
        <div style={{ position: 'fixed', top: '84px', right: '20px', zIndex: 400, display: 'flex', flexDirection: 'column', gap: '8px', maxWidth: '360px' }}>
          {toasts.map(t => (
            <div key={t.id} style={{ padding: '12px 16px', borderRadius: '12px', fontSize: '14px', animation: 'slideUp 0.2s', background: t.tone === 'error' ? 'rgba(229,115,115,0.15)' : 'rgba(125,211,192,0.15)', border: `1px solid ${t.tone === 'error' ? 'rgba(229,115,115,0.4)' : 'rgba(125,211,192,0.4)'}`, color: t.tone === 'error' ? '#e57373' : '#7dd3c0', backdropFilter: 'blur(12px)' }}>{t.message}</div>
          ))}
        </div>
      );
    };

    // Fetch helper that surfaces server errors (api.get swallows them)
    const useFetch = (endpoint, deps = []) => {
      const [state, setState] = useState({ data: null, error: null, loading: Boolean(endpoint) });
      const [version, setVersion] = useState(0);
      useEffect(() => {
        if (!endpoint) { setState({ data: null, error: null, loading: false }); return; }
        let cancelled = false;
        setState(prev => ({ ...prev, loading: true }));
        api.send('GET', endpoint)
          .then(data => { if (!cancelled) setState({ data, error: null, loading: false }); })
          .catch(err => { if (!cancelled) setState({ data: null, error: err.message, loading: false }); });
        return () => { cancelled = true; };
      }, [endpoint, version, ...deps]);
      return { ...state, reload: () => setVersion(v => v + 1) };
    };

    const PLAN_COLORS = { free: '#a0a8a4', pro: '#7dd3c0', enterprise: '#f0b775' };
    const PlanBadge = ({ plan, style }) => (
      <span style={{ padding: '4px 10px', fontSize: '11px', fontWeight: 700, letterSpacing: '0.5px', textTransform: 'uppercase', borderRadius: '6px', background: `${PLAN_COLORS[plan] || '#a0a8a4'}20`, color: PLAN_COLORS[plan] || '#a0a8a4', ...style }}>{plan || 'free'}</span>
    );

    const fieldStyle = { width: '100%', padding: '12px 14px', fontSize: '14px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '10px', color: '#fff', outline: 'none', fontFamily: '"DM Sans", sans-serif' };
    const smallButton = { ...sharedStyles.button, padding: '10px 18px', fontSize: '13px', borderRadius: '10px' };
    const smallOutline = { ...sharedStyles.buttonOutline, padding: '10px 18px', fontSize: '13px', borderRadius: '10px' };
    const dangerOutline = { ...smallOutline, color: '#e57373', border: '1px solid rgba(229,115,115,0.4)' };
    const labelStyle = { display: 'block', fontSize: '12px', color: '#6b7370', marginBottom: '6px', textTransform: 'uppercase', letterSpacing: '0.5px' };
    const pageShell = (isMobile) => ({ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' });
    const pageInner = (isMobile) => ({ padding: isMobile ? '20px 16px' : '40px', maxWidth: '1280px', margin: '0 auto' });

    // Dataset display helpers (which fields to show per table)
    const ENTITY_TYPE_LABELS = { clinical_trials: 'Clinical trials', research_papers: 'Research papers', companies: 'Companies', people: 'People', jobs: 'Jobs', events: 'Events', educational_resources: 'Courses', legislation: 'Legislation', funding_events: 'Funding', grants: 'Grants', care_providers: 'Care providers', news: 'News', market_quotes: 'Quotes' };
    const rowTitle = (r) => r.title || r.name || r.companyName || (r.ticker ? `${r.ticker} (${r.companyName})` : r.id);
    const rowMeta = (type, r) => {
      switch (type) {
