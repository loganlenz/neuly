    ::-webkit-scrollbar-track { background: #0a0f0d; }

        { id: 4, name: 'Ekaterina Malievskaia, MD', role: 'Executive', title: 'Co-Founder & Chief Medical Officer', org: 'COMPASS Pathways', location: 'London, UK', bio: 'Dr. Ekaterina Malievskaia is a physician and healthcare entrepreneur who co-founded COMPASS Pathways with her husband George Goldsmith in 2016. Their personal experience seeking treatment options for their son\'s treatment-resistant depression led them to explore psilocybin therapy. As CMO, she oversees COMPASS\'s clinical development program and has been instrumental in advancing COMP360 through Phase 3 trials. She holds an MD from the Moscow Medical Academy and has over 20 years of healthcare industry experience.', expertise: ['Psilocybin', 'Clinical Development', 'Treatment-Resistant Depression'], papers: 20, citations: '1,500+', image: '👩‍💼' },
        { id: 5, name: 'Prof. David Nutt', role: 'Researcher', title: 'Edmund J Safra Professor of Neuropsychopharmacology', org: 'Imperial College London', location: 'London, UK', bio: 'Professor David Nutt is one of the world\'s leading neuropsychopharmacologists with over 500 peer-reviewed publications. He served as the UK\'s chief drug adviser until 2009 when he was controversially dismissed for stating that ecstasy and LSD were less harmful than alcohol. He founded Drug Science, an independent scientific body on drugs. At Imperial College, he has collaborated on pioneering psychedelic research and advocates for evidence-based drug policy. His research spans addiction, anxiety, depression, and sleep disorders.', expertise: ['Neuropsychopharmacology', 'Policy', 'Drug Science', 'Psilocybin'], papers: 500, citations: '50,000+', image: '👨‍🔬' },
        { id: 6, name: 'Florian Brand', role: 'Executive', title: 'Co-Founder & CEO', org: 'Atai Life Sciences', location: 'Berlin, Germany', bio: 'Florian Brand co-founded Atai Life Sciences in 2018 with Christian Angermayer and Lars Wilde. Under his leadership, Atai has become one of the largest psychedelic medicine companies, employing a "hub and spoke" business model with multiple subsidiaries and a 20%+ stake in COMPASS Pathways. The company went public in 2021 with backing from Peter Thiel and has raised over $360 million. Brand oversees a diverse pipeline spanning psilocybin, DMT, R-ketamine, ibogaine, and non-psychedelic compounds for various mental health conditions.', expertise: ['Business Strategy', 'Investment', 'Drug Development'], papers: 5, citations: '200+', image: '👨‍💼' },
        { id: 7, name: 'Amanda Feilding', role: 'Founder', title: 'Founder & Director', org: 'Beckley Foundation', location: 'Oxford, UK', bio: 'Amanda Feilding, Countess of Wemyss, founded the Beckley Foundation in 1998 to pioneer research into consciousness and drug policy reform. She has collaborated on numerous studies with Imperial College London and Johns Hopkins, including the first LSD brain imaging study. Feilding co-founded Beckley Psytech to develop psychedelic medicines commercially. At 80+, she remains an active advocate for rational drug policy and continues to support cutting-edge research into psychedelics, cannabis, and consciousness.', expertise: ['Policy Reform', 'Consciousness Research', 'LSD', 'Drug Policy'], papers: 30, citations: '3,000+', image: '👩‍🔬' },
        { id: 8, name: 'George Goldsmith', role: 'Executive', title: 'Co-Founder & CEO', org: 'COMPASS Pathways', location: 'London, UK', bio: 'George Goldsmith co-founded COMPASS Pathways in 2016 to accelerate patient access to psilocybin therapy. His background in healthcare innovation and technology led him to recognize the potential of psychedelic-assisted therapy. Under his leadership, COMPASS became the first psychedelic company to list on NASDAQ and has raised over $240 million. He oversees the company\'s mission to transform mental healthcare through evidence-based psilocybin therapy, currently in Phase 3 trials for treatment-resistant depression.', expertise: ['Healthcare Innovation', 'Business Leadership', 'Psilocybin'], papers: 10, citations: '500+', image: '👨‍💼' },
        { id: 9, name: 'Dr. Jennifer Mitchell', role: 'Researcher', title: 'Associate Professor of Neurology', org: 'UCSF', location: 'San Francisco, CA', bio: 'Dr. Jennifer Mitchell is a neuroscientist at UCSF studying how MDMA and other psychedelics affect the brain and behavior. Her research has been pivotal in understanding the neurobiological mechanisms of MDMA-assisted therapy for PTSD. She was a lead author on the landmark MAPS Phase 3 trial published in Nature Medicine showing MDMA\'s efficacy for PTSD. Her work focuses on the intersection of social behavior, reward processing, and therapeutic applications of psychoactive compounds.', expertise: ['MDMA', 'Neuroscience', 'PTSD', 'Social Behavior'], papers: 80, citations: '8,000+', image: '👩‍🔬' },
        { id: 10, name: 'Dr. Roland Griffiths', role: 'Researcher', title: 'Founding Director (1946-2023)', org: 'Johns Hopkins Center', location: 'Baltimore, MD', bio: 'Dr. Roland Griffiths (1946-2023) was the founding director of the Johns Hopkins Center for Psychedelic and Consciousness Research. His 2006 landmark study showing psilocybin could occasion mystical experiences with lasting positive effects reignited scientific interest in psychedelics after decades of dormancy. With over 400 publications, he shaped modern psychedelic research methodology and trained the next generation of researchers. His work on psilocybin for cancer-related distress, addiction, and depression established the evidence base for therapeutic use. He passed away in October 2023 from cancer.', expertise: ['Psilocybin', 'Consciousness', 'Mystical Experience', 'Depression'], papers: 400, citations: '40,000+', image: '🕯️' },
        { id: 11, name: 'Doug Drysdale', role: 'Executive', title: 'CEO', org: 'Cybin', location: 'Toronto, Canada', bio: 'Doug Drysdale is the CEO of Cybin, leading the company\'s development of next-generation psychedelic therapeutics. He has over 25 years of pharmaceutical industry experience, including executive roles at Teva Pharmaceutical and Alvogen. Under his leadership, Cybin has advanced CYB003 (deuterated psilocybin) into Phase 3 trials for major depressive disorder and secured FDA Breakthrough Therapy Designation. He emphasizes Cybin\'s scientific approach to improving upon classic psychedelics through deuteration and novel delivery mechanisms.', expertise: ['Pharmaceutical Development', 'Business Strategy', 'Drug Development'], papers: 5, citations: '100+', image: '👨‍💼' },
        { id: 12, name: 'Robert Barrow', role: 'Executive', title: 'CEO', org: 'MindMed', location: 'New York, NY', bio: 'Robert Barrow is the CEO of MindMed, appointed in December 2023 after serving as interim CEO and Chief Development Officer. He has over a decade of pharmaceutical industry experience and has stabilized the company after a period of internal turmoil. Under his leadership, MindMed received FDA Breakthrough Therapy Designation for MM120 (LSD) in generalized anxiety disorder and initiated Phase 3 trials. He has focused on executing a streamlined clinical development strategy and rebuilding investor confidence.', expertise: ['Pharmaceutical Development', 'Clinical Trials', 'Leadership'], papers: 10, citations: '200+', image: '👨‍💼' },
        { id: 13, name: 'Dr. David Erritzoe', role: 'Researcher', title: 'Clinical Director, Centre for Psychedelic Research', org: 'Imperial College London', location: 'London, UK', bio: 'Dr. David Erritzoe is a psychiatrist and Clinical Director at Imperial College London\'s Centre for Psychedelic Research. He collaborates with Prof. David Nutt on research into the therapeutic potential of psychedelics and ketamine. In 2021, he established the CIPPRes Clinic at St. Charles Hospital—the first NHS-based psychedelic research clinic in the UK. His research focuses on the mechanisms and clinical applications of psychedelics, particularly for depression and end-of-life anxiety.', expertise: ['Psilocybin', 'Clinical Psychiatry', 'Ketamine', 'MDMA'], papers: 60, citations: '6,000+', image: '👨‍⚕️' },
        { id: 14, name: 'Dr. Frederick Barrett', role: 'Researcher', title: 'Associate Professor of Psychiatry', org: 'Johns Hopkins', location: 'Baltimore, MD', bio: 'Dr. Frederick "Fritz" Barrett is an Associate Professor at Johns Hopkins University working at the Center for Psychedelic and Consciousness Research. His research focuses on understanding the neurobiological mechanisms through which psychedelics produce their therapeutic effects, using neuroimaging and behavioral measures. He is particularly interested in how psychedelics affect music perception, emotion processing, and creativity. He also studies the safety and abuse potential of psychedelics.', expertise: ['Neuroimaging', 'Music & Emotion', 'Psilocybin', 'Safety Research'], papers: 70, citations: '5,000+', image: '👨‍🔬' },
        { id: 15, name: 'Dr. Rachel Yehuda', role: 'Researcher', title: 'Professor of Psychiatry & Neuroscience', org: 'Mount Sinai', location: 'New York, NY', bio: 'Dr. Rachel Yehuda is a Professor of Psychiatry and Neuroscience at the Icahn School of Medicine at Mount Sinai, specializing in trauma and PTSD. She directs the Center for Psychedelic Psychotherapy and Trauma Research, which studies MDMA-assisted therapy and other psychedelic treatments for PTSD. Her pioneering work on epigenetics and intergenerational trauma has transformed our understanding of PTSD. She brings a rigorous scientific approach to psychedelic therapy research.', expertise: ['PTSD', 'Trauma', 'MDMA', 'Epigenetics'], papers: 300, citations: '35,000+', image: '👩‍🔬' },
        { id: 16, name: 'Dr. James Fadiman', role: 'Researcher', title: 'Psychedelic Researcher & Author', org: 'Independent', location: 'Menlo Park, CA', bio: 'Dr. James Fadiman is a pioneer of psychedelic research dating back to the 1960s. He participated in the famous "psychedelics in problem-solving" experiment at the International Foundation for Advanced Study and co-founded the Institute of Transpersonal Psychology (now Sofia University). His book "The Psychedelic Explorer\'s Guide" popularized the concept of microdosing, leading to worldwide interest in sub-perceptual psychedelic use. At 80+, he continues to collect microdosing reports and advocate for psychedelic research.', expertise: ['Microdosing', 'Problem Solving', 'Transpersonal Psychology'], papers: 40, citations: '4,000+', image: '👨‍🔬' },
        { id: 17, name: 'Dr. Rick Strassman', role: 'Researcher', title: 'Clinical Associate Professor', org: 'UNM School of Medicine', location: 'Taos, NM', bio: 'Dr. Rick Strassman conducted the first new US government-approved psychedelic research in over 20 years when he began his DMT studies in 1990. His book "DMT: The Spirit Molecule" introduced millions to the powerful effects of dimethyltryptamine and proposed theories about its role in near-death and mystical experiences. The book was adapted into a popular documentary. His research reopened the door for subsequent psychedelic studies and remains influential in understanding DMT\'s unique phenomenology.', expertise: ['DMT', 'Consciousness', 'Endogenous Psychedelics'], papers: 30, citations: '3,500+', image: '👨‍🔬' },
        { id: 18, name: 'Christian Angermayer', role: 'Investor', title: 'Founder & Chairman', org: 'Apeiron Investment Group', location: 'London, UK', bio: 'Christian Angermayer is a German entrepreneur and investor who has become one of the most influential figures in psychedelic finance. He co-founded Atai Life Sciences and was an early investor in COMPASS Pathways. His firm Apeiron Investment Group has backed numerous psychedelic companies. Angermayer has been vocal about his personal positive experiences with psilocybin and advocates for psychedelic therapy as a transformative mental health treatment. His investments have helped legitimize the psychedelic medicine industry.', expertise: ['Investment', 'Entrepreneurship', 'Business Development'], papers: 0, citations: 'N/A', image: '👨‍💼' },
        { id: 19, name: 'Dr. Harriet de Wit', role: 'Researcher', title: 'Professor of Psychiatry', org: 'University of Chicago', location: 'Chicago, IL', bio: 'Dr. Harriet de Wit has researched psychoactive drugs for over four decades at the University of Chicago. Her innovative studies investigate the effects of LSD and MDMA on brain function, mood, and social behavior. She has trained countless students and post-doctoral fellows and published over 300 scientific papers. In 2019, she received the Distinguished Investigator Award from the European Behavioural Pharmacology Society. Her rigorous methodology has advanced our understanding of psychedelic pharmacology.', expertise: ['Pharmacology', 'MDMA', 'LSD', 'Behavioral Science'], papers: 300, citations: '20,000+', image: '👩‍🔬' },
        { id: 20, name: 'Dr. Michael Bogenschutz', role: 'Researcher', title: 'Professor of Psychiatry', org: 'NYU Langone', location: 'New York, NY', bio: 'Dr. Michael Bogenschutz is a Professor of Psychiatry at NYU Langone Health and Director of the NYU Langone Center for Psychedelic Medicine. His research focuses on psilocybin-assisted therapy for alcohol use disorder, with landmark studies showing significant reductions in heavy drinking. He also studies psilocybin for depression and existential distress in cancer patients. His work has helped establish NYU as a leading center for psychedelic research alongside Johns Hopkins.', expertise: ['Psilocybin', 'Alcohol Use Disorder', 'Addiction Medicine'], papers: 80, citations: '7,000+', image: '👨‍⚕️' },
        { id: 21, name: 'Dr. Natalie Gukasyan', role: 'Researcher', title: 'Assistant Professor & Medical Director', org: 'Johns Hopkins', location: 'Baltimore, MD', bio: 'Dr. Natalie Gukasyan is the Medical Director of the Johns Hopkins Center for Psychedelic and Consciousness Research. She is leading the development of an evidence-based postdoctoral fellowship program to train psychiatrists in psychedelic-assisted therapy. Her clinical research focuses on psilocybin treatments, and she is helping establish standards for the coming era of psychedelic medicine.', expertise: ['Clinical Psychiatry', 'Psilocybin', 'Medical Education'], papers: 40, citations: '2,500+', image: '👩‍⚕️' },
        { id: 22, name: 'Dr. Albert Garcia-Romeu', role: 'Researcher', title: 'Associate Professor', org: 'Johns Hopkins', location: 'Baltimore, MD', bio: 'Dr. Albert Garcia-Romeu is an Associate Professor at Johns Hopkins studying psilocybin for smoking cessation and other addictions. His research has shown remarkable 80% abstinence rates for smoking cessation with psilocybin therapy—far exceeding conventional treatments. He received a prestigious NIH grant to study psilocybin for opioid use disorder, marking growing federal support for psychedelic research.', expertise: ['Addiction', 'Smoking Cessation', 'Psilocybin', 'Opioid Use Disorder'], papers: 60, citations: '4,500+', image: '👨‍🔬' },
        { id: 23, name: 'Dr. David Yaden', role: 'Researcher', title: 'Roland R. Griffiths Professor', org: 'Johns Hopkins', location: 'Baltimore, MD', bio: 'Dr. David Yaden is the first recipient of the Roland R. Griffiths Professorship in Psychedelic Research on Secular Spirituality and Well-Being at Johns Hopkins. His research focuses on the psychological effects of transformative experiences, including those induced by psychedelics. His 2022 book "The Varieties of Spiritual Experience" explores the science of mystical states. He carries forward Griffiths\' legacy of studying consciousness and well-being.', expertise: ['Mystical Experience', 'Well-Being', 'Consciousness', 'Psychology'], papers: 50, citations: '3,000+', image: '👨‍🔬' },
        { id: 24, name: 'Dr. Adam Gazzaley', role: 'Researcher', title: 'Founder & Executive Director', org: 'UCSF Neuroscape', location: 'San Francisco, CA', bio: 'Dr. Adam Gazzaley is a neuroscientist and founder of Neuroscape at UCSF, which launched a Psychedelics Division in 2021 led by Robin Carhart-Harris. He pioneered the use of video games and virtual reality as cognitive interventions and is applying these technologies to enhance psychedelic therapy. His work bridges neuroscience, technology, and mental health treatment.', expertise: ['Neurotechnology', 'VR/AR', 'Cognitive Enhancement', 'Digital Therapeutics'], papers: 150, citations: '20,000+', image: '👨‍🔬' },
        { id: 25, name: 'Dr. David Olson', role: 'Researcher', title: 'Professor of Chemistry', org: 'UC Davis', location: 'Davis, CA', bio: 'Dr. David Olson is a Professor of Chemistry at UC Davis and co-founder of Delix Therapeutics. His groundbreaking discovery that psychedelics promote neuroplasticity led to the development of "psychoplastogens"—non-hallucinogenic compounds that retain therapeutic benefits. His Nature publications have transformed drug discovery in psychiatry. He is pioneering a new class of take-home mental health treatments.', expertise: ['Medicinal Chemistry', 'Neuroplasticity', 'Drug Discovery', 'Psychoplastogens'], papers: 80, citations: '8,000+', image: '👨‍🔬' },
        { id: 26, name: 'Dr. Manoj Doss', role: 'Researcher', title: 'Research Fellow', org: 'Johns Hopkins', location: 'Baltimore, MD', bio: 'Dr. Manoj Doss is a cognitive neuroscientist at Johns Hopkins studying how psychedelics affect memory and cognition. His research uses neuroimaging to understand the brain mechanisms underlying psychedelic experiences and their therapeutic effects. He has contributed important insights into how psychedelics may facilitate memory reconsolidation and belief change in therapy.', expertise: ['Cognitive Neuroscience', 'Memory', 'Neuroimaging', 'Psilocybin'], papers: 35, citations: '2,000+', image: '👨‍🔬' },
        { id: 27, name: 'Dr. Cody Wenthur', role: 'Researcher', title: 'Associate Professor', org: 'University of Wisconsin', location: 'Madison, WI', bio: 'Dr. Cody Wenthur leads psychedelic research at the University of Wisconsin-Madison, investigating whether conscious awareness during psychedelic experiences is necessary for therapeutic effects. His innovative study design using amnesia-inducing medication alongside psilocybin could reveal fundamental insights about how these medicines work.', expertise: ['Pharmacology', 'Drug Development', 'Psilocybin', 'Mechanism Research'], papers: 40, citations: '2,500+', image: '👨‍🔬' },
        { id: 28, name: 'Dr. Brandon Weiss', role: 'Researcher', title: 'Research Fellow', org: 'Johns Hopkins', location: 'Baltimore, MD', bio: 'Dr. Brandon Weiss is a researcher at Johns Hopkins studying the therapeutic mechanisms of psilocybin and other psychedelics. His work focuses on understanding how psychedelic experiences translate into lasting psychological benefits, particularly for depression and anxiety disorders.', expertise: ['Clinical Psychology', 'Psilocybin', 'Mechanism Research'], papers: 25, citations: '1,500+', image: '👨‍🔬' },
        { id: 29, name: 'Dr. Rayyan Zafar', role: 'Researcher', title: 'Research Associate', org: 'Imperial College London', location: 'London, UK', bio: 'Dr. Rayyan Zafar is a psychiatrist and researcher at Imperial College London\'s Centre for Psychedelic Research. He studies the clinical applications of psychedelics and ketamine for depression and has contributed to multiple clinical trials. He frequently collaborates with Robin Carhart-Harris and David Nutt on cutting-edge research.', expertise: ['Clinical Psychiatry', 'Psilocybin', 'Ketamine', 'Depression'], papers: 30, citations: '2,000+', image: '👨‍⚕️' },
        { id: 30, name: 'Dr. Peter Hendricks', role: 'Researcher', title: 'Professor of Psychology', org: 'University of Alabama', location: 'Birmingham, AL', bio: 'Dr. Peter Hendricks is a Professor at the University of Alabama at Birmingham studying psilocybin for cocaine use disorder and other addictions. His epidemiological research first suggested that psychedelic use is associated with reduced suicidality and psychological distress, helping build the case for clinical trials.', expertise: ['Addiction', 'Epidemiology', 'Psilocybin', 'Substance Use Disorder'], papers: 70, citations: '5,000+', image: '👨‍🔬' },
        { id: 31, name: 'Dr. Charles Grob', role: 'Researcher', title: 'Professor of Psychiatry', org: 'UCLA', location: 'Los Angeles, CA', bio: 'Dr. Charles Grob is a Professor of Psychiatry at UCLA who conducted pioneering research on MDMA-assisted therapy and psilocybin for cancer-related anxiety in the 1990s-2000s. His early work helped establish safety protocols and demonstrated therapeutic potential when few researchers dared study psychedelics. He is considered a bridge between the first wave of research and the modern renaissance.', expertise: ['MDMA', 'Psilocybin', 'End-of-Life Care', 'Cancer Distress'], papers: 100, citations: '8,000+', image: '👨‍⚕️' },
        { id: 32, name: 'Dr. Francisco Moreno', role: 'Researcher', title: 'Professor of Psychiatry', org: 'University of Arizona', location: 'Tucson, AZ', bio: 'Dr. Francisco Moreno conducted the first FDA-approved study of psilocybin since the 1970s, investigating its effects on obsessive-compulsive disorder in 2006. This study, along with the Johns Hopkins work, helped reopen the door to psychedelic research. He continues to study psilocybin at the University of Arizona.', expertise: ['OCD', 'Psilocybin', 'Clinical Trials', 'Psychiatry'], papers: 60, citations: '4,000+', image: '👨‍⚕️' },
        { id: 33, name: 'Dr. Chris Stauffer', role: 'Researcher', title: 'Associate Professor', org: 'Oregon Health Sciences', location: 'Portland, OR', bio: 'Dr. Chris Stauffer is an Associate Professor studying MDMA-assisted therapy for PTSD, particularly in military veterans. He has conducted research at the VA Portland and is a leader in the field of psychedelic therapy for veterans. He frequently speaks on the challenges and opportunities of bringing psychedelics to veteran populations.', expertise: ['PTSD', 'Veterans Health', 'MDMA', 'Clinical Trials'], papers: 45, citations: '3,000+', image: '👨‍⚕️' },
        { id: 34, name: 'Dr. Michael Silver', role: 'Researcher', title: 'Director', org: 'UC Berkeley Center for Psychedelics', location: 'Berkeley, CA', bio: 'Dr. Michael Silver directs the UC Berkeley Center for the Science of Psychedelics, launched in 2020 with $1.25M in funding. The center focuses on basic neuroscience research, training, and public education. It is one of the few academic centers studying psychedelics through a multidisciplinary lens including philosophy, law, and ethics.', expertise: ['Neuroscience', 'Vision Science', 'Consciousness', 'Education'], papers: 80, citations: '6,000+', image: '👨‍🔬' },
        { id: 35, name: 'Dr. Bill Richards', role: 'Clinician', title: 'Psychologist', org: 'Johns Hopkins', location: 'Baltimore, MD', bio: 'Dr. Bill Richards is a clinical psychologist at Johns Hopkins who has guided more psychedelic sessions than almost anyone alive. He began researching psychedelics at Spring Grove Hospital in the 1960s before the research was shut down, and returned to the field when Johns Hopkins reopened studies in 2000. His book "Sacred Knowledge" distills decades of wisdom on facilitating transformative experiences.', expertise: ['Clinical Psychology', 'Session Facilitation', 'Mystical Experience', 'Psilocybin'], papers: 30, citations: '3,000+', image: '👨‍⚕️' },
        { id: 36, name: 'Dr. Stephen Ross', role: 'Researcher', title: 'Associate Professor', org: 'NYU Langone', location: 'New York, NY', bio: 'Dr. Stephen Ross is an Associate Professor of Psychiatry at NYU Langone who led landmark research on psilocybin for cancer-related existential distress. His 2016 study showed that a single psilocybin session produced rapid, sustained reductions in anxiety and depression in cancer patients—effects lasting 6 months or more in most participants.', expertise: ['Cancer Distress', 'Psilocybin', 'Anxiety', 'Palliative Care'], papers: 70, citations: '6,000+', image: '👨‍⚕️' },
        { id: 37, name: 'Michael Pollan', role: 'Advocate', title: 'Author & Journalist', org: 'Independent', location: 'Berkeley, CA', bio: 'Michael Pollan is a bestselling author whose 2018 book "How to Change Your Mind" brought psychedelic research to mainstream audiences and sparked widespread interest in therapeutic applications. The book was adapted into a Netflix documentary series. A journalism professor at UC Berkeley, Pollan\'s work has been instrumental in shifting public perception of psychedelics from counterculture drugs to legitimate medicine.', expertise: ['Science Writing', 'Journalism', 'Public Education'], papers: 0, citations: 'N/A', image: '📚' },
        { id: 38, name: 'Tim Ferriss', role: 'Investor', title: 'Author & Investor', org: 'Independent', location: 'Austin, TX', bio: 'Tim Ferriss, bestselling author and investor, has donated over $5 million to psychedelic research, primarily at Johns Hopkins and Imperial College London. His 2017 donation helped launch the Johns Hopkins center. Through his podcast and platform, he has brought psychedelic science to millions of listeners and helped destigmatize the field. He publicly credits psychedelics with helping his own mental health.', expertise: ['Philanthropy', 'Investment', 'Media', 'Advocacy'], papers: 0, citations: 'N/A', image: '🎙️' },
        { id: 39, name: 'Dr. Charles Raison', role: 'Researcher', title: 'Director of Clinical Research', org: 'Usona Institute', location: 'Madison, WI', bio: 'Dr. Charles Raison is the Director of Clinical Research at the Usona Institute and a Professor at the University of Wisconsin-Madison. He oversees Usona\'s Phase 2 trials of psilocybin for major depressive disorder. His research background spans psychoneuroimmunology, meditation, and the mind-body connection—bringing a unique perspective to psychedelic medicine.', expertise: ['Depression', 'Psychoneuroimmunology', 'Psilocybin', 'Clinical Trials'], papers: 200, citations: '25,000+', image: '👨‍🔬' },
        { id: 40, name: 'Dustin Robinson', role: 'Investor', title: 'Managing Partner', org: 'Iter Investments', location: 'Fort Lauderdale, FL', bio: 'Dustin Robinson is the Managing Partner of Iter Investments, a venture capital firm focused on psychedelics, and co-founder of Nucleus. A former cannabis industry attorney, he pivoted to psychedelics seeing similar opportunities for reform. Iter has invested in numerous companies including the entities that became Neuly and Psychedelic Invest. He advocates for evidence-based approaches to psychedelic medicine.', expertise: ['Investment', 'Cannabis Law', 'Business Development'], papers: 0, citations: 'N/A', image: '👨‍💼' },
      ];

      const savedPeople = people.slice(0, 3);

      const filteredPeople = people.filter(p => 
        (selectedRole === 'All' || p.role === selectedRole) &&
        (selectedOrg === 'All' || p.org === selectedOrg) &&
        (searchQuery === '' || p.name.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      const viewPersonProfile = (person) => {
        setSelectedPerson(person);
        setCurrentPage('person-profile');
      };

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <div style={{ textAlign: 'center', marginBottom: '48px' }}>
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', marginBottom: '16px' }}>
                <img src={logoBase64} alt="" style={{ height: '32px', filter: 'brightness(0) invert(1)' }} />
                <span style={{ fontSize: '32px', fontWeight: 300, color: '#7dd3c0' }}>people</span>
              </div>
              <h1 style={{ fontFamily: '"Fraunces", serif', fontSize: '42px', fontWeight: 600, color: '#fff', marginBottom: '12px' }}>Industry People</h1>
              <p style={{ fontSize: '18px', color: '#a0a8a4', maxWidth: '600px', margin: '0 auto' }}>Connect with researchers, executives, clinicians, and advocates leading the natural medicine industry.</p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '20px', marginBottom: '40px' }}>
              {[{ value: '500+', label: 'Total Professionals', color: '#7dd3c0' }, { value: '150+', label: 'Researchers', color: '#a8c5e2' }, { value: '80+', label: 'Executives', color: '#f0b775' }, { value: '50+', label: 'Clinicians', color: '#d4a5c9' }].map((stat, i) => (
                <div key={i} style={{ ...sharedStyles.card, textAlign: 'center' }}>
                  <div style={{ fontFamily: '"Fraunces", serif', fontSize: '32px', fontWeight: 600, color: stat.color }}>{stat.value}</div>
                  <div style={{ fontSize: '14px', color: '#6b7370' }}>{stat.label}</div>
                </div>
              ))}
            </div>

            <div style={{ display: 'flex', gap: '8px', marginBottom: '32px', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
              {['browse', 'saved', 'following'].map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} style={{ padding: '12px 24px', background: 'transparent', border: 'none', color: activeTab === tab ? '#7dd3c0' : '#6b7370', fontSize: '14px', fontWeight: 500, cursor: 'pointer', borderBottom: activeTab === tab ? '2px solid #7dd3c0' : '2px solid transparent', marginBottom: '-1px', textTransform: 'capitalize' }}>{tab}</button>
              ))}
            </div>

            {activeTab === 'browse' && (
              <>
                <div style={{ display: 'flex', gap: '16px', marginBottom: '32px', flexWrap: 'wrap', alignItems: 'center' }}>
                  <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search people..." style={{ padding: '12px 20px', fontSize: '14px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '10px', color: '#fff', outline: 'none', width: '250px' }} />
                  <select value={selectedRole} onChange={(e) => setSelectedRole(e.target.value)} style={{ padding: '12px 20px', fontSize: '14px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '10px', color: '#fff', outline: 'none', cursor: 'pointer' }}>
                    {roles.map(r => <option key={r} value={r} style={{ background: '#1a1f1d' }}>{r === 'All' ? 'All Roles' : r}</option>)}
                  </select>
                  <select value={selectedOrg} onChange={(e) => setSelectedOrg(e.target.value)} style={{ padding: '12px 20px', fontSize: '14px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '10px', color: '#fff', outline: 'none', cursor: 'pointer' }}>

            return <CompanyProfilePage company={selectedCompany} setCurrentPage={setCurrentPage} setSelectedPerson={setSelectedPerson} />;
          case 'people':
            return <PeoplePage user={user} setSelectedPerson={setSelectedPerson} setCurrentPage={setCurrentPage} />;
          case 'person-profile':
            return <PersonProfilePage person={selectedPerson} setCurrentPage={setCurrentPage} setSelectedCompany={setSelectedCompany} />;
          case 'education':
            return <EducationPage user={user} />;
          case 'care':
            return <CarePage user={user} />;
          case 'studies':
            return <StudiesPage user={user} />;
          case 'jobs':
            return <JobsPage user={user} />;
          case 'events':
            return <EventsPage user={user} />;
          default:
            return <DashboardPage user={user} setCurrentPage={setCurrentPage} />;
        }
      };

      return (
        <div style={sharedStyles.container}>
          <AmbientBackground />
          <Navigation user={user} setUser={setUser} currentPage={currentPage} setCurrentPage={setCurrentPage} />
          {renderPage()}
          <Footer />
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
