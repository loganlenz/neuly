<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neuly">
  <meta name="format-detection" content="telephone=no">
  <title>Neuly - Natural Medicine Research Platform</title>
  <!-- If the frontend is hosted separately from the API (e.g. static hosting),
       set content to the API server's origin. Empty = same-origin /api. -->
  <meta name="neuly-api-base" content="https://neuly-web.onrender.com">
  <!-- Vendored locally (see /vendor) so the app has no third-party CDN dependency -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0a0f0d; font-family: 'DM Sans', sans-serif; }
    html { scroll-behavior: smooth; }
    ::selection { background: rgba(125, 211, 192, 0.3); }
    input::placeholder, textarea::placeholder { color: #6b7370; }
    @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes floatScreen { 0%, 100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
    @keyframes progressPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0f0d; }
    ::-webkit-scrollbar-thumb { background: rgba(125, 211, 192, 0.3); border-radius: 4px; }

    /* ============ Mobile app chrome (bottom tab bar) ============ */
    .neuly-tabbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-around; align-items: stretch;
      gap: 4px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(12, 17, 15, 0.92);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .neuly-tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 8px 4px; border: none; border-radius: 14px;
      background: transparent; color: #6b7370; font-family: 'DM Sans', sans-serif;
      font-size: 10.5px; font-weight: 600; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background 0.15s, color 0.15s;
    }
    .neuly-tab .icon { font-size: 22px; line-height: 1; }
    .neuly-tab.active { color: #7dd3c0; background: rgba(125, 211, 192, 0.12); }
    .neuly-tab:active { background: rgba(255,255,255,0.08); }

    .neuly-sheet-backdrop {
      position: fixed; inset: 0; z-index: 210;
      background: rgba(0,0,0,0.55);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      animation: fadeIn 0.15s;
    }
    .neuly-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 220;
      background: #141918; border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
      animation: slideUp 0.22s;
    }
    .neuly-sheet .grabber { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 4px auto 14px; }
    .neuly-sheet-item {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 14px 12px; border: none; border-radius: 12px; background: transparent;
      color: #e8ebe9; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 500;
      cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent;
    }
    .neuly-sheet-item:active { background: rgba(255,255,255,0.06); }
    .neuly-sheet-item .icon { font-size: 20px; width: 28px; text-align: center; }
    .neuly-sheet-item.danger { color: #e57373; }

    /* ============ Responsive overrides for inline-styled layout ============ */
    @media (max-width: 1024px) {
      /* Stat rows and card grids: 4-5 across -> 2 across */
      [style*="grid-template-columns: repeat(4, 1fr)"],
      [style*="grid-template-columns: repeat(5, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
      /* Two-pane layouts stack */
      [style*="grid-template-columns: 2fr 1fr"],
      [style*="grid-template-columns: 1.2fr 0.8fr"] { grid-template-columns: 1fr !important; }
      /* Wide card minimums shrink to fit */
      [style*="minmax(380px"] { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important; }
      /* Fixed-width decorative blocks scale down */
      [style*="width: 500px"], [style*="width: 600px"],
      [style*="width: 700px"], [style*="width: 800px"] { width: 100% !important; max-width: 100% !important; }
      /* Hero: text + floating screenshot stack vertically */
      [style*="gap: 80px"][style*="display: flex"] { flex-direction: column !important; gap: 48px !important; }
      [style*="padding: 120px 40px 80px"] { padding: 110px 20px 60px !important; }
      /* Sidebar + content layouts stack (research agent, dashboard) */
      [style*="padding-top: 100px"][style*="display: flex"] { flex-direction: column !important; }
      [style*="width: 280px"][style*="border-right"] {
        width: 100% !important; height: auto !important; position: static !important;
        border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      /* Table-style rows scroll horizontally instead of crushing */
      [style*="grid-template-columns: 1fr 1fr 120px 120px 100px"] { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 640px) {
      [style*="grid-template-columns: repeat(3, 1fr)"],
      [style*="grid-template-columns: 1fr 1fr 1fr"],
      [style*="grid-template-columns: repeat(2, 1fr)"],
      [style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
      [style*="grid-template-columns: repeat(4, 1fr)"],
      [style*="grid-template-columns: repeat(5, 1fr)"] { grid-template-columns: repeat(2, 1fr) !important; }
      [style*="minmax(380px"], [style*="minmax(320px"], [style*="minmax(280px"] { grid-template-columns: 1fr !important; }
      /* Page gutters */
      [style*="padding: 0 40px"] { padding: 0 20px !important; }
      /* Display headings scale down */
      [style*="font-size: 52px"] { font-size: 34px !important; }
      [style*="font-size: 48px"] { font-size: 32px !important; }
      [style*="font-size: 42px"] { font-size: 28px !important; }
      [style*="font-size: 36px"] { font-size: 26px !important; }
      /* Filter rows wrap cleanly */
      [style*="min-width: 250px"] { min-width: 100% !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // Mobile/tablet detection — drives the iOS-style app chrome
    const useIsMobile = () => {
      const [isMobile, setIsMobile] = useState(() => window.matchMedia('(max-width: 1024px)').matches);
      useEffect(() => {
        const mq = window.matchMedia('(max-width: 1024px)');
        const onChange = (e) => setIsMobile(e.matches);
        mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
        return () => mq.removeEventListener ? mq.removeEventListener('change', onChange) : mq.removeListener(onChange);
      }, []);
      return isMobile;
    };

    // API Configuration. Resolution order:
    //   1. <meta name="neuly-api-base"> — for a static-hosted frontend (e.g.
    //      Netlify) pointing at a separately deployed API server. Ignored on
    //      localhost so local development always talks to its own server.
    //   2. same-origin /api — production default; the Express server serves
    //      this file and the API together
    //   3. localhost:3001 — when opened directly as a local file
    const apiBaseMeta = document.querySelector('meta[name="neuly-api-base"]');
    const isLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const API_BASE_URL = (apiBaseMeta && apiBaseMeta.content && !isLocalhost)
      ? apiBaseMeta.content.replace(/\/+$/, '') + '/api'
      : window.location.protocol === 'file:' ? 'http://localhost:3001/api' : '/api';
    console.log('Neuly API base:', API_BASE_URL);

    // API Helper Functions. credentials: 'include' carries the session
    // cookie so accounts work even when the frontend is hosted on a
    // different origin than the API.
    const api = {
      async get(endpoint) {
        try {
          const response = await fetch(`${API_BASE_URL}${endpoint}`, { credentials: 'include' });
          if (!response.ok) throw new Error('API request failed');
          return await response.json();
        } catch (error) {
          console.error(`API Error: ${endpoint}`, error);
          return null;
        }
      },

      // Mutating requests throw with the server's error message so forms
      // (signup/login, save buttons) can surface it to the user.
      async send(method, endpoint, body) {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, {
          method,
          credentials: 'include',
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined
        });
        const data = await response.json().catch(() => null);
        if (!response.ok) throw new Error((data && data.error) || `Request failed (${response.status})`);
        return data;
      },
      post(endpoint, body) { return this.send('POST', endpoint, body); },
      del(endpoint) { return this.send('DELETE', endpoint); },

      async getDashboard() {
        return this.get('/dashboard');
      },

      async getClinicalTrials(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/clinical-trials${query ? '?' + query : ''}`);
      },

      async getResearchPapers(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/research${query ? '?' + query : ''}`);
      },

      async getCompanies(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/companies${query ? '?' + query : ''}`);
      },

      async getPeople(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/people${query ? '?' + query : ''}`);
      },

      async getJobs(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/jobs${query ? '?' + query : ''}`);
      },

      async getEvents(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/events${query ? '?' + query : ''}`);
      },

      async getEducation(params = {}) {
        const query = new URLSearchParams(params).toString();
        return this.get(`/education${query ? '?' + query : ''}`);
      },

      async search(query) {
        return this.get(`/search?q=${encodeURIComponent(query)}`);
      }
    };

    // Data Context for sharing API data across components
    const DataContext = createContext(null);

    const DataProvider = ({ children }) => {
      const [apiData, setApiData] = useState({
        companies: [],
        people: [],
        clinicalTrials: [],
        researchPapers: [],
        jobs: [],
        events: [],
        education: [],
        stats: null,
        loading: true,
        error: null,
        usingApi: false,
        attempts: 0
      });

      useEffect(() => {
        let cancelled = false;
        let attempt = 0;

        const fetchData = async () => {
          try {
            const dashboard = await api.getDashboard();
            if (!dashboard || !dashboard.counts) throw new Error('API unreachable');

            const [companiesRes, peopleRes, trialsRes, papersRes, jobsRes, eventsRes, educationRes] = await Promise.all([
              api.getCompanies({ limit: 1000 }),
              api.getPeople({ limit: 2000 }),
              api.getClinicalTrials({ limit: 3000 }),
              api.getResearchPapers({ limit: 2000 }),
              api.getJobs({ limit: 1000 }),
              api.getEvents({ limit: 500 }),
              api.getEducation({ limit: 500 })
            ]);
            if (cancelled) return true;

            setApiData({
              companies: companiesRes?.data || [],
              people: peopleRes?.data || [],
              clinicalTrials: trialsRes?.data || [],
              researchPapers: papersRes?.data || [],
              jobs: jobsRes?.data || [],
              events: eventsRes?.data || [],
              education: educationRes?.data || [],
              stats: dashboard,
              loading: false,
              error: null,
              usingApi: true,
              attempts: 0
            });
            console.log('✅ Connected to Neuly API - using live data');
            return true;
          } catch (error) {
            if (!cancelled) {
              setApiData(prev => ({ ...prev, loading: false, error: error.message, usingApi: false, attempts: prev.attempts + 1 }));
            }
            return false;
          }
        };

        // Keep retrying with backoff until the API answers — the data layer
        // is the product, so there is no static fallback.
        const run = async () => {
          const ok = await fetchData();
          if (!ok && !cancelled) {
            attempt += 1;
            const delay = Math.min(15000, 2000 * attempt);
            console.log(`⏳ API not reachable, retrying in ${delay / 1000}s`);
            setTimeout(run, delay);
          }
        };
        run();
        return () => { cancelled = true; };
      }, []);

      return React.createElement(DataContext.Provider, { value: apiData }, children);
    };

    const useApiData = () => useContext(DataContext);

    // ============================================================
    // Accounts — real signup/login against /api/auth/* with session cookies
    // ============================================================
    const displayName = (user) => (user && (user.name || (user.email || '').split('@')[0])) || 'there';
    const initialOf = (user) => (displayName(user)[0] || 'N').toUpperCase();

    const authInputStyle = { width: '100%', padding: '14px 18px', fontSize: '15px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#fff', outline: 'none', fontFamily: '"DM Sans", sans-serif' };

    const AuthModal = ({ mode, setMode, onClose, onAuthed }) => {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState(null);
      const [busy, setBusy] = useState(false);
      const isSignup = mode === 'signup';

      const submit = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true);
        setError(null);
        try {
          const res = isSignup
            ? await api.post('/auth/signup', { name, email, password })
            : await api.post('/auth/login', { email, password });
          onAuthed(res.user);
        } catch (err) {
          setError(err.message === 'Failed to fetch' ? 'Could not reach the Neuly API — try again in a moment.' : err.message);
          setBusy(false);
        }
      };

      return (
        <div onClick={onClose} style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 300, padding: '24px' }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: 'linear-gradient(180deg, #1a1f1d 0%, #141918 100%)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '24px', padding: '32px', width: '420px', maxWidth: '100%', animation: 'slideUp 0.25s' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
              <NeulyLogo height={20} />
              <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: '#6b7370', fontSize: '24px', cursor: 'pointer', lineHeight: 1 }}>×</button>
            </div>
            <h2 style={{ fontFamily: '"Fraunces", serif', fontSize: '26px', fontWeight: 600, color: '#fff', margin: '16px 0 6px' }}>{isSignup ? 'Create your free account' : 'Welcome back'}</h2>
            <p style={{ fontSize: '14px', color: '#6b7370', marginBottom: '24px' }}>{isSignup ? 'Track studies, save companies, and get research alerts.' : 'Log in to your Neuly account.'}</p>
            <form onSubmit={submit}>
              {isSignup && (
                <div style={{ marginBottom: '14px' }}>
                  <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Name" autoComplete="name" style={authInputStyle} />
                </div>
              )}
              <div style={{ marginBottom: '14px' }}>
                <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email" autoComplete="email" style={authInputStyle} />
              </div>
              <div style={{ marginBottom: '18px' }}>
                <input type="password" required minLength={8} value={password} onChange={(e) => setPassword(e.target.value)} placeholder={isSignup ? 'Password (8+ characters)' : 'Password'} autoComplete={isSignup ? 'new-password' : 'current-password'} style={authInputStyle} />
              </div>
              {error && (
                <div style={{ marginBottom: '18px', padding: '12px 16px', fontSize: '13px', color: '#e57373', background: 'rgba(229,115,115,0.1)', border: '1px solid rgba(229,115,115,0.3)', borderRadius: '10px' }}>{error}</div>
              )}
              <button type="submit" disabled={busy} style={{ ...sharedStyles.button, width: '100%', padding: '15px', opacity: busy ? 0.6 : 1 }}>
                {busy ? 'One moment…' : isSignup ? 'Create Free Account' : 'Log In'}
              </button>
            </form>
            <p style={{ fontSize: '13px', color: '#6b7370', textAlign: 'center', marginTop: '20px' }}>
              {isSignup ? 'Already have an account? ' : "Don't have an account? "}
              <span onClick={() => { setError(null); setMode(isSignup ? 'login' : 'signup'); }} style={{ color: '#7dd3c0', cursor: 'pointer', fontWeight: 500 }}>{isSignup ? 'Log in' : 'Sign up free'}</span>
            </p>
          </div>
        </div>
      );
    };

    // ============================================================
    // Saved / followed items — persisted per-user via /api/saves
    // ============================================================
    const SavesContext = createContext({ items: [], toggle: () => {}, find: () => null, remove: () => {} });
    const useSaves = () => useContext(SavesContext);

    const SavesProvider = ({ user, requireAuth, children }) => {
      const [items, setItems] = useState([]);

      useEffect(() => {
        let cancelled = false;
        if (!user) { setItems([]); return; }
        api.get('/saves').then(res => { if (!cancelled && res && res.data) setItems(res.data); });
        return () => { cancelled = true; };
      }, [user && user.id]);

      const find = (entityType, entityId, kind = 'save') =>
        items.find(s => s.entityType === entityType && s.entityId === String(entityId) && s.kind === kind) || null;

      const toggle = async (entity, kind = 'save') => {
        if (!user) { requireAuth('signup'); return; }
        const existing = find(entity.entityType, entity.entityId, kind);
        try {
          if (existing) {
            setItems(prev => prev.filter(s => s.id !== existing.id));
            await api.del(`/saves/${existing.id}`);
          } else {
            const res = await api.post('/saves', { ...entity, entityId: String(entity.entityId), kind });
            setItems(prev => [res.data, ...prev.filter(s => s.id !== res.data.id)]);
          }
        } catch (err) {
          console.error('Save failed', err);
          const fresh = await api.get('/saves');
          if (fresh && fresh.data) setItems(fresh.data);
        }
      };

      const remove = async (id) => {
        setItems(prev => prev.filter(s => s.id !== id));
        try { await api.del(`/saves/${id}`); } catch (err) { console.error('Remove failed', err); }
      };

      return React.createElement(SavesContext.Provider, { value: { items, toggle, find, remove } }, children);
    };

    // One button for every Save/Follow surface: outline when inactive,
    // filled when active. Signed-out clicks open the signup modal.
    const SaveButton = ({ entityType, entityId, entityTitle, kind = 'save', style }) => {
      const { toggle, find } = useSaves();
      const active = Boolean(find(entityType, entityId, kind));
      const label = kind === 'follow' ? (active ? 'Following' : 'Follow') : (active ? 'Saved ✓' : 'Save');
      return (
        <button onClick={() => toggle({ entityType, entityId, entityTitle }, kind)} style={{ ...(active ? sharedStyles.button : sharedStyles.buttonOutline), ...style }}>
          {label}
        </button>
      );
    };

    // Neuly brand mark (cloud icon only). The wordmark is real HTML text so it
    // always sits on the same baseline as neighboring text at any size.

    const fmtLocation = (loc) => {

      if (typeof loc === 'string') return loc;
      const parts = [loc.facility || loc.venue, loc.city, loc.state, loc.country].filter(Boolean);
      if (loc.remote) parts.push('Remote');
      return parts.length ? parts.join(', ') : '—';
    };

    const pickEmoji = (seed, set) => {
      let h = 7;
      for (const ch of String(seed || '')) h = (h * 31 + ch.charCodeAt(0)) | 0;
      return set[Math.abs(h) % set.length];
    };
    const COMPANY_EMOJIS = ['🧬', '🔬', '💊', '🌿', '🧠', '⚗️', '🌱', '✨', '🍄', '🔭'];

    const fmtSalary = (r) => {
      if (!r || (r.min == null && r.max == null)) return 'Competitive';
      const sym = CURRENCY_SYMBOLS[r.currency] || '$';
      const k = (n) => `${sym}${Math.round(n / 1000)}K`;
      if (r.min != null && r.max != null) return `${k(r.min)} - ${k(r.max)}`;
      return k(r.min != null ? r.min : r.max);

      if (!dateStr) return 'Recently';
      const days = Math.max(0, Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000));

      if (days === 1) return '1 day ago';
      if (days < 7) return `${days} days ago`;
      if (days < 30) { const w = Math.floor(days / 7); return `${w} week${w > 1 ? 's' : ''} ago`; }
      const m = Math.floor(days / 30);
      return `${m} month${m > 1 ? 's' : ''} ago`;

    // RESEARCH AGENT PAGE — keyword search over the live papers and
    // clinical trials already loaded from the API. Every answer is built
    // from real records; agents and query history persist in localStorage.
    const AGENTS_STORAGE_KEY = 'neuly_research_agents';
    const HISTORY_STORAGE_KEY = 'neuly_research_history';
    const loadLocal = (key) => { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } };
    const saveLocal = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode */ } };

    const SEARCH_STOPWORDS = new Set(['the', 'a', 'an', 'of', 'for', 'on', 'in', 'and', 'or', 'to', 'with', 'what', 'are', 'is', 'was', 'were', 'about', 'latest', 'findings', 'finding', 'does', 'say', 'says', 'how', 'can', 'you', 'tell', 'show', 'compare', 'between', 'effect', 'effects', 'research', 'study', 'studies', 'paper', 'papers']);
    const searchTokens = (text) => (text || '').toLowerCase().split(/[^a-z0-9-]+/).filter(w => w.length > 2 && !SEARCH_STOPWORDS.has(w));

    const rankRecords = (query, records, fields) => {
      const terms = searchTokens(query);
      if (terms.length === 0) return [];
      return records
        .map(record => {
          const haystack = fields
            .map(f => { const v = record[f]; return Array.isArray(v) ? v.join(' ') : (v || ''); })
            .join(' ').toLowerCase();
          const score = terms.reduce((s, t) => s + (haystack.includes(t) ? 1 : 0), 0);
          return { record, score };
        })
        .filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score || (b.record.citationCount || 0) - (a.record.citationCount || 0))
        .map(x => x.record);
    };

    const ResearchAgentPage = ({ user }) => {
      const apiData = useApiData();
      const papers = apiData?.researchPapers || [];
      const trials = apiData?.clinicalTrials || [];
      const paperCount = apiData?.stats?.counts?.researchPapers ?? papers.length;
      const studyCount = apiData?.stats?.counts?.clinicalTrials ?? trials.length;
      const journalCount = new Set(papers.map(p => p.journal).filter(Boolean)).size;
      const citationTotal = papers.reduce((sum, p) => sum + (p.citationCount || 0), 0);
      const fmtK = (n) => n >= 1000 ? `${Math.round(n / 1000)}K` : String(n);
      const [activeTab, setActiveTab] = useState('chat');
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [showCreateAgent, setShowCreateAgent] = useState(false);
      const [agentConfig, setAgentConfig] = useState({ name: 'Research Agent', focus: 'All Research', style: 'detailed', includeCitations: true, includeAbstracts: true });
      const [myAgents, setMyAgents] = useState(() => loadLocal(AGENTS_STORAGE_KEY));
      const [queryHistory, setQueryHistory] = useState(() => loadLocal(HISTORY_STORAGE_KEY));
      const messagesEndRef = useRef(null);

      const suggestedQuestions = [
        'Psilocybin for treatment-resistant depression',
        'MDMA-assisted therapy for PTSD',
        'Ketamine and rapid-acting antidepressants',
        'Psychedelics and neuroplasticity',
        'Microdosing outcomes',
        'Ayahuasca clinical research'
      ];

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const generateResponse = (query) => {
        const focus = agentConfig.focus;
        const scopedPapers = focus === 'All Research' ? papers : papers.filter(p => (p.substances || []).includes(focus));
        const scopedTrials = focus === 'All Research' ? trials : trials.filter(t => (t.substances || []).includes(focus));

        const paperHits = rankRecords(query, scopedPapers, ['title', 'abstract', 'journal', 'substances']);
        const trialHits = rankRecords(query, scopedTrials, ['title', 'briefSummary', 'substances']);

        const topN = agentConfig.style === 'concise' ? 3 : 5;
        const sources = paperHits.slice(0, topN).map(p => ({
          title: p.title,
          authors: (p.authors || []).slice(0, 3).map(a => a.name).join(', ') + ((p.authors || []).length > 3 ? ' et al.' : ''),
          journal: p.journal || (p.isPreprint ? 'Preprint' : 'Journal not listed'),
          year: p.year || '—',
          citations: p.citationCount || 0,
          substance: (p.substances || [])[0] || 'Multiple',
          abstract: p.abstract,
          url: p.url
        }));

        const scopeNote = focus === 'All Research' ? '' : ` (focus: ${focus})`;
        const lines = [];
        if (paperHits.length === 0 && trialHits.length === 0) {
          lines.push(`I searched the live Neuly database${scopeNote} — ${scopedPapers.length.toLocaleString()} papers and ${scopedTrials.length.toLocaleString()} clinical studies — and didn't find records matching “${query}”.`);
          lines.push('');
          lines.push('Try different keywords (substance names, conditions, or authors), or broaden the agent focus in the sidebar.');
        } else {
          lines.push(`I searched the live Neuly database${scopeNote} for “${query}” and found ${paperHits.length.toLocaleString()} matching paper${paperHits.length === 1 ? '' : 's'} and ${trialHits.length.toLocaleString()} matching clinical stud${trialHits.length === 1 ? 'y' : 'ies'}.`);
          if (sources.length > 0) {
            lines.push('');
            lines.push(`**Top papers:**`);
            sources.forEach(s => {
              lines.push(`• ${s.title} — ${s.journal}, ${s.year}${agentConfig.includeCitations && s.citations ? ` (${s.citations} citations)` : ''}`);
              if (agentConfig.includeAbstracts && agentConfig.style !== 'concise' && s.abstract) {
                lines.push(`  ${s.abstract.slice(0, 220)}${s.abstract.length > 220 ? '…' : ''}`);
              }
            });
          }
          if (trialHits.length > 0) {
            lines.push('');
            lines.push('**Related clinical studies:**');
            trialHits.slice(0, 3).forEach(t => {
              lines.push(`• ${t.title}${t.phase ? ` — ${t.phase}` : ''}${t.status ? `, ${t.status}` : ''}`);
            });
          }
          lines.push('');
          lines.push('Full source details below — open any paper to read the original.');
        }

        return { text: lines.join('\n'), sources: agentConfig.includeCitations ? sources : [], results: paperHits.length + trialHits.length };
      };

      const handleSend = () => {
        if (!input.trim() || isTyping) return;

        const query = input.trim();
        setMessages(prev => [...prev, { role: 'user', content: query }]);
        setInput('');
        setIsTyping(true);

        setTimeout(() => {
          const response = generateResponse(query);
          setMessages(prev => [...prev, { role: 'agent', content: response.text, sources: response.sources }]);
          setIsTyping(false);
          setQueryHistory(prev => {
            const next = [{ query, time: new Date().toISOString(), results: response.results }, ...prev].slice(0, 25);
            saveLocal(HISTORY_STORAGE_KEY, next);
            return next;
          });
        }, 600);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      // Create Agent Modal
      const CreateAgentModal = () => (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.8)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200, padding: '40px' }}>
          <div style={{ background: 'linear-gradient(180deg, #1a1f1d 0%, #141918 100%)', borderRadius: '24px', padding: '32px', width: '500px', maxWidth: '100%', animation: 'slideUp 0.3s' }}>

                {['All Research', 'Psilocybin', 'MDMA', 'Ketamine', 'LSD', 'Ayahuasca', 'Cannabis'].map(opt => (
                  <option key={opt} value={opt} style={{ background: '#1a1f1d' }}>{opt}</option>

            </div>

            <div style={{ marginBottom: '24px' }}>

                  <button 
                    key={style}

                    style={{ 
                      flex: 1, padding: '12px', fontSize: '14px', fontWeight: 500, textTransform: 'capitalize',
                      background: agentConfig.style === style ? 'rgba(125,211,192,0.15)' : 'rgba(255,255,255,0.05)',
                      border: `1px solid ${agentConfig.style === style ? 'rgba(125,211,192,0.4)' : 'rgba(255,255,255,0.1)'}`,
                      borderRadius: '10px', color: agentConfig.style === style ? '#7dd3c0' : '#a0a8a4', cursor: 'pointer'

            </div>

            <div style={{ marginBottom: '32px' }}>

                {[
                  { key: 'includeCitations', label: 'Include source citations' },
                  { key: 'includeAbstracts', label: 'Show paper abstracts' }
                ].map(opt => (
                  <label key={opt.key} style={{ display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer' }}>
                    <div 
                      onClick={() => setAgentConfig(prev => ({ ...prev, [opt.key]: !prev[opt.key] }))}
                      style={{ 
                        width: '22px', height: '22px', borderRadius: '6px', 
                        background: agentConfig[opt.key] ? '#7dd3c0' : 'rgba(255,255,255,0.1)',
                        border: `1px solid ${agentConfig[opt.key] ? '#7dd3c0' : 'rgba(255,255,255,0.2)'}`,
                        display: 'flex', alignItems: 'center', justifyContent: 'center'
                      }}
                    >
                      {agentConfig[opt.key] && <span style={{ color: '#0a0f0d', fontSize: '14px', fontWeight: 600 }}>✓</span>}
                    </div>
                    <span style={{ fontSize: '14px', color: '#e8ebe9' }}>{opt.label}</span>
                  </label>
                ))}
              </div>
            </div>

            <div style={{ display: 'flex', gap: '12px' }}>
              <button onClick={() => setShowCreateAgent(false)} style={{ ...sharedStyles.buttonOutline, flex: 1 }}>Cancel</button>
              <button onClick={() => {
                const agent = { id: String(Date.now()), name: agentConfig.name || 'Research Agent', focus: agentConfig.focus, style: agentConfig.style, includeCitations: agentConfig.includeCitations, includeAbstracts: agentConfig.includeAbstracts, createdAt: new Date().toISOString() };
                setMyAgents(prev => { const next = [agent, ...prev].slice(0, 20); saveLocal(AGENTS_STORAGE_KEY, next); return next; });
                setShowCreateAgent(false);
              }} style={{ ...sharedStyles.button, flex: 1 }}>Create Agent</button>
            </div>
          </div>
        </div>
      );

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh', display: 'flex' }}>

            <div style={{ marginBottom: '32px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '16px' }}>
                <div style={{ width: '48px', height: '48px', borderRadius: '14px', background: 'rgba(125,211,192,0.15)', border: '1px solid rgba(125,211,192,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '24px' }}>🧠</div>
                <div>
                  <div style={{ fontSize: '16px', fontWeight: 600, color: '#fff' }}>{agentConfig.name}</div>
                  <div style={{ fontSize: '12px', color: '#7dd3c0', display: 'flex', alignItems: 'center', gap: '6px' }}>
                    <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#7dd3c0' }} />

              <div style={{ fontSize: '13px', color: '#6b7370', marginBottom: '8px' }}>

              </div>
              <div style={{ fontSize: '13px', color: '#6b7370' }}>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                {[
                  { value: paperCount.toLocaleString(), label: 'Papers' },
                  { value: String(journalCount), label: 'Journals' },
                  { value: studyCount.toLocaleString(), label: 'Studies' },
                  { value: fmtK(citationTotal), label: 'Citations' }

                  <div key={i} style={{ padding: '14px', background: 'rgba(255,255,255,0.02)', borderRadius: '12px', textAlign: 'center' }}>

                    <div style={{ fontSize: '11px', color: '#6b7370' }}>{stat.label}</div>
                  </div>

            </div>

            {/* Quick Filters */}

              {['Psilocybin', 'MDMA', 'Ketamine', 'LSD', 'Ayahuasca'].map(substance => (
                <div key={substance} onClick={() => { setActiveTab('chat'); setInput(`${substance} clinical research`); }} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 0', borderBottom: '1px solid rgba(255,255,255,0.04)', cursor: 'pointer' }}>
                  <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: substanceColors[substance] || '#7dd3c0' }} />

                  <span style={{ fontSize: '11px', color: '#6b7370', marginLeft: 'auto' }}>{papers.filter(p => (p.substances || []).includes(substance)).length}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Main Content */}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', height: 'calc(100vh - 100px)' }}>
            {/* Tabs */}

              ))}
              <button onClick={() => setShowCreateAgent(true)} style={{ marginLeft: 'auto', padding: '10px 20px', background: '#7dd3c0', border: 'none', borderRadius: '10px', color: '#0a0f0d', fontSize: '14px', fontWeight: 600, cursor: 'pointer' }}>+ New Agent</button>
            </div>

            {activeTab === 'chat' && (
              <>
                {/* Chat Area */}
                <div style={{ flex: 1, overflowY: 'auto', padding: '32px 40px' }}>
                  {messages.length === 0 ? (
                    <div style={{ maxWidth: '700px', margin: '0 auto', textAlign: 'center' }}>
                      <div style={{ width: '80px', height: '80px', borderRadius: '24px', background: 'rgba(125,211,192,0.15)', border: '1px solid rgba(125,211,192,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '36px', margin: '0 auto 24px' }}>🧠</div>
                      <h1 style={{ fontFamily: '"Fraunces", serif', fontSize: '32px', fontWeight: 600, color: '#fff', marginBottom: '12px' }}>Research Agent</h1>
                      <p style={{ fontSize: '16px', color: '#6b7370', maxWidth: '500px', margin: '0 auto 40px' }}>
                        Ask me anything about natural medicine research. I have access to {paperCount.toLocaleString()} papers and {studyCount.toLocaleString()} clinical studies.
                      </p>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '12px', justifyContent: 'center' }}>
                        {suggestedQuestions.map((q, i) => (
                          <button key={i} onClick={() => setInput(q)} style={{ padding: '12px 18px', fontSize: '13px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '20px', color: '#a0a8a4', cursor: 'pointer', transition: 'all 0.2s' }}>{q}</button>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                      {messages.map((msg, i) => (
                        <div key={i} style={{ marginBottom: '32px', display: 'flex', gap: '16px', flexDirection: msg.role === 'user' ? 'row-reverse' : 'row' }}>
                          <div style={{ width: '40px', height: '40px', borderRadius: '12px', background: msg.role === 'user' ? 'linear-gradient(135deg, #7dd3c0, #a8c5e2)' : 'rgba(125,211,192,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: msg.role === 'user' ? '16px' : '20px', flexShrink: 0 }}>
                            {msg.role === 'user' ? (user?.name?.charAt(0) || 'U') : '🧠'}
                          </div>
                          <div style={{ flex: 1, maxWidth: msg.role === 'user' ? '70%' : '100%' }}>
                            <div style={{ padding: '16px 20px', background: msg.role === 'user' ? 'rgba(125,211,192,0.15)' : 'rgba(255,255,255,0.03)', borderRadius: msg.role === 'user' ? '20px 20px 4px 20px' : '20px 20px 20px 4px', border: `1px solid ${msg.role === 'user' ? 'rgba(125,211,192,0.3)' : 'rgba(255,255,255,0.06)'}` }}>
                              <div style={{ fontSize: '15px', color: '#e8ebe9', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{msg.content}</div>
                            </div>
                            {msg.sources && msg.sources.length > 0 && (
                              <div style={{ marginTop: '16px' }}>
                                <div style={{ fontSize: '12px', color: '#6b7370', marginBottom: '10px', fontWeight: 500 }}>Sources ({msg.sources.length})</div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                  {msg.sources.map((source, j) => (
                                    <div key={j} style={{ padding: '14px 16px', background: 'rgba(255,255,255,0.02)', borderRadius: '12px', borderLeft: `3px solid ${substanceColors[source.substance] || '#7dd3c0'}` }}>
                                      {source.url
                                        ? <a href={source.url} target="_blank" rel="noopener noreferrer" style={{ display: 'block', fontSize: '14px', fontWeight: 500, color: '#e8ebe9', marginBottom: '6px', lineHeight: 1.4, textDecoration: 'none' }}>{source.title} ↗</a>
                                        : <div style={{ fontSize: '14px', fontWeight: 500, color: '#e8ebe9', marginBottom: '6px', lineHeight: 1.4 }}>{source.title}</div>}
                                      <div style={{ fontSize: '12px', color: '#6b7370' }}>{source.authors} • {source.journal} • {source.year}</div>
                                      <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
                                        <span style={{ padding: '3px 8px', fontSize: '10px', fontWeight: 600, background: `${substanceColors[source.substance]}20`, color: substanceColors[source.substance], borderRadius: '4px' }}>{source.substance}</span>
                                        <span style={{ padding: '3px 8px', fontSize: '10px', background: 'rgba(240,183,117,0.1)', color: '#f0b775', borderRadius: '4px' }}>{source.citations} citations</span>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                      ))}
                      {isTyping && (
                        <div style={{ display: 'flex', gap: '16px' }}>
                          <div style={{ width: '40px', height: '40px', borderRadius: '12px', background: 'rgba(125,211,192,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px' }}>🧠</div>
                          <div style={{ padding: '16px 20px', background: 'rgba(255,255,255,0.03)', borderRadius: '20px 20px 20px 4px', border: '1px solid rgba(255,255,255,0.06)' }}>
                            <div style={{ display: 'flex', gap: '6px' }}>
                              <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#7dd3c0', animation: 'pulse 1s infinite' }} />
                              <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#7dd3c0', animation: 'pulse 1s infinite 0.2s' }} />
                              <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#7dd3c0', animation: 'pulse 1s infinite 0.4s' }} />
                            </div>
                          </div>
                        </div>
                      )}
                      <div ref={messagesEndRef} />
                    </div>
                  )}

                {/* Input Area */}
                <div style={{ padding: '24px 40px', borderTop: '1px solid rgba(255,255,255,0.06)', background: 'rgba(10,15,13,0.8)', backdropFilter: 'blur(20px)' }}>

                    <div style={{ display: 'flex', gap: '12px', alignItems: 'flex-end' }}>
                      <div style={{ flex: 1 }}>
                        <textarea
                          value={input}
                          onChange={(e) => setInput(e.target.value)}
                          onKeyDown={handleKeyDown}
                          placeholder="Ask about research, compare substances, find papers..."
                          rows={1}
                          style={{ width: '100%', padding: '16px 20px', fontSize: '15px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '16px', color: '#fff', outline: 'none', resize: 'none', lineHeight: 1.5, fontFamily: '"DM Sans", sans-serif' }}
                        />
                      </div>
                      <button onClick={handleSend} disabled={!input.trim() || isTyping} style={{ ...sharedStyles.button, padding: '16px 28px', opacity: (!input.trim() || isTyping) ? 0.5 : 1, cursor: (!input.trim() || isTyping) ? 'not-allowed' : 'pointer' }}>Send</button>
                    </div>
                    <div style={{ fontSize: '12px', color: '#4a524e', marginTop: '12px', textAlign: 'center' }}>
                      Research Agent searches the live Neuly database — {paperCount.toLocaleString()} papers and {studyCount.toLocaleString()} clinical studies crawled from PubMed, bioRxiv/medRxiv, and ClinicalTrials.gov. Always verify findings with primary sources.
                    </div>
                  </div>
                </div>
              </>
            )}

            {activeTab === 'my agents' && (
              <div style={{ flex: 1, overflowY: 'auto', padding: '32px 40px' }}>
                <div style={{ maxWidth: '900px', margin: '0 auto' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '32px' }}>
                    <div>
                      <h2 style={{ fontFamily: '"Fraunces", serif', fontSize: '28px', fontWeight: 600, color: '#fff', marginBottom: '8px' }}>My Research Agents</h2>
                      <p style={{ fontSize: '15px', color: '#6b7370' }}>Create specialized agents for different research areas</p>
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '20px' }}>
                    {myAgents.map(agent => (
                      <div key={agent.id} style={{ ...sharedStyles.card, cursor: 'pointer' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '16px' }}>
                          <div style={{ width: '48px', height: '48px', borderRadius: '14px', background: `${substanceColors[agent.focus] || '#7dd3c0'}20`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '24px' }}>🧠</div>
                          <div>
                            <h3 style={{ fontSize: '16px', fontWeight: 600, color: '#fff' }}>{agent.name}</h3>
                            <span style={{ fontSize: '12px', color: substanceColors[agent.focus] || '#7dd3c0' }}>{agent.focus}</span>
                          </div>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px', fontSize: '13px' }}>
                          <span style={{ color: '#6b7370' }}>Focus: <span style={{ color: '#a0a8a4' }}>{agent.focus}</span></span>
                          <span style={{ color: '#6b7370' }}>Style: <span style={{ color: '#a0a8a4', textTransform: 'capitalize' }}>{agent.style}</span></span>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: '16px', borderTop: '1px solid rgba(255,255,255,0.06)' }}>
                          <span style={{ fontSize: '12px', color: '#4a524e' }}>Created {timeAgo(agent.createdAt)}</span>
                          <button onClick={() => { setAgentConfig({ name: agent.name, focus: agent.focus, style: agent.style, includeCitations: agent.includeCitations !== false, includeAbstracts: agent.includeAbstracts !== false }); setActiveTab('chat'); }} style={{ padding: '8px 16px', fontSize: '13px', background: 'rgba(125,211,192,0.15)', border: 'none', borderRadius: '8px', color: '#7dd3c0', cursor: 'pointer' }}>Use Agent</button>
                        </div>
                      </div>
                    ))}
                    <div onClick={() => setShowCreateAgent(true)} style={{ ...sharedStyles.card, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', border: '2px dashed rgba(255,255,255,0.1)', minHeight: '200px' }}>
                      <div style={{ width: '56px', height: '56px', borderRadius: '50%', background: 'rgba(125,211,192,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '28px', marginBottom: '16px' }}>+</div>
                      <span style={{ fontSize: '16px', fontWeight: 500, color: '#7dd3c0' }}>Create New Agent</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'history' && (
              <div style={{ flex: 1, overflowY: 'auto', padding: '32px 40px' }}>
                <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                  <h2 style={{ fontFamily: '"Fraunces", serif', fontSize: '28px', fontWeight: 600, color: '#fff', marginBottom: '8px' }}>Query History</h2>
                  <p style={{ fontSize: '15px', color: '#6b7370', marginBottom: '32px' }}>Your recent research queries on this device</p>
                  {queryHistory.length === 0 && (
                    <div style={{ textAlign: 'center', padding: '60px 40px' }}>
                      <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔍</div>
                      <h3 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '8px' }}>No queries yet</h3>
                      <p style={{ fontSize: '15px', color: '#6b7370', marginBottom: '24px' }}>Your research queries will appear here after you ask the agent something</p>
                      <button onClick={() => setActiveTab('chat')} style={sharedStyles.buttonOutline}>Start Researching</button>
                    </div>
                  )}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    {queryHistory.map((item, i) => (
                      <div key={i} style={{ ...sharedStyles.card, display: 'flex', alignItems: 'center', gap: '20px' }}>
                        <div style={{ width: '44px', height: '44px', borderRadius: '12px', background: 'rgba(125,211,192,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '20px' }}>🔍</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: '15px', color: '#e8ebe9', marginBottom: '6px' }}>{item.query}</div>
                          <div style={{ display: 'flex', gap: '16px', fontSize: '13px', color: '#6b7370' }}>
                            <span>{timeAgo(item.time)}</span>
                            <span>{item.results} result{item.results === 1 ? '' : 's'}</span>
                          </div>
                        </div>
                        <button onClick={() => { setInput(item.query); setActiveTab('chat'); }} style={{ padding: '8px 16px', fontSize: '13px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '8px', color: '#a0a8a4', cursor: 'pointer' }}>Run Again</button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>

          {showCreateAgent && <CreateAgentModal />}
        </div>
      );
    };

    const EducationPage = ({ user }) => {
      const [selectedLevel, setSelectedLevel] = useState('All');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const apiData = useApiData();

            <div style={{ display: 'flex', gap: '16px', marginBottom: '32px', flexWrap: 'wrap' }}>
              <input type="text" placeholder="Search jobs or companies..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} style={{ flex: 1, minWidth: '250px', padding: '14px 18px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#fff', fontSize: '14px', outline: 'none' }} />
              <select value={selectedType} onChange={(e) => setSelectedType(e.target.value)} style={{ padding: '14px 18px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#a0a8a4', fontSize: '14px', minWidth: '150px' }}>
                {jobTypes.map(t => <option key={t} value={t}>{t === 'All' ? 'All Types' : t}</option>)}
              </select>
              <select value={selectedLocation} onChange={(e) => setSelectedLocation(e.target.value)} style={{ padding: '14px 18px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#a0a8a4', fontSize: '14px', minWidth: '150px' }}>
                {locations.map(l => <option key={l} value={l}>{l === 'All' ? 'All Locations' : l}</option>)}
              </select>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {filteredJobs.map(job => (
                <div key={job.id} style={{ ...sharedStyles.card, display: 'flex', gap: '20px', alignItems: 'flex-start' }}>
                  <div style={{ width: '56px', height: '56px', borderRadius: '16px', background: 'rgba(125,211,192,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '28px', flexShrink: 0 }}>{job.companyLogo}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px' }}>
                      <div>
                        <h3 style={{ fontSize: '18px', fontWeight: 600, color: '#fff', marginBottom: '4px' }}>{job.title}</h3>
                        <p style={{ fontSize: '14px', color: '#7dd3c0' }}>{job.company}</p>
                      </div>
                      <span style={{ fontSize: '12px', color: '#6b7370' }}>{job.posted}</span>
                    </div>
                    <p style={{ fontSize: '14px', color: '#a0a8a4', marginBottom: '12px' }}>{job.description}</p>
                    <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap', alignItems: 'center' }}>
                      <span style={{ padding: '6px 12px', fontSize: '12px', background: 'rgba(125,211,192,0.15)', color: '#7dd3c0', borderRadius: '6px' }}>{job.type}</span>
                      <span style={{ padding: '6px 12px', fontSize: '12px', background: 'rgba(255,255,255,0.05)', color: '#a0a8a4', borderRadius: '6px' }}>📍 {job.location}</span>
                      <span style={{ padding: '6px 12px', fontSize: '12px', background: 'rgba(240,183,117,0.15)', color: '#f0b775', borderRadius: '6px' }}>💰 {job.salary}</span>
                    </div>
                  </div>
                  <button onClick={() => job.url && window.open(job.url, '_blank')} disabled={!job.url} style={{ ...sharedStyles.button, padding: '12px 24px', flexShrink: 0, opacity: job.url ? 1 : 0.5, cursor: job.url ? 'pointer' : 'not-allowed' }}>Apply</button>
                </div>
              ))}
            </div>

            {filteredJobs.length === 0 && (
              <div style={{ textAlign: 'center', padding: '60px 40px' }}>
                <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔍</div>
                <h3 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '8px' }}>No jobs found</h3>
                <p style={{ fontSize: '15px', color: '#6b7370' }}>Try adjusting your search or filters</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    // EVENTS PAGE
    const EventsPage = ({ user }) => {
      const [selectedType, setSelectedType] = useState('All');
      const [selectedFormat, setSelectedFormat] = useState('All');

      const eventTypes = ['All', 'Conference', 'Webinar', 'Workshop', 'Summit', 'Meetup'];
      const formats = ['All', 'In-Person', 'Virtual', 'Hybrid'];

      const apiData = useApiData();
      const events = (apiData?.events || []).map(normalizeEvent);

      const filteredEvents = events.filter(e => 
        (selectedType === 'All' || e.type === selectedType) &&
        (selectedFormat === 'All' || e.format === selectedFormat)
      );

      const featuredEvents = filteredEvents.filter(e => e.featured);
      const upcomingEvents = filteredEvents.filter(e => !e.featured);

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <div style={{ textAlign: 'center', marginBottom: '48px' }}>
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', marginBottom: '16px' }}>
                <NeulyLogo height={32} suffix="events" />
              </div>
              <h1 style={{ fontFamily: '"Fraunces", serif', fontSize: '42px', fontWeight: 600, color: '#fff', marginBottom: '12px' }}>Industry Events</h1>
              <p style={{ fontSize: '18px', color: '#a0a8a4', maxWidth: '600px', margin: '0 auto' }}>Connect with the community at conferences, webinars, and workshops.</p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '20px', marginBottom: '40px' }}>
              {[
                { value: String(events.length), label: 'Upcoming Events', color: '#7dd3c0' },
                { value: String(events.filter(e => e.type === 'Conference').length), label: 'Conferences', color: '#f0b775' },
                { value: String(events.filter(e => e.type === 'Webinar').length), label: 'Webinars', color: '#a8c5e2' },
                { value: String(events.filter(e => e.type === 'Workshop').length), label: 'Workshops', color: '#d4a5c9' }
              ].map((stat, i) => (
                <div key={i} style={{ ...sharedStyles.card, textAlign: 'center' }}>
                  <div style={{ fontFamily: '"Fraunces", serif', fontSize: '32px', fontWeight: 600, color: stat.color }}>{stat.value}</div>
                  <div style={{ fontSize: '14px', color: '#6b7370' }}>{stat.label}</div>
                </div>
              ))}
            </div>

            <div style={{ display: 'flex', gap: '16px', marginBottom: '32px' }}>
              <select value={selectedType} onChange={(e) => setSelectedType(e.target.value)} style={{ padding: '14px 18px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#a0a8a4', fontSize: '14px', minWidth: '150px' }}>
                {eventTypes.map(t => <option key={t} value={t}>{t === 'All' ? 'All Types' : t}</option>)}
              </select>
              <select value={selectedFormat} onChange={(e) => setSelectedFormat(e.target.value)} style={{ padding: '14px 18px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#a0a8a4', fontSize: '14px', minWidth: '150px' }}>
                {formats.map(f => <option key={f} value={f}>{f === 'All' ? 'All Formats' : f}</option>)}
              </select>
            </div>

            {featuredEvents.length > 0 && (
              <>
                <h2 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '20px' }}>🌟 Featured Events</h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '24px', marginBottom: '48px' }}>
                  {featuredEvents.map(event => (
                    <div key={event.id} style={{ ...sharedStyles.card, background: 'linear-gradient(135deg, rgba(125,211,192,0.1) 0%, rgba(168,197,226,0.05) 100%)', border: '1px solid rgba(125,211,192,0.2)' }}>
                      <div style={{ display: 'flex', gap: '20px' }}>
                        <div style={{ width: '80px', height: '80px', borderRadius: '20px', background: 'rgba(125,211,192,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '40px', flexShrink: 0 }}>{event.image}</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
                            <span style={{ padding: '4px 10px', fontSize: '11px', fontWeight: 600, background: 'rgba(125,211,192,0.2)', color: '#7dd3c0', borderRadius: '4px' }}>{event.type}</span>
                            <span style={{ padding: '4px 10px', fontSize: '11px', background: 'rgba(240,183,117,0.15)', color: '#f0b775', borderRadius: '4px' }}>{event.format}</span>
                          </div>
                          <h3 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '8px' }}>{event.title}</h3>
                          <p style={{ fontSize: '14px', color: '#a0a8a4', marginBottom: '12px', lineHeight: 1.5 }}>{event.description}</p>
                          <div style={{ display: 'flex', gap: '16px', flexWrap: 'wrap', alignItems: 'center', marginBottom: '16px' }}>
                            <span style={{ fontSize: '13px', color: '#6b7370' }}>📅 {event.date}</span>
                            <span style={{ fontSize: '13px', color: '#6b7370' }}>📍 {event.location}</span>
                            <span style={{ fontSize: '13px', color: '#6b7370' }}>👥 {event.attendees}</span>
                          </div>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span style={{ fontSize: '16px', fontWeight: 600, color: '#7dd3c0' }}>{event.price}</span>
                            <button onClick={() => event.website && window.open(event.website, '_blank')} disabled={!event.website} style={{ ...sharedStyles.button, padding: '10px 20px', opacity: event.website ? 1 : 0.5, cursor: event.website ? 'pointer' : 'not-allowed' }}>Register</button>
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            <h2 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '20px' }}>📅 All Events</h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '20px' }}>
              {upcomingEvents.map(event => (
                <div key={event.id} style={{ ...sharedStyles.card }}>
                  <div style={{ display: 'flex', gap: '16px', marginBottom: '16px' }}>
                    <div style={{ width: '56px', height: '56px', borderRadius: '16px', background: 'rgba(125,211,192,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '28px', flexShrink: 0 }}>{event.image}</div>
                    <div>
                      <div style={{ display: 'flex', gap: '6px', marginBottom: '6px' }}>
                        <span style={{ padding: '3px 8px', fontSize: '10px', fontWeight: 600, background: 'rgba(125,211,192,0.15)', color: '#7dd3c0', borderRadius: '4px' }}>{event.type}</span>
                        <span style={{ padding: '3px 8px', fontSize: '10px', background: 'rgba(255,255,255,0.05)', color: '#a0a8a4', borderRadius: '4px' }}>{event.format}</span>
                      </div>
                      <h3 style={{ fontSize: '16px', fontWeight: 600, color: '#fff' }}>{event.title}</h3>
                    </div>
                  </div>
                  <p style={{ fontSize: '13px', color: '#6b7370', marginBottom: '12px' }}>{event.host}</p>
                  <div style={{ display: 'flex', gap: '12px', marginBottom: '16px', fontSize: '12px', color: '#6b7370' }}>
                    <span>📅 {event.date}</span>
                    <span>📍 {event.location}</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span style={{ fontSize: '14px', fontWeight: 600, color: '#7dd3c0' }}>{event.price}</span>
                    <button onClick={() => event.website && window.open(event.website, '_blank')} disabled={!event.website} style={{ ...sharedStyles.buttonOutline, padding: '8px 16px', fontSize: '13px', opacity: event.website ? 1 : 0.5, cursor: event.website ? 'pointer' : 'not-allowed' }}>Details</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const Footer = () => (
      <footer style={{ borderTop: '1px solid rgba(255,255,255,0.06)', padding: '60px 40px 40px', position: 'relative', zIndex: 1 }}>
        <div style={{ maxWidth: '1280px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '24px' }}>
          <NeulyLogo height={18} />
          <p style={{ fontSize: '13px', color: '#4a524e' }}>© 2026 Neuly. All rights reserved.</p>
        </div>
      </footer>
    );

    // Main App
    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [user, setUser] = useState(null);
      const [authModal, setAuthModal] = useState(null); // null | 'login' | 'signup'
      const [selectedCompany, setSelectedCompany] = useState(null);
      const [selectedPerson, setSelectedPerson] = useState(null);

      // Restore an existing session cookie on load. Raw fetch: a 401 here
      // just means "not signed in", which isn't an error worth logging.
      useEffect(() => {
        let cancelled = false;
        fetch(`${API_BASE_URL}/auth/me`, { credentials: 'include' })
          .then(r => (r.ok ? r.json() : null))
          .then(res => { if (!cancelled && res && res.user) setUser(res.user); })
          .catch(() => undefined);
        return () => { cancelled = true; };
      }, []);

      const openAuth = (mode) => setAuthModal(mode || 'signup');
      const onAuthed = (authedUser) => {
        setUser(authedUser);
        setAuthModal(null);
        setCurrentPage('dashboard');
        window.scrollTo(0, 0);
      };
      const signOut = () => {
        api.post('/auth/logout').catch(() => undefined);
        setUser(null);
        setCurrentPage('home');
      };

      const homePage = (
        <>
          <HeroSection setCurrentPage={setCurrentPage} openAuth={openAuth} />
          <SubstancesSection />
          <ResearchHomeSection setCurrentPage={setCurrentPage} />
          <CompaniesHomeSection setCurrentPage={setCurrentPage} />
          <PeopleHomeSection setCurrentPage={setCurrentPage} />
          <EducationHomeSection setCurrentPage={setCurrentPage} />
          <CareHomeSection setCurrentPage={setCurrentPage} />
          <FinalCTA openAuth={openAuth} />
        </>
      );

      const renderPage = () => {
        switch(currentPage) {
          case 'home':
            return homePage;
          case 'dashboard':
            return user ? <DashboardPage user={user} setCurrentPage={setCurrentPage} /> : homePage;
          case 'research':
            return <ResearchAgentPage user={user} />;
          case 'companies':
            return <CompaniesPage user={user} setSelectedCompany={setSelectedCompany} setCurrentPage={setCurrentPage} />;
          case 'company-profile':
            return <CompanyProfilePage company={selectedCompany} setCurrentPage={setCurrentPage} setSelectedPerson={setSelectedPerson} />;
          case 'people':
            return <PeoplePage user={user} setSelectedPerson={setSelectedPerson} setCurrentPage={setCurrentPage} />;
          case 'person-profile':
            return <PersonProfilePage person={selectedPerson} setCurrentPage={setCurrentPage} setSelectedCompany={setSelectedCompany} />;
          case 'education':
            return <EducationPage user={user} />;
          case 'care':
            return <CarePage user={user} />;
          case 'studies':
            return <StudiesPage user={user} />;
          case 'jobs':
            return <JobsPage user={user} />;
          case 'events':
            return <EventsPage user={user} />;
          default:
            return user ? <DashboardPage user={user} setCurrentPage={setCurrentPage} /> : homePage;
        }
      };

      const isMobile = useIsMobile();
      const appMode = Boolean(user) && isMobile;

      return (
        <SavesProvider user={user} requireAuth={openAuth}>
          <div style={{ ...sharedStyles.container, ...(appMode ? { paddingBottom: 'calc(84px + env(safe-area-inset-bottom))' } : {}) }}>
            <AmbientBackground />
            <Navigation user={user} openAuth={openAuth} signOut={signOut} currentPage={currentPage} setCurrentPage={setCurrentPage} />
            {renderPage()}
            {!appMode && <Footer />}
            {authModal && <AuthModal mode={authModal} setMode={setAuthModal} onClose={() => setAuthModal(null)} onAuthed={onAuthed} />}
          </div>
        </SavesProvider>
      );
    };

    // API Status Indicator Component
    const ApiStatusIndicator = () => {
      const apiData = useApiData();
      const isMobile = useIsMobile();
      if (!apiData) return null;

      const { usingApi, loading, attempts } = apiData;

      // On mobile/tablet the pill would collide with the bottom tab bar
      if (isMobile) return null;

      // Connected → teal "Live Data". While retrying → amber "Connecting…".
      // After several failures the API clearly isn't there (e.g. the frontend is
      // being served without its backend) → red "API offline" instead of
      // pretending a reconnect is imminent. Retries continue in the background.
      const offline = !usingApi && attempts >= 4;
      const color = usingApi ? '#7dd3c0' : offline ? '#e57373' : '#f0b775';
      const label = usingApi ? 'Live Data' : offline ? 'API offline' : 'Connecting…';

      return (
        <div style={{
          position: 'fixed',
          bottom: '20px',
          right: '20px',
          zIndex: 1000,
          display: 'flex',
          alignItems: 'center',
          gap: '8px',
          padding: '8px 16px',
          background: `${color}26`,
          border: `1px solid ${color}4d`,
          borderRadius: '20px',
          fontSize: '12px',
          color
        }}>
          <div style={{
            width: '8px',
            height: '8px',
            borderRadius: '50%',
            background: color,
            animation: 'pulse 2s ease-in-out infinite'
          }} />
          {label}
        </div>
      );
    };

    // Wrapped App with DataProvider
    const WrappedApp = () => (
      <DataProvider>
        <App />
        <ApiStatusIndicator />
      </DataProvider>
    );

    ReactDOM.render(<WrappedApp />, document.getElementById('root'));
  </script>
</body>
</html>
