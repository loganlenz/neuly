                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span style={{ fontSize: '16px', fontWeight: 600, color: '#7dd3c0' }}>{event.price}</span>
                            <button onClick={() => event.website && window.open(event.website, '_blank')} disabled={!event.website} style={{ ...sharedStyles.button, padding: '10px 20px', opacity: event.website ? 1 : 0.5, cursor: event.website ? 'pointer' : 'not-allowed' }}>Register</button>
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            <h2 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '20px' }}>📅 All Events</h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '20px' }}>
              {upcomingEvents.map(event => (
                <div key={event.id} style={{ ...sharedStyles.card }}>
                  <div style={{ display: 'flex', gap: '16px', marginBottom: '16px' }}>
                    <div style={{ width: '56px', height: '56px', borderRadius: '16px', background: 'rgba(125,211,192,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '28px', flexShrink: 0 }}>{event.image}</div>
                    <div>
                      <div style={{ display: 'flex', gap: '6px', marginBottom: '6px' }}>
                        <span style={{ padding: '3px 8px', fontSize: '10px', fontWeight: 600, background: 'rgba(125,211,192,0.15)', color: '#7dd3c0', borderRadius: '4px' }}>{event.type}</span>
                        <span style={{ padding: '3px 8px', fontSize: '10px', background: 'rgba(255,255,255,0.05)', color: '#a0a8a4', borderRadius: '4px' }}>{event.format}</span>
                      </div>
                      <h3 style={{ fontSize: '16px', fontWeight: 600, color: '#fff' }}>{event.title}</h3>
                    </div>
                  </div>
                  <p style={{ fontSize: '13px', color: '#6b7370', marginBottom: '12px' }}>{event.host}</p>
                  <div style={{ display: 'flex', gap: '12px', marginBottom: '16px', fontSize: '12px', color: '#6b7370' }}>
                    <span>📅 {event.date}</span>
                    <span>📍 {event.location}</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span style={{ fontSize: '14px', fontWeight: 600, color: '#7dd3c0' }}>{event.price}</span>
                    <button onClick={() => event.website && window.open(event.website, '_blank')} disabled={!event.website} style={{ ...sharedStyles.buttonOutline, padding: '8px 16px', fontSize: '13px', opacity: event.website ? 1 : 0.5, cursor: event.website ? 'pointer' : 'not-allowed' }}>Details</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ============================================================
    // App-level UI context — lets any page open the auth modal, navigate,
    // or hand a pre-filled alert to the Account page.
    // ============================================================
    const AppUIContext = createContext({ user: null, openAuth: () => {}, setCurrentPage: () => {}, requestAlert: () => {} });
    const useAppUI = () => useContext(AppUIContext);

    const ALERT_ENTITY_TYPES = [
      ['clinical_trials', 'Clinical trials'], ['research_papers', 'Research papers'], ['companies', 'Companies'], ['people', 'People'],
      ['jobs', 'Jobs'], ['events', 'Events'], ['legislation', 'Legislation'], ['funding_events', 'Funding events'], ['grants', 'Grants']
    ];
    const EXPORT_TYPES = [...ALERT_ENTITY_TYPES, ['educational_resources', 'Educational resources'], ['care_providers', 'Care providers']];
    const entityLabel = (t) => (ALERT_ENTITY_TYPES.find(([k]) => k === t) || [t, (t || 'All datasets').replace(/_/g, ' ')])[1];
    const isPaidPlan = (user) => Boolean(user && (user.plan === 'pro' || user.plan === 'enterprise'));

    // "Create alert for this" — pre-fills the Account page alert form with
    // the current search keyword and dataset. Signed-out clicks open login.
    const AlertButton = ({ entityType, keyword, style }) => {
      const { requestAlert } = useAppUI();
      const kw = (keyword || '').trim();
      return (
        <button onClick={() => requestAlert(entityType, kw)} title="Get an email when new records match" style={{ ...sharedStyles.buttonOutline, padding: '10px 18px', fontSize: '13px', whiteSpace: 'nowrap', ...style }}>
          🔔 Create alert{kw ? ` for “${kw.length > 24 ? kw.slice(0, 24) + '…' : kw}”` : ' for this'}
        </button>
      );
    };

    // ---- shared page primitives (match the existing pages' look) ----
    const PageHeader = ({ suffix, title, subtitle, children }) => (
      <div style={{ textAlign: 'center', marginBottom: '40px' }}>
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', marginBottom: '16px' }}><NeulyLogo height={32} suffix={suffix} /></div>
        <h1 style={{ fontFamily: '"Fraunces", serif', fontSize: '42px', fontWeight: 600, color: '#fff', marginBottom: '12px' }}>{title}</h1>
        <p style={{ fontSize: '18px', color: '#a0a8a4', maxWidth: '640px', margin: '0 auto', lineHeight: 1.6 }}>{subtitle}</p>
        {children}
      </div>
    );
    const StatTiles = ({ stats }) => (
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '20px', marginBottom: '40px' }}>
        {stats.map((stat, i) => (
          <div key={i} style={{ ...sharedStyles.card, textAlign: 'center' }}>
            <div style={{ fontFamily: '"Fraunces", serif', fontSize: '32px', fontWeight: 600, color: stat.color || '#7dd3c0' }}>{stat.value}</div>
            <div style={{ fontSize: '14px', color: '#6b7370' }}>{stat.label}</div>
          </div>
        ))}
      </div>
    );
    const filterInputStyle = { flex: 1, minWidth: '250px', padding: '14px 18px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#fff', fontSize: '14px', outline: 'none', fontFamily: '"DM Sans", sans-serif' };
    const filterSelectStyle = { padding: '14px 18px', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px', color: '#a0a8a4', fontSize: '14px', minWidth: '150px', fontFamily: '"DM Sans", sans-serif' };
    const FilterSelect = ({ value, onChange, options, allLabel, labelFor = (v) => v }) => (
      <select value={value} onChange={(e) => onChange(e.target.value)} style={filterSelectStyle}>
        {options.map(o => <option key={o} value={o}>{o === 'All' ? allLabel : labelFor(o)}</option>)}
      </select>
    );
    const Pagination = ({ page, totalPages, total, setPage, loading, noun = 'results' }) => {
      if (!total) return null;
      const btn = (disabled) => ({ ...sharedStyles.buttonOutline, padding: '10px 18px', fontSize: '13px', opacity: disabled ? 0.4 : 1, cursor: disabled ? 'not-allowed' : 'pointer' });
      return (
        <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '16px', marginTop: '32px', flexWrap: 'wrap' }}>
          <button disabled={page <= 1 || loading} onClick={() => { setPage(page - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }} style={btn(page <= 1 || loading)}>← Previous</button>
          <span style={{ fontSize: '14px', color: '#6b7370' }}>Page {page} of {totalPages} · {total.toLocaleString()} {noun}</span>
          <button disabled={page >= totalPages || loading} onClick={() => { setPage(page + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }} style={btn(page >= totalPages || loading)}>Next →</button>
        </div>
      );
    };
    const ListState = ({ loading, error, empty, icon = '🔍', title = 'No results', text = 'Try adjusting your search or filters' }) => {
      if (loading) return <div style={{ textAlign: 'center', padding: '60px', color: '#6b7370', fontSize: '15px' }}>Loading…</div>;
      if (error) return (
        <div style={{ textAlign: 'center', padding: '60px 40px' }}>
          <div style={{ fontSize: '48px', marginBottom: '16px' }}>⚠️</div>
          <h3 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '8px' }}>Couldn't load data</h3>
          <p style={{ fontSize: '15px', color: '#6b7370' }}>{error}</p>
        </div>
      );
      if (empty) return (
        <div style={{ textAlign: 'center', padding: '60px 40px' }}>
          <div style={{ fontSize: '48px', marginBottom: '16px' }}>{icon}</div>
          <h3 style={{ fontSize: '20px', fontWeight: 600, color: '#fff', marginBottom: '8px' }}>{title}</h3>
          <p style={{ fontSize: '15px', color: '#6b7370' }}>{text}</p>
        </div>
      );
      return null;
    };
    const ExternalLink = ({ href, children, style }) => href
      ? <a href={href} target="_blank" rel="noopener noreferrer" style={{ fontSize: '14px', color: '#7dd3c0', fontWeight: 500, textDecoration: 'none', whiteSpace: 'nowrap', ...style }}>{children} ↗</a>
      : null;
    // Expand/collapse long text (abstracts, descriptions)
    const Expandable = ({ text, limit = 220, style }) => {
      const [open, setOpen] = useState(false);
      if (!text) return null;
      const long = text.length > limit;
      return (
        <p style={{ fontSize: '14px', color: '#a0a8a4', lineHeight: 1.6, ...style }}>
          {open || !long ? text : text.slice(0, limit).trimEnd() + '…'}
          {long && <span onClick={() => setOpen(!open)} style={{ color: '#7dd3c0', cursor: 'pointer', marginLeft: '6px', fontWeight: 500 }}>{open ? 'Less' : 'More'}</span>}
        </p>
      );
    };
    // Reset to page 1 whenever a filter changes
    const useResetPage = (setPage, deps) => { const first = useRef(true); useEffect(() => { if (first.current) { first.current = false; return; } setPage(1); }, deps); };
    // Loads (up to `limit`) rows once so dropdown options can be derived from
    // the whole dataset rather than the current page.
    const useFacetRows = (endpoint, limit = 1000) => {
      const [rows, setRows] = useState([]);
      useEffect(() => {
        let cancelled = false;
        api.get(`${endpoint}${buildQuery({ limit })}`).then(res => { if (!cancelled && res && Array.isArray(res.data)) setRows(res.data); });
        return () => { cancelled = true; };
      }, [endpoint]);
      return rows;
    };

    // ============================================================
    // RESEARCH PAGE — peer-reviewed papers & preprints, server-paginated
    // ============================================================
    const fmtAuthors = (authors, max = 3) => {
      const names = (authors || []).map(a => a && a.name).filter(Boolean);
      if (names.length === 0) return 'Authors not listed';
      return names.slice(0, max).join(', ') + (names.length > max ? ` et al. (${names.length})` : '');
    };

    const ResearchPage = ({ user }) => {
      const apiData = useApiData();
      const { setCurrentPage } = useAppUI();
      const [search, setSearch] = useState('');
      const [substance, setSubstance] = useState('All');
      const [year, setYear] = useState('All');
      const [page, setPage] = useState(1);
      useResetPage(setPage, [search, substance, year]);
      const { rows, total, totalPages, loading, error, loaded } = usePagedQuery('/research', { search: search.trim(), substance, year, page, limit: 25 });

      // Facets: substances with trials (dashboard) ∪ substances seen in
      // results; years accumulate from every page fetched this session.
      const substanceStats = apiData?.stats?.substanceStats || {};
      const [seen, setSeen] = useState({ years: [], substances: [] });
      useEffect(() => {
        if (!rows.length) return;
        setSeen(prev => ({
          years: uniqueSorted([...prev.years, ...rows.map(p => p.year).filter(Boolean)]).reverse(),
          substances: uniqueSorted([...prev.substances, ...rows.flatMap(p => p.substances || [])])
        }));
      }, [rows]);
      const substanceOptions = ['All', ...uniqueSorted([...Object.entries(substanceStats).filter(([n, c]) => c > 0 && n !== 'Other').map(([n]) => n), ...seen.substances])];
      const yearOptions = ['All', ...uniqueSorted([...seen.years, ...(year !== 'All' ? [Number(year)] : [])]).reverse()];
      const paperCount = apiData?.stats?.counts?.researchPapers;
      const preprints = rows.filter(isPreprint).length;

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <PageHeader suffix="research" title="Research Papers" subtitle="Peer-reviewed studies and preprints on natural medicine, crawled from PubMed, bioRxiv and medRxiv — searchable across titles, abstracts and authors.">
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', marginTop: '24px', flexWrap: 'wrap' }}>
                <button onClick={() => setCurrentPage('agent')} style={{ ...sharedStyles.button, padding: '12px 24px', fontSize: '14px' }}>🧠 Ask the Research Agent</button>
                <AlertButton entityType="research_papers" keyword={search} style={{ padding: '12px 24px', fontSize: '14px' }} />
              </div>
            </PageHeader>

            <StatTiles stats={[
              { value: paperCount != null ? paperCount.toLocaleString() : '—', label: 'Papers Indexed', color: '#7dd3c0' },
              { value: loaded ? total.toLocaleString() : '—', label: 'Matching Your Filters', color: '#a8c5e2' },
              { value: String(Math.max(substanceOptions.length - 1, 0)), label: 'Substances Covered', color: '#f0b775' },
              { value: loaded ? `${preprints} / ${rows.length}` : '—', label: 'Preprints on This Page', color: '#d4a5c9' }
            ]} />

            <div style={{ display: 'flex', gap: '16px', marginBottom: '32px', flexWrap: 'wrap' }}>
              <input type="text" placeholder="Search titles, abstracts, authors..." value={search} onChange={(e) => setSearch(e.target.value)} style={filterInputStyle} />
              <FilterSelect value={substance} onChange={setSubstance} options={substanceOptions} allLabel="All Substances" />
              <FilterSelect value={year} onChange={(v) => setYear(v)} options={yearOptions.map(String)} allLabel="All Years" />
            </div>

            <ListState loading={loading && !loaded} error={error} empty={loaded && rows.length === 0} icon="📄" title="No papers found" text={search.trim().split(/\s+/).length > 1 ? 'Search matches an exact phrase in titles, abstracts and author names — try a single keyword, or ask the Research Agent, which searches term by term.' : 'Try different keywords, another substance, or clear the year filter.'} />

            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', opacity: loading && loaded ? 0.6 : 1, transition: 'opacity 0.2s' }}>
              {rows.map(p => {
                const url = paperUrl(p);
                const preprint = isPreprint(p);
                return (
                  <div key={p.id} style={{ ...sharedStyles.card, display: 'flex', gap: '20px', alignItems: 'flex-start' }}>
                    <div style={{ width: '48px', height: '48px', borderRadius: '12px', background: `${subColor((p.substances || [])[0] || 'Multiple')}15`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '22px', flexShrink: 0 }}>📄</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '8px', alignItems: 'center' }}>
                        {preprint && <span style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: 'rgba(240,183,117,0.15)', color: '#f0b775', borderRadius: '4px' }}>Preprint</span>}
                        {p.isOpenAccess && <span style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: 'rgba(152,212,160,0.15)', color: '#98d4a0', borderRadius: '4px' }}>Open access</span>}
                        {(p.substances || []).map(s => <SubstanceChip key={s} name={s} />)}
                      </div>
                      {url
                        ? <a href={url} target="_blank" rel="noopener noreferrer" style={{ display: 'block', fontSize: '17px', fontWeight: 600, color: '#fff', marginBottom: '6px', lineHeight: 1.4, textDecoration: 'none' }}>{p.title}</a>
                        : <h3 style={{ fontSize: '17px', fontWeight: 600, color: '#fff', marginBottom: '6px', lineHeight: 1.4 }}>{p.title}</h3>}
                      <p style={{ fontSize: '13px', color: '#a0a8a4', marginBottom: '4px' }}>{fmtAuthors(p.authors)}</p>
                      <p style={{ fontSize: '13px', color: '#6b7370', marginBottom: p.abstract ? '10px' : 0 }}>
                        <span style={{ color: '#7dd3c0' }}>{p.journal || (preprint ? 'Preprint server' : 'Journal not listed')}</span>
                        {p.year ? ` · ${p.year}` : ''}
                        {p.publicationDate ? ` · ${fmtDate(p.publicationDate)}` : ''}
                        {p.citationCount != null && p.citationCount > 0 ? ` · ${p.citationCount.toLocaleString()} citation${p.citationCount === 1 ? '' : 's'}` : ''}
                      </p>
                      <Expandable text={p.abstract} limit={260} />
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '8px', flexShrink: 0 }}>
                      {url && <button onClick={() => window.open(url, '_blank')} style={{ ...sharedStyles.button, padding: '10px 20px', fontSize: '13px' }}>Read ↗</button>}
                      {p.pmid && <span style={{ fontSize: '11px', color: '#4a524e' }}>PMID {p.pmid}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
            <Pagination page={page} totalPages={totalPages} total={total} setPage={setPage} loading={loading} noun="papers" />
          </div>
        </div>
      );
    };

    // ============================================================
    // POLICY PAGE — Federal Register documents + state bills (LegiScan)
    // ============================================================
    const POLICY_STATUS_COLORS = { 'Rule': '#7dd3c0', 'Proposed Rule': '#f0b775', 'Notice': '#a8c5e2', 'Presidential Document': '#d4a5c9' };
    const isFederal = (b) => b.jurisdiction === 'US-Federal';

    const PolicyPage = ({ user }) => {
      const [search, setSearch] = useState('');
      const [jurisdiction, setJurisdiction] = useState('All');
      const [substance, setSubstance] = useState('All');
      const [page, setPage] = useState(1);
      useResetPage(setPage, [search, jurisdiction, substance]);
      const { rows, total, totalPages, loading, error, loaded } = usePagedQuery('/legislation', { search: search.trim(), jurisdiction, substance, page, limit: 25 });
      const facetRows = useFacetRows('/legislation');
      const jurisdictions = ['All', ...uniqueSorted(facetRows.map(b => b.jurisdiction)).sort((a, b) => (a === 'US-Federal' ? -1 : b === 'US-Federal' ? 1 : jurisdictionLabel(a).localeCompare(jurisdictionLabel(b))))];
      const substances = optionsFrom(facetRows, b => b.substances || []);
      const federalTotal = facetRows.filter(isFederal).length;
      const stateTotal = facetRows.length - federalTotal;
      const federal = rows.filter(isFederal);
      const stateBills = rows.filter(b => !isFederal(b));

      const statusStyle = (s) => { const c = POLICY_STATUS_COLORS[s] || '#a0a8a4'; return { padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: `${c}20`, color: c, borderRadius: '4px' }; };
      const BillCard = ({ b }) => {
        const fed = isFederal(b);
        return (
          <div style={{ ...sharedStyles.card, display: 'flex', gap: '20px', alignItems: 'flex-start', borderLeft: `3px solid ${fed ? '#c084fc' : '#7dd3c0'}` }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '8px', alignItems: 'center' }}>
                <span style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: fed ? 'rgba(192,132,252,0.15)' : 'rgba(125,211,192,0.15)', color: fed ? '#c084fc' : '#7dd3c0', borderRadius: '4px' }}>{jurisdictionLabel(b.jurisdiction)}</span>
                <span style={{ fontSize: '12px', color: '#a0a8a4', fontWeight: 600 }}>{fed ? `FR Doc. ${b.billNumber}` : b.billNumber}</span>
                {b.status && <span style={statusStyle(b.status)}>{b.status}</span>}
                {(b.substances || []).map(s => <SubstanceChip key={s} name={s} />)}
              </div>
              <a href={b.url} target="_blank" rel="noopener noreferrer" style={{ display: 'block', fontSize: '17px', fontWeight: 600, color: '#fff', marginBottom: '6px', lineHeight: 1.4, textDecoration: 'none' }}>{b.title}</a>
              <Expandable text={b.description} limit={240} style={{ marginBottom: '8px' }} />
              <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap', fontSize: '12px', color: '#6b7370' }}>
                {b.lastActionDate && <span>🗓️ {fmtDate(b.lastActionDate)}{b.lastAction ? ` · ${b.lastAction}` : ''}</span>}
                {b.agencies && b.agencies.length > 0 && <span>🏛️ {b.agencies.slice(0, 3).join(', ')}{b.agencies.length > 3 ? ` +${b.agencies.length - 3}` : ''}</span>}
                <span>Source: {b.source}</span>
              </div>
            </div>
            <button onClick={() => window.open(b.url, '_blank')} style={{ ...sharedStyles.buttonOutline, padding: '10px 18px', fontSize: '13px', flexShrink: 0 }}>{fed ? 'Federal Register ↗' : 'View Bill ↗'}</button>
          </div>
        );
      };
      const Group = ({ title, note, color, items, totalCount }) => items.length === 0 ? null : (
        <div style={{ marginBottom: '40px' }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: '12px', marginBottom: '16px', flexWrap: 'wrap' }}>
            <h2 style={{ fontSize: '20px', fontWeight: 600, color: '#fff' }}><span style={{ color }}>●</span> {title}</h2>
            <span style={{ fontSize: '13px', color: '#6b7370' }}>{note} · {items.length} on this page{totalCount ? ` · ${totalCount} total` : ''}</span>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>{items.map(b => <BillCard key={b.id} b={b} />)}</div>
        </div>
      );

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <PageHeader suffix="policy" title="Policy & Regulation" subtitle="Federal Register rules and notices alongside state legislation on natural medicine — tracked as they move.">
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', marginTop: '24px' }}><AlertButton entityType="legislation" keyword={search} style={{ padding: '12px 24px', fontSize: '14px' }} /></div>
            </PageHeader>
            <StatTiles stats={[
              { value: facetRows.length ? facetRows.length.toLocaleString() : (loaded ? total.toLocaleString() : '—'), label: 'Items Tracked', color: '#7dd3c0' },
              { value: facetRows.length ? String(federalTotal) : '—', label: 'Federal Documents', color: '#c084fc' },
              { value: facetRows.length ? String(stateTotal) : '—', label: 'State Bills', color: '#a8c5e2' },
              { value: facetRows.length ? String(jurisdictions.length - 1) : '—', label: 'Jurisdictions', color: '#f0b775' }
            ]} />
            <div style={{ display: 'flex', gap: '16px', marginBottom: '32px', flexWrap: 'wrap' }}>
              <input type="text" placeholder="Search titles, descriptions, bill numbers..." value={search} onChange={(e) => setSearch(e.target.value)} style={filterInputStyle} />
              <FilterSelect value={jurisdiction} onChange={setJurisdiction} options={jurisdictions} allLabel="All Jurisdictions" labelFor={jurisdictionLabel} />
              <FilterSelect value={substance} onChange={setSubstance} options={substances} allLabel="All Substances" />
            </div>
            <ListState loading={loading && !loaded} error={error} empty={loaded && rows.length === 0} icon="🏛️" title="No policy items found" text="Try a different jurisdiction or search term." />
            <div style={{ opacity: loading && loaded ? 0.6 : 1, transition: 'opacity 0.2s' }}>
              <Group title="Federal" note="Federal Register rules & notices" color="#c084fc" items={federal} totalCount={jurisdiction === 'All' ? federalTotal : null} />
              <Group title="State Bills" note="State legislation via LegiScan" color="#7dd3c0" items={stateBills} totalCount={jurisdiction === 'All' ? stateTotal : null} />
            </div>
            <Pagination page={page} totalPages={totalPages} total={total} setPage={setPage} loading={loading} noun="items" />
          </div>
        </div>
      );
    };

    // ============================================================
    // FUNDING PAGE — SEC Form D filings feed
    // ============================================================
    const SINCE_OPTIONS = [['All', 'All time'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['365', 'Last 12 months'], ['730', 'Last 2 years']];
    const sinceDate = (days) => days === 'All' ? '' : new Date(Date.now() - Number(days) * 86400000).toISOString().slice(0, 10);

    const FundingPage = ({ user }) => {
      const [search, setSearch] = useState('');
      const [since, setSince] = useState('All');
      const [page, setPage] = useState(1);
      useResetPage(setPage, [search, since]);
      const { rows, total, totalPages, loading, error, loaded } = usePagedQuery('/funding', { search: search.trim(), since: sinceDate(since), page, limit: 25 });
      const facetRows = useFacetRows('/funding');
      const companies = new Set(facetRows.map(f => f.companyName)).size;
      const soldTotal = facetRows.reduce((s, f) => s + (Number(f.totalAmountSold) || 0), 0);
      const latest = facetRows.map(f => f.filedAt).filter(Boolean).sort().pop();

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <PageHeader suffix="funding" title="Funding Filings" subtitle="Private capital raises disclosed to the SEC — Form D and Form D/A filings by companies in the natural medicine sector, newest first.">
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', marginTop: '24px' }}><AlertButton entityType="funding_events" keyword={search} style={{ padding: '12px 24px', fontSize: '14px' }} /></div>
            </PageHeader>
            <StatTiles stats={[
              { value: facetRows.length ? facetRows.length.toLocaleString() : (loaded ? total.toLocaleString() : '—'), label: 'Filings Tracked', color: '#f0b775' },
              { value: facetRows.length ? String(companies) : '—', label: 'Issuers', color: '#7dd3c0' },
              { value: soldTotal > 0 ? fmtMoney(soldTotal) : (facetRows.length ? 'n/a' : '—'), label: 'Disclosed Amount Sold', color: '#98d4a0' },
              { value: latest ? fmtDate(latest) : '—', label: 'Latest Filing', color: '#a8c5e2' }
            ]} />
            <div style={{ display: 'flex', gap: '16px', marginBottom: '32px', flexWrap: 'wrap' }}>
              <input type="text" placeholder="Search issuer names..." value={search} onChange={(e) => setSearch(e.target.value)} style={filterInputStyle} />
              <select value={since} onChange={(e) => setSince(e.target.value)} style={filterSelectStyle}>{SINCE_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
            </div>
            <ListState loading={loading && !loaded} error={error} empty={loaded && rows.length === 0} icon="💰" title="No filings found" text="Try a broader date range or a different issuer name." />
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', opacity: loading && loaded ? 0.6 : 1, transition: 'opacity 0.2s' }}>
              {rows.map(f => {
                const amendment = f.formType === 'D/A';
                const sold = fmtMoney(f.totalAmountSold);
                const offering = fmtMoney(f.totalOfferingAmount);
                const remaining = fmtMoney(f.totalRemaining);
                const persons = f.relatedPersons || [];
                return (
                  <div key={f.id} style={{ ...sharedStyles.card, display: 'flex', gap: '20px', alignItems: 'flex-start' }}>
                    <div style={{ width: '56px', height: '56px', borderRadius: '16px', background: 'rgba(240,183,117,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '26px', flexShrink: 0 }}>{pickEmoji(f.companyName, COMPANY_EMOJIS)}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '8px', alignItems: 'center' }}>
                        <span title={amendment ? 'Amendment to a prior Form D' : 'Notice of exempt offering of securities'} style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: amendment ? 'rgba(168,197,226,0.15)' : 'rgba(240,183,117,0.15)', color: amendment ? '#a8c5e2' : '#f0b775', borderRadius: '4px' }}>Form {f.formType}{amendment ? ' · amendment' : ''}</span>
                        <span style={{ fontSize: '12px', color: '#6b7370' }}>Filed {fmtDate(f.filedAt)}</span>
                        {f.industryGroup && <span style={{ padding: '3px 8px', fontSize: '11px', background: 'rgba(255,255,255,0.05)', color: '#a0a8a4', borderRadius: '4px' }}>{f.industryGroup}</span>}
                        {(f.substances || []).map(s => <SubstanceChip key={s} name={s} />)}
                      </div>
                      <a href={f.url} target="_blank" rel="noopener noreferrer" style={{ display: 'block', fontSize: '18px', fontWeight: 600, color: '#fff', marginBottom: '10px', lineHeight: 1.35, textDecoration: 'none' }}>{f.companyName}</a>
                      {(sold || offering || remaining || f.investorCount != null) && (
                        <div style={{ display: 'flex', gap: '24px', flexWrap: 'wrap', marginBottom: '10px' }}>
                          {sold && <div><div style={{ fontFamily: '"Fraunces", serif', fontSize: '22px', fontWeight: 600, color: '#98d4a0' }}>{sold}</div><div style={{ fontSize: '11px', color: '#6b7370', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Amount sold</div></div>}
                          {offering && <div><div style={{ fontFamily: '"Fraunces", serif', fontSize: '22px', fontWeight: 600, color: '#f0b775' }}>{offering}</div><div style={{ fontSize: '11px', color: '#6b7370', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Total offering</div></div>}
                          {remaining && <div><div style={{ fontFamily: '"Fraunces", serif', fontSize: '22px', fontWeight: 600, color: '#a8c5e2' }}>{remaining}</div><div style={{ fontSize: '11px', color: '#6b7370', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Remaining</div></div>}
                          {f.investorCount != null && <div><div style={{ fontFamily: '"Fraunces", serif', fontSize: '22px', fontWeight: 600, color: '#fff' }}>{f.investorCount.toLocaleString()}</div><div style={{ fontSize: '11px', color: '#6b7370', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Investors</div></div>}
                        </div>
                      )}
                      <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap', fontSize: '12px', color: '#6b7370' }}>
                        {(f.issuerCity || f.issuerState) && <span>📍 {[f.issuerCity, f.issuerState].filter(Boolean).join(', ')}</span>}
                        {f.securityTypes && f.securityTypes.length > 0 && <span>🧾 {f.securityTypes.join(', ')}</span>}
                        {persons.length > 0 && <span>👤 {persons.slice(0, 3).map(p => `${p.name}${p.roles && p.roles.length ? ` (${p.roles.join('/')})` : ''}`).join(', ')}{persons.length > 3 ? ` +${persons.length - 3}` : ''}</span>}
                        {f.matchedTerms && f.matchedTerms.length > 0 && <span>🔎 matched: {f.matchedTerms.join(', ')}</span>}
                        {f.cik && <span>CIK {f.cik}</span>}
                        <span>Source: {f.source}</span>
                      </div>
                    </div>
                    <button onClick={() => window.open(f.url, '_blank')} style={{ ...sharedStyles.buttonOutline, padding: '10px 18px', fontSize: '13px', flexShrink: 0 }}>SEC Filing ↗</button>
                  </div>
                );
              })}
            </div>
            <Pagination page={page} totalPages={totalPages} total={total} setPage={setPage} loading={loading} noun="filings" />
          </div>
        </div>
      );
    };

    // ============================================================
    // GRANTS PAGE — NIH RePORTER awards
    // ============================================================
    const grantUrl = (g) => g.url || (g.projectNumber ? `https://reporter.nih.gov/quickSearch/${encodeURIComponent(g.projectNumber)}` : null);

    const GrantsPage = ({ user }) => {
      const [search, setSearch] = useState('');
      const [substance, setSubstance] = useState('All');
      const [fiscalYear, setFiscalYear] = useState('All');
      const [page, setPage] = useState(1);
      useResetPage(setPage, [search, substance, fiscalYear]);
      const { rows, total, totalPages, loading, error, loaded } = usePagedQuery('/grants', { search: search.trim(), substance, fiscalYear, page, limit: 25 });
      const facetRows = useFacetRows('/grants');
      const substances = optionsFrom(facetRows, g => g.substances || []);
      const fiscalYears = ['All', ...uniqueSorted(facetRows.map(g => g.fiscalYear)).reverse().map(String)];
      const awarded = facetRows.reduce((s, g) => s + (Number(g.awardAmount) || 0), 0);
      const orgs = new Set(facetRows.map(g => g.organization).filter(Boolean)).size;
      const agencies = new Set(facetRows.map(g => g.agency).filter(Boolean)).size;

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <PageHeader suffix="grants" title="Research Grants" subtitle="Federally funded natural medicine research from NIH RePORTER — who is funding what, where, and for how much.">
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', marginTop: '24px' }}><AlertButton entityType="grants" keyword={search} style={{ padding: '12px 24px', fontSize: '14px' }} /></div>
            </PageHeader>
            <StatTiles stats={[
              { value: facetRows.length ? facetRows.length.toLocaleString() : (loaded ? total.toLocaleString() : '—'), label: 'Grants Tracked', color: '#7dd3c0' },
              { value: awarded > 0 ? fmtMoney(awarded) : '—', label: 'Total Awarded', color: '#98d4a0' },
              { value: facetRows.length ? String(orgs) : '—', label: 'Organizations', color: '#a8c5e2' },
              { value: fiscalYears.length > 2 ? `FY ${fiscalYears[fiscalYears.length - 1]}–${fiscalYears[1]}` : fiscalYears.length === 2 ? `FY ${fiscalYears[1]}` : '—', label: `Fiscal Years · ${agencies} agenc${agencies === 1 ? 'y' : 'ies'}`, color: '#f0b775' }
            ]} />
            <div style={{ display: 'flex', gap: '16px', marginBottom: '32px', flexWrap: 'wrap' }}>
              <input type="text" placeholder="Search titles, organizations, investigators..." value={search} onChange={(e) => setSearch(e.target.value)} style={filterInputStyle} />
              <FilterSelect value={substance} onChange={setSubstance} options={substances} allLabel="All Substances" />
              <FilterSelect value={fiscalYear} onChange={setFiscalYear} options={fiscalYears} allLabel="All Fiscal Years" labelFor={(y) => `FY ${y}`} />
            </div>
            <ListState loading={loading && !loaded} error={error} empty={loaded && rows.length === 0} icon="🎯" title="No grants found" text="Try another fiscal year, substance, or search term." />
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', opacity: loading && loaded ? 0.6 : 1, transition: 'opacity 0.2s' }}>
              {rows.map(g => {
                const url = grantUrl(g);
                const amount = fmtMoney(g.awardAmount);
                return (
                  <div key={g.id} style={{ ...sharedStyles.card, display: 'flex', gap: '20px', alignItems: 'flex-start' }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '8px', alignItems: 'center' }}>
                        {g.fiscalYear && <span style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: 'rgba(168,197,226,0.15)', color: '#a8c5e2', borderRadius: '4px' }}>FY {g.fiscalYear}</span>}
                        {g.agency && <span style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: 'rgba(255,255,255,0.05)', color: '#a0a8a4', borderRadius: '4px' }}>{g.agency}</span>}
                        <span style={{ fontSize: '12px', color: '#6b7370' }}>{g.projectNumber}</span>
                        {(g.substances || []).map(s => <SubstanceChip key={s} name={s} />)}
                      </div>
                      {url
                        ? <a href={url} target="_blank" rel="noopener noreferrer" style={{ display: 'block', fontSize: '17px', fontWeight: 600, color: '#fff', marginBottom: '8px', lineHeight: 1.4, textDecoration: 'none' }}>{g.title}</a>
                        : <h3 style={{ fontSize: '17px', fontWeight: 600, color: '#fff', marginBottom: '8px', lineHeight: 1.4 }}>{g.title}</h3>}
                      <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap', fontSize: '13px', color: '#a0a8a4', marginBottom: '8px' }}>
                        {g.piNames && g.piNames.length > 0 && <span>👤 {g.piNames.slice(0, 3).join(', ')}{g.piNames.length > 3 ? ` +${g.piNames.length - 3}` : ''}</span>}
                        {g.organization && <span>🏛️ {g.organization}</span>}
                        {(g.startDate || g.endDate) && <span style={{ color: '#6b7370' }}>🗓️ {fmtDate(g.startDate) || '?'} – {fmtDate(g.endDate) || '?'}</span>}
                      </div>
                      <Expandable text={g.abstract} limit={240} />
                      <div style={{ fontSize: '12px', color: '#4a524e', marginTop: '8px' }}>Source: {g.source}</div>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '10px', flexShrink: 0 }}>
                      {amount && <div style={{ textAlign: 'right' }}><div style={{ fontFamily: '"Fraunces", serif', fontSize: '24px', fontWeight: 600, color: '#98d4a0' }}>{amount}</div><div style={{ fontSize: '11px', color: '#6b7370', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Award</div></div>}
                      {url && <button onClick={() => window.open(url, '_blank')} style={{ ...sharedStyles.buttonOutline, padding: '10px 18px', fontSize: '13px' }}>NIH RePORTER ↗</button>}
                    </div>
                  </div>
                );
              })}
            </div>
            <Pagination page={page} totalPages={totalPages} total={total} setPage={setPage} loading={loading} noun="grants" />
          </div>
        </div>
      );
    };

    // ============================================================
    // READOUTS PAGE — expected trial results windows, soonest first
    // ============================================================
    const READOUT_PHASE_COLORS = { 'Phase 1': '#a8c5e2', 'Phase 1/Phase 2': '#a8c5e2', 'Phase 2': '#f0b775', 'Phase 2/Phase 3': '#f0b775', 'Phase 3': '#7dd3c0', 'Phase 4': '#98d4a0', 'Early Phase 1': '#a8c5e2', 'N/A': '#6b7370' };
    const monthKey = (d) => { const dt = new Date(d + 'T12:00:00'); return Number.isNaN(dt.getTime()) ? 'Unscheduled' : dt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); };
    const fmtWindow = (a, b) => {
      const s = new Date(a + 'T12:00:00'), e = new Date(b + 'T12:00:00');
      if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime())) return `${a} – ${b}`;
      const sameYear = s.getFullYear() === e.getFullYear();
      return `${s.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: sameYear ? undefined : 'numeric' })} – ${e.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
    };

    const ReadoutsPage = ({ user }) => {
      const { setCurrentPage } = useAppUI();
      const [phase, setPhase] = useState('All');
      const [substance, setSubstance] = useState('All');
      // One unfiltered fetch (the server already caps the horizon by plan);
      // phase/substance filter locally so the options never collapse.
      const [state, setState] = useState({ loading: true, rows: null, total: 0 });
      useEffect(() => {
        let cancelled = false;
        api.get(`/readouts${buildQuery({ limit: 500 })}`).then(res => { if (!cancelled) setState({ loading: false, rows: res && Array.isArray(res.data) ? res.data : null, total: res?.total || 0 }); });
        return () => { cancelled = true; };
      }, [user && user.id]);
      const all = state.rows || [];
      const phases = optionsFrom(all, r => r.phase || 'N/A');
      const substances = optionsFrom(all, r => r.substances || []);
      const filtered = all
        .filter(r => (phase === 'All' || (r.phase || 'N/A') === phase) && (substance === 'All' || (r.substances || []).includes(substance)))
        .sort((a, b) => (a.expectedReadoutStart || '').localeCompare(b.expectedReadoutStart || ''));
      const groups = [];
      filtered.forEach(r => { const k = monthKey(r.expectedReadoutStart); const g = groups[groups.length - 1]; if (g && g.key === k) g.items.push(r); else groups.push({ key: k, items: [r] }); });
      const paid = isPaidPlan(user);
      const horizonEnd = all.map(r => r.expectedReadoutStart).sort().pop();
      const phaseColor = (p) => READOUT_PHASE_COLORS[p] || '#a0a8a4';

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <PageHeader suffix="readouts" title="Readout Calendar" subtitle="When to expect results: each window is a trial's registered completion date plus the typical 3–9 month publication lag. Soonest first." />
            {!paid && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '16px', flexWrap: 'wrap', padding: '16px 20px', marginBottom: '32px', background: 'linear-gradient(135deg, rgba(125,211,192,0.10) 0%, rgba(168,197,226,0.06) 100%)', border: '1px solid rgba(125,211,192,0.25)', borderRadius: '16px' }}>
                <div style={{ fontSize: '14px', color: '#e8ebe9' }}><strong style={{ color: '#7dd3c0' }}>Showing the next 90 days.</strong> Pro unlocks the full 18-month readout calendar.</div>
                <button onClick={() => setCurrentPage(user ? 'account' : 'home')} style={{ ...sharedStyles.button, padding: '10px 20px', fontSize: '13px' }}>{user ? 'Upgrade to Pro' : 'See plans'}</button>
              </div>
            )}
            <StatTiles stats={[
              { value: state.rows ? String(filtered.length) : '—', label: 'Expected Readouts', color: '#7dd3c0' },
              { value: state.rows ? String(filtered.filter(r => /3/.test(r.phase || '')).length) : '—', label: 'Phase 3 Readouts', color: '#f0b775' },
              { value: state.rows ? String(new Set(filtered.map(r => r.sponsor).filter(Boolean)).size) : '—', label: 'Sponsors', color: '#a8c5e2' },
              { value: state.rows ? (paid ? '18 months' : '90 days') : '—', label: 'Calendar Horizon', color: '#d4a5c9' }
            ]} />
            <div style={{ display: 'flex', gap: '16px', marginBottom: '32px', flexWrap: 'wrap' }}>
              <FilterSelect value={phase} onChange={setPhase} options={phases} allLabel="All Phases" />
              <FilterSelect value={substance} onChange={setSubstance} options={substances} allLabel="All Substances" />
              {horizonEnd && <span style={{ fontSize: '13px', color: '#6b7370', alignSelf: 'center' }}>Windows opening through {fmtDate(horizonEnd)}</span>}
            </div>
            <ListState loading={state.loading} error={!state.loading && state.rows === null ? 'Could not load the readout calendar from the Neuly API.' : null} empty={!state.loading && state.rows !== null && filtered.length === 0} icon="🗓️" title="No readouts in this window" text={paid ? 'No trials match these filters in the next 18 months.' : 'No trials match these filters in the next 90 days — Pro extends the calendar to 18 months.'} />
            <div style={{ position: 'relative', paddingLeft: '28px' }}>
              {groups.length > 0 && <div style={{ position: 'absolute', left: '7px', top: '8px', bottom: '8px', width: '2px', background: 'rgba(255,255,255,0.08)' }} />}
              {groups.map(g => (
                <div key={g.key} style={{ marginBottom: '36px', position: 'relative' }}>
                  <div style={{ position: 'absolute', left: '-28px', top: '4px', width: '16px', height: '16px', borderRadius: '50%', background: '#0a0f0d', border: '3px solid #7dd3c0' }} />
                  <h2 style={{ fontFamily: '"Fraunces", serif', fontSize: '24px', fontWeight: 600, color: '#fff', marginBottom: '16px' }}>{g.key} <span style={{ fontSize: '14px', color: '#6b7370', fontFamily: '"DM Sans", sans-serif', fontWeight: 500 }}>· {g.items.length} expected</span></h2>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                    {g.items.map(r => (
                      <div key={r.trialId} style={{ ...sharedStyles.card, display: 'flex', gap: '20px', alignItems: 'flex-start', padding: '22px 24px' }}>
                        <div style={{ minWidth: '150px', flexShrink: 0 }}>
                          <div style={{ fontSize: '13px', fontWeight: 600, color: '#7dd3c0', marginBottom: '4px' }}>{fmtWindow(r.expectedReadoutStart, r.expectedReadoutEnd)}</div>
                          <div style={{ fontSize: '11px', color: '#6b7370', lineHeight: 1.5 }}>{r.anchorField === 'primaryCompletionDate' ? 'Primary completion' : 'Study completion'}: {fmtDate(r.anchorDate)}</div>
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '8px', alignItems: 'center' }}>
                            <span style={{ padding: '3px 8px', fontSize: '11px', fontWeight: 600, background: `${phaseColor(r.phase || 'N/A')}20`, color: phaseColor(r.phase || 'N/A'), borderRadius: '4px' }}>{r.phase || 'Phase N/A'}</span>
                            <span style={{ padding: '3px 8px', fontSize: '11px', background: 'rgba(255,255,255,0.05)', color: '#a0a8a4', borderRadius: '4px' }}>{r.status}</span>
                            {r.enrollment != null && <span style={{ padding: '3px 8px', fontSize: '11px', background: 'rgba(255,255,255,0.03)', color: '#6b7370', borderRadius: '4px' }}>n={r.enrollment}</span>}
                            {(r.substances || []).map(s => <SubstanceChip key={s} name={s} />)}
                          </div>
                          <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ display: 'block', fontSize: '16px', fontWeight: 600, color: '#fff', marginBottom: '6px', lineHeight: 1.4, textDecoration: 'none' }}>{r.title}</a>
                          <p style={{ fontSize: '13px', color: '#6b7370' }}>{r.sponsor || 'Sponsor not listed'}{r.conditions && r.conditions.length ? ` · ${r.conditions.slice(0, 3).join(', ')}` : ''} · {r.nctId}</p>
                        </div>
                        <button onClick={() => window.open(r.url, '_blank')} style={{ ...sharedStyles.buttonOutline, padding: '10px 18px', fontSize: '13px', flexShrink: 0 }}>View Trial ↗</button>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ============================================================
    // ACCOUNT PAGE — plan & billing, alerts, CSV export, API keys
    // ============================================================
    const PLAN_META = {
      free: { name: 'Free', color: '#a0a8a4', blurb: '1 alert, 7-day change history, 90-day readout calendar.' },
      pro: { name: 'Pro', color: '#7dd3c0', blurb: 'Unlimited alerts, full change history, 18-month readout calendar, CSV exports.' },
      enterprise: { name: 'Enterprise', color: '#f0b775', blurb: 'Everything in Pro plus API access with keys for your own integrations.' }
    };
    const copyText = async (text) => {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) {
        try { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); return true; } catch (e2) { return false; }
      }
    };
    const ErrorNote = ({ text }) => text ? <div style={{ marginTop: '12px', padding: '12px 16px', fontSize: '13px', color: '#e57373', background: 'rgba(229,115,115,0.1)', border: '1px solid rgba(229,115,115,0.3)', borderRadius: '10px' }}>{text}</div> : null;
    const SectionCard = ({ title, badge, children }) => (
      <div style={{ ...sharedStyles.card, marginBottom: '24px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '18px', flexWrap: 'wrap' }}>
          <h2 style={{ fontSize: '18px', fontWeight: 600, color: '#fff' }}>{title}</h2>
          {badge}
        </div>
        {children}
      </div>
    );
    const PlanBadge = ({ text, color = '#7dd3c0' }) => <span style={{ padding: '3px 10px', fontSize: '11px', fontWeight: 600, background: `${color}20`, color, borderRadius: '12px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>{text}</span>;

    const AccountPage = ({ user, prefill, clearPrefill }) => {
      const { openAuth, setCurrentPage } = useAppUI();
      const plan = (user && user.plan) || 'free';
      const meta = PLAN_META[plan] || PLAN_META.free;
      const paid = isPaidPlan(user);

      // --- billing ---
      const [billingBusy, setBillingBusy] = useState(null);
      const [billingError, setBillingError] = useState(null);
      const billing = async (path, body, key) => {
        setBillingBusy(key); setBillingError(null);
        try {
          const res = await api.post(path, body);
          if (!res || !res.url) throw new Error('The billing service did not return a redirect URL.');
          window.location.assign(res.url);
        } catch (err) {
          setBillingError(err.message === 'Failed to fetch' ? 'Could not reach the Neuly API.' : err.message);
          setBillingBusy(null);
        }
      };

      // --- alerts ---
      const [alerts, setAlerts] = useState(null);
      const [alertType, setAlertType] = useState((prefill && prefill.entityType) || 'All');
      const [alertKeyword, setAlertKeyword] = useState((prefill && prefill.keyword) || '');
      const [alertError, setAlertError] = useState(null);
      const [alertBusy, setAlertBusy] = useState(false);
      const alertFormRef = useRef(null);
      const loadAlerts = () => api.get('/alerts').then(res => setAlerts(res && Array.isArray(res.data) ? res.data : (res === null ? null : [])));
      useEffect(() => { if (user) loadAlerts(); }, [user && user.id]);
      useEffect(() => {
        if (prefill) {
          setAlertType(prefill.entityType || 'All');
          setAlertKeyword(prefill.keyword || '');
          setTimeout(() => alertFormRef.current && alertFormRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
          clearPrefill && clearPrefill();
        }
      }, [prefill]);
      const createAlert = async (e) => {
        e.preventDefault();
        if (alertBusy) return;
        setAlertBusy(true); setAlertError(null);
        try {
          await api.post('/alerts', { entityType: alertType === 'All' ? null : alertType, keyword: alertKeyword.trim() || null });
          setAlertKeyword('');
          await loadAlerts();
        } catch (err) { setAlertError(err.message); } finally { setAlertBusy(false); }
      };
      const deleteAlert = async (id) => {
        setAlerts(prev => (prev || []).filter(a => a.id !== id));
        try { await api.del(`/alerts/${id}`); } catch (err) { setAlertError(err.message); loadAlerts(); }
      };

      // --- API keys (enterprise) ---
      const [keys, setKeys] = useState(null);
      const [keyLabel, setKeyLabel] = useState('');
      const [newKey, setNewKey] = useState(null);
      const [keyError, setKeyError] = useState(null);
      const [copied, setCopied] = useState(false);
      const loadKeys = () => api.get('/keys').then(res => setKeys(res && Array.isArray(res.data) ? res.data : []));
      useEffect(() => { if (user && plan === 'enterprise') loadKeys(); }, [user && user.id, plan]);
      const createKey = async (e) => {
        e.preventDefault(); setKeyError(null);
        try {
          const res = await api.post('/keys', { label: keyLabel.trim() || null });
          setNewKey(res); setKeyLabel(''); setCopied(false);
          await loadKeys();
        } catch (err) { setKeyError(err.message); }
      };
      const revokeKey = async (id) => {
        try { await api.del(`/keys/${id}`); await loadKeys(); } catch (err) { setKeyError(err.message); }
      };

      if (!user) {
        return (
          <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
            <div style={{ padding: '40px', maxWidth: '640px', margin: '0 auto', textAlign: 'center' }}>
              <div style={{ fontSize: '48px', marginBottom: '16px' }}>⚙️</div>
              <h1 style={{ fontFamily: '"Fraunces", serif', fontSize: '36px', fontWeight: 600, color: '#fff', marginBottom: '12px' }}>Your account</h1>
              <p style={{ fontSize: '16px', color: '#a0a8a4', marginBottom: '28px', lineHeight: 1.6 }}>Log in to manage your plan, research alerts, CSV exports, and API keys.</p>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'center' }}>
                <button onClick={() => openAuth('login')} style={sharedStyles.button}>Log In</button>
                <button onClick={() => openAuth('signup')} style={sharedStyles.buttonOutline}>Create Free Account</button>
              </div>
            </div>
          </div>
        );
      }

      const inputStyle = { ...authInputStyle, padding: '12px 16px', fontSize: '14px' };
      const selectStyle = { ...filterSelectStyle, padding: '12px 16px', color: '#fff' };

      return (
        <div style={{ position: 'relative', zIndex: 1, paddingTop: '100px', minHeight: '100vh' }}>
          <div style={{ padding: '40px', maxWidth: '1280px', margin: '0 auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '20px', marginBottom: '36px', flexWrap: 'wrap' }}>
              <div style={{ width: '64px', height: '64px', borderRadius: '50%', background: 'linear-gradient(135deg, #7dd3c0 0%, #a8c5e2 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '26px', fontWeight: 600, color: '#0a0f0d' }}>{initialOf(user)}</div>
              <div style={{ flex: 1, minWidth: '200px' }}>
                <h1 style={{ fontFamily: '"Fraunces", serif', fontSize: '32px', fontWeight: 600, color: '#fff', marginBottom: '4px' }}>{displayName(user)}</h1>
                <p style={{ fontSize: '14px', color: '#6b7370' }}>{user.email}</p>
              </div>
              <button onClick={() => setCurrentPage('dashboard')} style={{ ...sharedStyles.buttonOutline, padding: '10px 20px', fontSize: '13px' }}>← Dashboard</button>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px', alignItems: 'start' }}>
              <div>
                {/* Plan & billing */}
                <SectionCard title="Plan" badge={<PlanBadge text={`${meta.name} plan`} color={meta.color} />}>
                  <p style={{ fontSize: '14px', color: '#a0a8a4', lineHeight: 1.6, marginBottom: '18px' }}>{meta.blurb}</p>
                  <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                    {plan === 'free' && <button disabled={Boolean(billingBusy)} onClick={() => billing('/billing/checkout', { plan: 'pro' }, 'pro')} style={{ ...sharedStyles.button, padding: '12px 22px', fontSize: '14px', opacity: billingBusy ? 0.6 : 1 }}>{billingBusy === 'pro' ? 'Redirecting…' : 'Upgrade to Pro'}</button>}
                    {plan !== 'enterprise' && <button disabled={Boolean(billingBusy)} onClick={() => billing('/billing/checkout', { plan: 'enterprise' }, 'enterprise')} style={{ ...(plan === 'pro' ? sharedStyles.button : sharedStyles.buttonOutline), padding: '12px 22px', fontSize: '14px', opacity: billingBusy ? 0.6 : 1 }}>{billingBusy === 'enterprise' ? 'Redirecting…' : 'Upgrade to Enterprise'}</button>}
                    {paid && <button disabled={Boolean(billingBusy)} onClick={() => billing('/billing/portal', undefined, 'portal')} style={{ ...sharedStyles.buttonOutline, padding: '12px 22px', fontSize: '14px', opacity: billingBusy ? 0.6 : 1 }}>{billingBusy === 'portal' ? 'Redirecting…' : 'Manage billing'}</button>}
                  </div>
                  <ErrorNote text={billingError} />
                </SectionCard>

                {/* CSV export */}
                <SectionCard title="CSV Export" badge={<PlanBadge text="Pro · Enterprise" color="#f0b775" />}>
                  <p style={{ fontSize: '14px', color: '#a0a8a4', lineHeight: 1.6, marginBottom: '16px' }}>{paid ? 'Download any dataset as CSV. Each file opens in a new tab.' : 'CSV downloads of every dataset are included with Pro and Enterprise.'}</p>
                  <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                    {EXPORT_TYPES.map(([type, label]) => (
                      <button key={type} disabled={!paid} title={paid ? `Download ${label} as CSV` : 'Upgrade to Pro to export'} onClick={() => paid && window.open(`${API_BASE_URL}/export/${type}`, '_blank')} style={{ ...sharedStyles.buttonOutline, padding: '8px 14px', fontSize: '12px', opacity: paid ? 1 : 0.45, cursor: paid ? 'pointer' : 'not-allowed' }}>⬇ {label}</button>
                    ))}
                  </div>
                  {!paid && <div style={{ marginTop: '14px', fontSize: '13px', color: '#6b7370' }}>🔒 Exports are locked on the Free plan — <span onClick={() => billing('/billing/checkout', { plan: 'pro' }, 'pro')} style={{ color: '#7dd3c0', cursor: 'pointer', fontWeight: 500 }}>upgrade to Pro</span> to enable them.</div>}
                </SectionCard>
              </div>

              <div>
                {/* Alerts */}
                <SectionCard title="Research Alerts" badge={<PlanBadge text={plan === 'free' ? '1 alert on Free' : 'Unlimited'} color={plan === 'free' ? '#a0a8a4' : '#7dd3c0'} />}>
                  <p style={{ fontSize: '14px', color: '#a0a8a4', lineHeight: 1.6, marginBottom: '16px' }}>Get emailed when new records match a dataset and/or keyword after each crawl.</p>
                  <form ref={alertFormRef} onSubmit={createAlert} style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '16px' }}>
                    <select value={alertType} onChange={(e) => setAlertType(e.target.value)} style={{ ...selectStyle, minWidth: '170px' }}>
                      <option value="All">All datasets</option>
                      {ALERT_ENTITY_TYPES.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
                    </select>
                    <input value={alertKeyword} onChange={(e) => setAlertKeyword(e.target.value)} placeholder="Keyword (optional, e.g. psilocybin)" style={{ ...inputStyle, flex: 1, minWidth: '180px', width: 'auto' }} />
                    <button type="submit" disabled={alertBusy} style={{ ...sharedStyles.button, padding: '12px 20px', fontSize: '14px', opacity: alertBusy ? 0.6 : 1 }}>{alertBusy ? 'Saving…' : '+ Add alert'}</button>
                  </form>
                  <ErrorNote text={alertError} />
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginTop: alertError ? '12px' : 0 }}>
                    {alerts === null && <p style={{ fontSize: '13px', color: '#6b7370' }}>Loading alerts…</p>}
                    {alerts && alerts.length === 0 && <p style={{ fontSize: '13px', color: '#6b7370' }}>No alerts yet. Add one above, or use “Create alert” on the Research, Policy, Funding and Grants pages.</p>}
                    {(alerts || []).map(a => (
                      <div key={a.id} style={{ display: 'flex', alignItems: 'center', gap: '14px', padding: '12px 16px', background: 'rgba(255,255,255,0.02)', borderRadius: '12px', borderLeft: '3px solid #7dd3c0' }}>
                        <span style={{ fontSize: '18px' }}>🔔</span>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: '14px', color: '#fff', fontWeight: 500 }}>{entityLabel(a.entity_type)}{a.keyword ? <span style={{ color: '#7dd3c0' }}> · “{a.keyword}”</span> : ''}</div>
                          <div style={{ fontSize: '12px', color: '#6b7370' }}>Created {timeAgo(a.created_at)}{a.last_notified_at ? ` · last emailed ${timeAgo(a.last_notified_at)}` : ' · not triggered yet'}</div>
                        </div>
                        <button onClick={() => deleteAlert(a.id)} style={{ ...sharedStyles.buttonOutline, padding: '6px 12px', fontSize: '12px', color: '#e57373', borderColor: 'rgba(229,115,115,0.3)' }}>Delete</button>
                      </div>
                    ))}
                  </div>
                </SectionCard>

                {/* API keys */}
                <SectionCard title="API Keys" badge={<PlanBadge text="Enterprise" color="#f0b775" />}>
                  {plan !== 'enterprise' ? (
                    <p style={{ fontSize: '14px', color: '#a0a8a4', lineHeight: 1.6 }}>🔒 Programmatic access to the Neuly API is part of the Enterprise plan. <span onClick={() => billing('/billing/checkout', { plan: 'enterprise' }, 'enterprise')} style={{ color: '#7dd3c0', cursor: 'pointer', fontWeight: 500 }}>Upgrade to Enterprise</span> to create keys.</p>
                  ) : (
                    <>
                      <p style={{ fontSize: '14px', color: '#a0a8a4', lineHeight: 1.6, marginBottom: '16px' }}>Send keys as <code style={{ color: '#7dd3c0' }}>Authorization: Bearer nk_…</code>. A key is shown once at creation.</p>
                      <form onSubmit={createKey} style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '16px' }}>
                        <input value={keyLabel} onChange={(e) => setKeyLabel(e.target.value)} placeholder="Label (e.g. data warehouse sync)" style={{ ...inputStyle, flex: 1, minWidth: '180px', width: 'auto' }} />
                        <button type="submit" style={{ ...sharedStyles.button, padding: '12px 20px', fontSize: '14px' }}>+ Create key</button>
                      </form>
                      <ErrorNote text={keyError} />
                      {newKey && newKey.key && (
                        <div style={{ margin: '12px 0 16px', padding: '16px', background: 'rgba(125,211,192,0.08)', border: '1px solid rgba(125,211,192,0.3)', borderRadius: '12px' }}>
                          <div style={{ fontSize: '13px', color: '#7dd3c0', fontWeight: 600, marginBottom: '8px' }}>New key{newKey.label ? ` · ${newKey.label}` : ''} — copy it now, it won't be shown again</div>
                          <div style={{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' }}>
                            <code style={{ flex: 1, minWidth: '200px', padding: '10px 12px', background: 'rgba(0,0,0,0.35)', borderRadius: '8px', color: '#fff', fontSize: '13px', wordBreak: 'break-all', userSelect: 'all' }}>{newKey.key}</code>
                            <button onClick={async () => setCopied(await copyText(newKey.key))} style={{ ...sharedStyles.buttonOutline, padding: '10px 16px', fontSize: '13px' }}>{copied ? 'Copied ✓' : 'Copy'}</button>
                            <button onClick={() => setNewKey(null)} style={{ background: 'transparent', border: 'none', color: '#6b7370', fontSize: '13px', cursor: 'pointer' }}>Dismiss</button>
                          </div>
                        </div>
                      )}
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                        {keys === null && <p style={{ fontSize: '13px', color: '#6b7370' }}>Loading keys…</p>}
                        {keys && keys.length === 0 && <p style={{ fontSize: '13px', color: '#6b7370' }}>No API keys yet.</p>}
                        {(keys || []).map(k => (
                          <div key={k.id} style={{ display: 'flex', alignItems: 'center', gap: '14px', padding: '12px 16px', background: 'rgba(255,255,255,0.02)', borderRadius: '12px', opacity: k.revoked_at ? 0.5 : 1 }}>
                            <span style={{ fontSize: '18px' }}>🔑</span>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontSize: '14px', color: '#fff', fontWeight: 500 }}>{k.label || 'Untitled key'} <span style={{ fontSize: '11px', color: '#4a524e' }}>{k.id}</span></div>
                              <div style={{ fontSize: '12px', color: '#6b7370' }}>Created {timeAgo(k.created_at)}{k.last_used_at ? ` · last used ${timeAgo(k.last_used_at)}` : ' · never used'}{k.revoked_at ? ' · revoked' : ''}</div>
                            </div>
                            {!k.revoked_at && <button onClick={() => revokeKey(k.id)} style={{ ...sharedStyles.buttonOutline, padding: '6px 12px', fontSize: '12px', color: '#e57373', borderColor: 'rgba(229,115,115,0.3)' }}>Revoke</button>}
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </SectionCard>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Footer = () => (
      <footer style={{ borderTop: '1px solid rgba(255,255,255,0.06)', padding: '60px 40px 40px', position: 'relative', zIndex: 1 }}>
        <div style={{ maxWidth: '1280px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '24px' }}>
          <NeulyLogo height={18} />
          <p style={{ fontSize: '13px', color: '#4a524e' }}>© 2026 Neuly. All rights reserved.</p>
        </div>
      </footer>
    );

    // Main App
    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [user, setUser] = useState(null);
      const [authModal, setAuthModal] = useState(null); // null | 'login' | 'signup'
      const [selectedCompany, setSelectedCompany] = useState(null);
      const [selectedPerson, setSelectedPerson] = useState(null);
      // "Create alert for this" hands { entityType, keyword } to the Account page
      const [alertPrefill, setAlertPrefill] = useState(null);
      // Stripe returns to /account?upgraded=1 — open the Account page there
      const wantsAccount = /^\/account/.test(window.location.pathname);

      // Restore an existing session cookie on load. Raw fetch: a 401 here
      // just means "not signed in", which isn't an error worth logging.
      useEffect(() => {
        let cancelled = false;
        fetch(`${API_BASE_URL}/auth/me`, { credentials: 'include' })
          .then(r => (r.ok ? r.json() : null))
          .then(res => { if (!cancelled && res && res.user) { setUser(res.user); if (wantsAccount) setCurrentPage('account'); } })
          .catch(() => undefined);
        return () => { cancelled = true; };
      }, []);

      const openAuth = (mode) => setAuthModal(mode || 'signup');
      const requestAlert = (entityType, keyword) => {
        if (!user) { openAuth('login'); return; }
        setAlertPrefill({ entityType: entityType || null, keyword: keyword || '' });
        setCurrentPage('account');
        window.scrollTo(0, 0);
      };
      const onAuthed = (authedUser) => {
        setUser(authedUser);
        setAuthModal(null);
        setCurrentPage('dashboard');
        window.scrollTo(0, 0);
      };
      const signOut = () => {
        api.post('/auth/logout').catch(() => undefined);
        setUser(null);
        setCurrentPage('home');
      };

      const homePage = (
        <>
          <HeroSection setCurrentPage={setCurrentPage} openAuth={openAuth} />
          <SubstancesSection />
          <ResearchHomeSection setCurrentPage={setCurrentPage} />
          <CompaniesHomeSection setCurrentPage={setCurrentPage} />
          <PeopleHomeSection setCurrentPage={setCurrentPage} />
          <EducationHomeSection setCurrentPage={setCurrentPage} />
          <CareHomeSection setCurrentPage={setCurrentPage} />
          <FinalCTA openAuth={openAuth} />
        </>
      );

      const renderPage = () => {
        switch(currentPage) {
          case 'home':
            return homePage;
          case 'dashboard':
            return user ? <DashboardPage user={user} setCurrentPage={setCurrentPage} /> : homePage;
          case 'research':
            return <ResearchPage user={user} />;
          case 'agent':
            return <ResearchAgentPage user={user} />;
          case 'policy':
            return <PolicyPage user={user} />;
          case 'funding':
            return <FundingPage user={user} />;
          case 'grants':
            return <GrantsPage user={user} />;
          case 'readouts':
            return <ReadoutsPage user={user} />;
          case 'account':
            return <AccountPage user={user} prefill={alertPrefill} clearPrefill={() => setAlertPrefill(null)} />;
          case 'companies':
            return <CompaniesPage user={user} setSelectedCompany={setSelectedCompany} setCurrentPage={setCurrentPage} />;
          case 'company-profile':
            return <CompanyProfilePage company={selectedCompany} setCurrentPage={setCurrentPage} setSelectedPerson={setSelectedPerson} />;
          case 'people':
            return <PeoplePage user={user} setSelectedPerson={setSelectedPerson} setCurrentPage={setCurrentPage} />;
          case 'person-profile':
            return <PersonProfilePage person={selectedPerson} setCurrentPage={setCurrentPage} setSelectedCompany={setSelectedCompany} />;
          case 'education':
            return <EducationPage user={user} />;
          case 'care':
            return <CarePage user={user} />;
          case 'studies':
            return <StudiesPage user={user} />;
          case 'jobs':
            return <JobsPage user={user} />;
          case 'events':
            return <EventsPage user={user} />;
          default:
            return user ? <DashboardPage user={user} setCurrentPage={setCurrentPage} /> : homePage;
        }
      };

      const isMobile = useIsMobile();
      const appMode = Boolean(user) && isMobile;

      return (
        <AppUIContext.Provider value={{ user, openAuth, setCurrentPage, requestAlert }}>
        <SavesProvider user={user} requireAuth={openAuth}>
          <div style={{ ...sharedStyles.container, ...(appMode ? { paddingBottom: 'calc(84px + env(safe-area-inset-bottom))' } : {}) }}>
            <AmbientBackground />
            <Navigation user={user} openAuth={openAuth} signOut={signOut} currentPage={currentPage} setCurrentPage={setCurrentPage} />
            {renderPage()}
            {!appMode && <Footer />}
            {authModal && <AuthModal mode={authModal} setMode={setAuthModal} onClose={() => setAuthModal(null)} onAuthed={onAuthed} />}
          </div>
        </SavesProvider>
        </AppUIContext.Provider>
      );
    };

    // API Status Indicator Component
    const ApiStatusIndicator = () => {
      const apiData = useApiData();
      const isMobile = useIsMobile();
      if (!apiData) return null;

      const { usingApi, loading, attempts } = apiData;

      // On mobile/tablet the pill would collide with the bottom tab bar
      if (isMobile) return null;

      // Connected → teal "Live Data". While retrying → amber "Connecting…".
      // After several failures the API clearly isn't there (e.g. the frontend is
      // being served without its backend) → red "API offline" instead of
      // pretending a reconnect is imminent. Retries continue in the background.
      const offline = !usingApi && attempts >= 4;
      const color = usingApi ? '#7dd3c0' : offline ? '#e57373' : '#f0b775';
      const label = usingApi ? 'Live Data' : offline ? 'API offline' : 'Connecting…';

      return (
        <div style={{
          position: 'fixed',
          bottom: '20px',
          right: '20px',
          zIndex: 1000,
          display: 'flex',
          alignItems: 'center',
          gap: '8px',
          padding: '8px 16px',
          background: `${color}26`,
          border: `1px solid ${color}4d`,
          borderRadius: '20px',
          fontSize: '12px',
          color
        }}>
          <div style={{
            width: '8px',
            height: '8px',
            borderRadius: '50%',
            background: color,
            animation: 'pulse 2s ease-in-out infinite'
          }} />
          {label}
        </div>
      );
    };

    // Wrapped App with DataProvider
    const WrappedApp = () => (
      <DataProvider>
        <App />
        <ApiStatusIndicator />
      </DataProvider>
    );

    ReactDOM.render(<WrappedApp />, document.getElementById('root'));
  </script>
</body>
</html>
